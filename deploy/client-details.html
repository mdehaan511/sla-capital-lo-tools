<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Details — SLA Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="sla-api.js"></script>
  <script src="sla-nav.js"></script>
<script src="/sla-search.js"></script>
  <script src="sla-forms.js"></script>
  <script src="sla-notifications.js"></script>
<script src="sla-chat.js"></script>
  <script src="quotes.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C8813A; --gold-mid: #b5712d; --gold-light: rgba(200,129,58,0.10);
      --gold-border: rgba(200,129,58,0.28); --dark: #261a36; --bg: #f0ece5;
      --surface: #ffffff; --text: #1a1520; --muted: #7a7488; --border: #ddd8d0;
      --border-focus: #C8813A; --pill-bg: #f7f5f1;
      --success: #256940; --warn: #7a5218; --danger: #7c1f1f;
      --r: 12px; --r-sm: 8px; --r-xs: 6px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 1rem 5rem; }

    .nav { max-width: 960px; margin: 0 auto; padding: 1.5rem 0 0; display: flex; align-items: center; justify-content: space-between; }
    .nav img { height: 44px; width: auto; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .nav-tools-btn {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--gold-border, rgba(200,129,58,0.28));
      background: var(--gold-light, rgba(200,129,58,0.10));
      color: var(--gold-mid, #b5712d);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      text-decoration: none;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .nav-tools-btn:hover {
      background: var(--gold, #C8813A);
      color: #fff;
      border-color: var(--gold, #C8813A);
    }
    .nav-tool-link { font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); transition: all 0.15s; }
    .nav-tool-link:hover { border-color: var(--gold); color: var(--gold); }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 7px 14px; border: 1.5px solid var(--border); border-radius: 20px; transition: all 0.15s; }
    .back-btn:hover { color: var(--gold); border-color: var(--gold-border); }
    .back-btn svg { transition: transform 0.15s; }
    .back-btn:hover svg { transform: translateX(-2px); }

    .page { max-width: 960px; margin: 0 auto; padding-top: 2rem; }

    .page-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 2rem; }
    .client-avatar-lg { width: 64px; height: 64px; border-radius: 50%; background: var(--dark); color: #fff; font-family: 'Lora', serif; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .page-header-info { flex: 1; }
    .page-title { font-family: 'Lora', serif; font-size: 26px; font-weight: 600; color: var(--text); line-height: 1.2; }
    .page-subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 20px; }
    .section-head { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .section-head h2 { font-family: 'Lora', serif; font-size: 16px; font-weight: 600; }
    .section-body { padding: 1.5rem; }

    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
    .profile-grid .span2 { grid-column: 1/-1; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .field input { border: 1.5px solid var(--border); border-radius: var(--r-xs); padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); background: var(--surface); transition: border-color 0.15s; }
    .field input:focus { outline: none; border-color: var(--gold); }
    .field input.has-err { border-color: var(--danger); }
    .email-err { color: var(--danger); font-size: 11.5px; line-height: 1.3; margin-top: 4px; padding-left: 2px; }
    .field .read-val { font-size: 14px; color: var(--text); padding: 10px 0; font-family: 'DM Mono', monospace; }

    .save-profile-btn { height: 40px; padding: 0 20px; background: var(--dark); color: #fff; border: none; border-radius: var(--r-xs); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .save-profile-btn:hover { background: var(--gold); }

    /* Loans table */
    .loans-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .loans-table th { padding: 10px 12px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 2px solid var(--border); }
    .loans-table td { padding: 12px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .loans-table tr:last-child td { border-bottom: none; }
    .loans-table tr:hover td { background: var(--bg); }
    .td-mono { font-family: 'DM Mono', monospace; font-size: 12px; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 20px; border: 1px solid transparent; }
    .badge.dscr { background: rgba(38,26,54,0.08); color: var(--dark); border-color: rgba(38,26,54,0.2); }
    .badge.rtl  { background: rgba(200,129,58,0.10); color: var(--gold-mid); border-color: var(--gold-border); }
    .details-link { font-size: 11px; font-weight: 600; color: var(--gold); text-decoration: none; padding: 4px 10px; border: 1px solid var(--gold-border); border-radius: 20px; white-space: nowrap; transition: all 0.15s; }
    .details-link:hover { background: var(--gold-light); }
    .del-loan-btn { font-size: 11px; color: var(--danger); background: none; border: 1px solid rgba(124,31,31,0.2); border-radius: 20px; padding: 3px 8px; cursor: pointer; transition: all 0.15s; }
    .del-loan-btn:hover { background: rgba(124,31,31,0.06); }

    .empty-state { padding: 3rem 1.5rem; text-align: center; }
    .empty-state h3 { font-family: 'Lora', serif; font-size: 16px; margin-bottom: 8px; color: var(--text); }
    .empty-state p { font-size: 13px; color: var(--muted); }

    .meta-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .meta-pill { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); background: var(--pill-bg); }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--dark); color: #fff; font-size: 13px; font-weight: 500; padding: 10px 20px; border-radius: 30px; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; z-index: 9999; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .loading { text-align: center; padding: 4rem; font-size: 14px; color: var(--muted); }
    .danger-zone { border-top: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .danger-zone p { font-size: 12px; color: var(--muted); }
    .del-client-btn { font-size: 12px; color: var(--danger); background: none; border: 1px solid rgba(124,31,31,0.2); border-radius: var(--r-xs); padding: 6px 14px; cursor: pointer; font-weight: 600; transition: all 0.15s; }
    .del-client-btn:hover { background: rgba(124,31,31,0.06); }
      .nav-tool-link { font-size:12px; font-weight:600; color:var(--muted); text-decoration:none; padding:5px 12px; border-radius:20px; border:1px solid var(--border); transition:all 0.15s; white-space:nowrap; }
    .nav-tool-link:hover { border-color:var(--gold); color:var(--gold); }
    .nav-tool-link.current { background:var(--dark); border-color:var(--dark); color:#fff; }
    .logout-btn { font-size:12px; font-weight:600; color:var(--muted); background:transparent; border:1px solid var(--border); padding:5px 12px; border-radius:20px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.15s; -webkit-appearance:none; appearance:none; }
    .logout-btn:hover { border-color:var(--gold); color:var(--gold); }
  </style>
</head>
<body>

<!-- Create New Loan modal (Deploy 170). Opens from the action row above
     the Client Profile section. LO picks DSCR or RTL; we open the right
     sizer with prefillContact=1 + clientId so the borrower name / email /
     phone are filled in but no existing loan loads. -->
<div class="modal-bg" id="createLoanModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;padding:20px">
  <div class="modal" style="background:var(--surface);border-radius:12px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.25)">
    <h3 style="font-family:'Lora',serif;font-size:20px;margin:0 0 6px;color:var(--text)">Create New Loan</h3>
    <p style="font-size:13px;color:var(--muted);margin:0 0 18px">Which loan type are you running for this borrower?</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button type="button" onclick="createLoanOfType('dscr')" style="padding:14px 18px;background:var(--gold-light);border:1.5px solid var(--gold-border);border-radius:8px;font-size:14px;font-weight:600;color:var(--gold-mid);cursor:pointer;font-family:inherit;text-align:left">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <span>DSCR</span>
          <span style="font-size:11px;font-weight:400;color:var(--muted)">Long-term rental · 30Y / ARM</span>
        </div>
      </button>
      <button type="button" onclick="createLoanOfType('rtl')" style="padding:14px 18px;background:var(--gold-light);border:1.5px solid var(--gold-border);border-radius:8px;font-size:14px;font-weight:600;color:var(--gold-mid);cursor:pointer;font-family:inherit;text-align:left">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <span>RTL</span>
          <span style="font-size:11px;font-weight:400;color:var(--muted)">Bridge · Fix &amp; Flip · Transactional</span>
        </div>
      </button>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:18px">
      <button type="button" onclick="closeCreateLoanModal()" style="padding:9px 18px;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit">Cancel</button>
    </div>
  </div>
</div>

<nav class="nav" id="slaNav"></nav>

<div class="page" id="pageContent">
  <div class="loading">Loading client…</div>
</div>

<div class="toast" id="toast"></div>

<script>
var _user = null;
var _clientId = null;
var _client = null;
var _loEmail = null;

function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;'); }
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

function init() {
  var params = new URLSearchParams(window.location.search);
  _clientId = params.get('clientId');
  if (!_clientId) { window.location.href = 'clients.html'; return; }

  netlifyIdentity.on('init', function(user) {
    if (!user) { netlifyIdentity.open(); return; }
    onUser(user);
  });
  netlifyIdentity.on('login', function(user) {
    onUser(user);
  });
}

function onUser(user) {
  _user = user;
  _loEmail = user.email;
  // Show Admin nav link if user is admin/super_admin
  var navAdmin = document.getElementById('navAdminLink');
  if (navAdmin && window.SLA && SLA.isAdmin && SLA.isAdmin(user)) {
    navAdmin.style.display = 'inline-block'; var navSub=document.getElementById('navSubmissionsLink'); if(navSub) navSub.style.display='inline-block';
  }
  fetchClient().then(function(c) {
    _client = c;
    if (!_client) {
      document.getElementById('pageContent').innerHTML = '<div class="empty-state"><h3>Client not found</h3><p><a href="clients.html">← Back to Clients</a></p></div>';
      return;
    }
    render();
  }).catch(function(err) {
    document.getElementById('pageContent').innerHTML = '<div class="empty-state"><h3>Failed to load</h3><p>'+escH(err.message || 'unknown error')+'</p><p><a href="clients.html">← Back to Clients</a></p></div>';
  });
}

// Fetch the client by id from the backend.
// Admins may load any owner's client by passing ?owner= in the URL.
//
// Phase 4b — PG-first single-record fetch. SLA.Clients.getPG returns
// { client, ownerKey } with embedded loans[] — O(1) instead of a full
// list-then-filter. Falls back to the old list path on any error so a
// PG outage or lag never blocks Client Details from loading.
function fetchClient() {
  var params = new URLSearchParams(window.location.search);
  var ownerParam = params.get('owner');
  function _fromBlobList() {
    var listOpts = ownerParam ? { all: true } : {};
    return SLA.Clients.list(listOpts).then(function(r) {
      if (r && r.byOwner) {
        var keys = Object.keys(r.byOwner);
        for (var i = 0; i < keys.length; i++) {
          var ownerClients = r.byOwner[keys[i]] || [];
          for (var j = 0; j < ownerClients.length; j++) {
            if (ownerClients[j].id === _clientId) {
              _loEmail = keys[i];
              return ownerClients[j];
            }
          }
        }
        return null;
      }
      var list = (r && r.clients) || [];
      return list.find(function(c){ return c.id === _clientId; }) || null;
    });
  }
  if (window.SLA && SLA.Clients && SLA.Clients.getPG) {
    var _getOpts = ownerParam ? { owner: ownerParam } : {};
    return SLA.Clients.getPG(_clientId, _getOpts).then(function(r) {
      if (!r || !r.client) throw new Error('PG returned no client');
      if (r.ownerKey) _loEmail = r.ownerKey;
      console.log('[SLA phase-4] Client Details: PG hit for', _clientId);
      return r.client;
    }).catch(function(err) {
      console.warn('[SLA phase-4] Client Details: PG miss, falling back to blob list —', err && err.message);
      return _fromBlobList();
    });
  }
  return _fromBlobList();
}

function render() {
  var c = _client;
  var initials = ((c.firstName||'?').charAt(0) + (c.lastName||'?').charAt(0)).toUpperCase();
  var loans = c.loans || [];
  var totalLoans = loans.length;
  var lastActivity = loans.reduce(function(latest, l) {
    var d = new Date(l.updatedAt || l.savedAt || 0);
    return d > latest ? d : latest;
  }, new Date(c.createdAt || 0));
  var lastStr = lastActivity.getFullYear() > 2000
    ? lastActivity.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
    : '—';

  var html = '<div class="page-header">' +
    '<div class="client-avatar-lg">'+escH(initials)+'</div>' +
    '<div class="page-header-info">' +
      '<div style="margin-bottom:10px"><a href="clients.html" class="back-btn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> All Clients</a></div>' +
      '<div class="page-title">'+escH((c.firstName||'')+' '+(c.lastName||''))+' <span id="acctPillSlot"></span></div>' +
      '<div class="page-subtitle">'+escH(c.email||'')+(c.phone?' · '+escH(c.phone):'')+'</div>' +
      '<div class="meta-pills" style="margin-top:8px">' +
        '<span class="meta-pill">'+totalLoans+' loan'+(totalLoans!==1?'s':'')+'</span>' +
        (lastActivity.getFullYear()>2000 ? '<span class="meta-pill">Last activity '+lastStr+'</span>' : '') +
        '<span class="meta-pill">Added '+new Date(c.createdAt||0).toLocaleDateString('en-US',{month:'short',year:'numeric'})+'</span>' +
      '</div>' +
    '</div>' +
  '</div>';

  // Top action row (Deploy 170): Create New Loan launches a small
  // modal asking DSCR or RTL, then opens the right sizer with the
  // borrower's contact info pre-filled (prefillContact=1 URL param).
  // Send Loan Prequal — emails the borrower a prequal link, CCs the
  // LO, and stamps _prequalLastSentAt so the "Last sent {date}" note
  // below the button (Deploy 236.189) reflects the most recent send.
  // Deploy 236.226 (Broker Phase C) — Tag / Untag broker button.
  // Sets or clears _isBroker on the client via /api/client-broker-tag;
  // Brokers page will pick it up on next load. When set, the client
  // appears in the Broker Book alongside the existing contact record.
  var _isBrokerFlag = !!c._isBroker;
  var _brokerBtnLabel = _isBrokerFlag ? 'Remove Broker Tag' : 'Tag as Broker';
  var _brokerBtnStyle = _isBrokerFlag
    ? 'background:rgba(200,129,58,0.10);color:#b5712d;border:1px solid rgba(200,129,58,0.40)'
    : 'background:var(--surface);color:var(--text);border:1px solid var(--border)';
  html += '<div class="client-actions" style="display:flex;gap:10px;margin-bottom:0.4rem;flex-wrap:wrap;align-items:flex-start">' +
    '<button type="button" class="action-btn primary" onclick="openCreateLoanModal()" style="display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:var(--gold);color:#fff;border:1px solid var(--gold);border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer">' +
      '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
      'Create New Loan' +
    '</button>' +
    '<div style="display:flex;flex-direction:column;gap:2px">' +
      '<button type="button" class="action-btn" onclick="sendLoanPrequal()" style="display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer">' +
        '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4l5 4 5-4M2 4v6h10V4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>' +
        'Send Loan Prequal' +
      '</button>' +
      '<div id="prequalLastSent" style="font-size:11px;color:var(--muted);padding:0 4px;line-height:1.4">' + _prequalLastSentLabel(c) + '</div>' +
    '</div>' +
    '<button type="button" class="action-btn" id="brokerTagBtn" onclick="toggleBrokerTag()" style="display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;' + _brokerBtnStyle + '" title="Toggle whether this contact appears in the Broker Book">' +
      '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M2 7h10M2 10h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
      _brokerBtnLabel +
    '</button>' +
    (_isBrokerFlag
      ? '<span style="display:inline-flex;align-items:center;padding:6px 12px;background:rgba(200,129,58,0.10);color:#b5712d;border:1px solid rgba(200,129,58,0.40);border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase">Broker</span>'
      : '') +
    // Deploy 236.533 — invite this borrower to the portal (all their loans).
    '<div style="display:flex;flex-direction:column;gap:2px">' +
      '<button type="button" class="action-btn" id="portalInviteBtn" onclick="invitePortal()" style="display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer" title="Give this borrower portal access to all their loans and email a one-click sign-in link">' +
        '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 7.5a2.25 2.25 0 100-4.5 2.25 2.25 0 000 4.5zM2.5 12c0-2 2-3 4.5-3s4.5 1 4.5 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>' +
        'Invite to Borrower Portal' +
      '</button>' +
      '<div id="portalInviteStatus" style="font-size:11px;color:var(--muted);padding:0 4px;line-height:1.4"></div>' +
    '</div>' +
  '</div>' +
  '<div style="height:1rem"></div>';

  // Profile edit section
  html += '<div class="section">' +
    '<div class="section-head"><h2>Client Profile</h2></div>' +
    '<div class="section-body">' +
      '<div class="profile-grid">' +
        '<div class="field"><label>First Name</label><input type="text" id="pf-firstName" value="'+escAttr(c.firstName||'')+'" /></div>' +
        '<div class="field"><label>Last Name</label><input type="text" id="pf-lastName" value="'+escAttr(c.lastName||'')+'" /></div>' +
        '<div class="field"><label>Email</label><input type="email" id="pf-email" value="'+escAttr(c.email||'')+'" oninput="_clearEmailError()" /><div class="email-err" id="pf-emailErr" style="display:none">Please enter a valid email address.</div></div>' +
        '<div class="field"><label>Phone</label><input type="tel" id="pf-phone" value="'+escAttr(c.phone||'')+'" placeholder="(509) 555-0100" data-sla-mask="phone" /></div>' +
        '<div class="field"><label>Date of Birth</label><input type="date" id="pf-dob" value="'+escAttr(c.dob||'')+'" /></div>' +
        '<div class="field"><label>Estimated Credit Score</label><input type="text" id="pf-fico" value="'+escAttr(c.fico||'')+'" placeholder="e.g. 740" /></div>' +
        '<div class="field"><label>Number of Flips (Last 36 mo)</label><input type="number" id="pf-flips" value="'+escAttr(c.flips||'')+'" min="0" placeholder="0" /></div>' +
        '<div class="field"><label>Rental Properties Owned</label><input type="number" id="pf-rentals" value="'+escAttr(c.rentals||'')+'" min="0" placeholder="0" /></div>' +
        '<div class="field"><label>Marital Status</label>' +
          '<select id="pf-marital">' +
            '<option value="">— Select —</option>' +
            '<option value="married"'+(c.maritalStatus==='married'?' selected':'')+'>Married</option>' +
            '<option value="single"'+(c.maritalStatus==='single'?' selected':'')+'>Not Married</option>' +
          '</select>' +
        '</div>' +
        '<div class="field"><label>Are you a US Citizen?</label>' +
          '<select id="pf-usCitizen">' +
            '<option value="">— Select —</option>' +
            '<option value="yes"'+(c.usCitizen==='yes'?' selected':'')+'>Yes</option>' +
            '<option value="no"'+(c.usCitizen==='no'?' selected':'')+'>No — Permanent Resident / Other</option>' +
          '</select>' +
        '</div>' +
        // Deploy 236.150 — SSN row is now ALWAYS rendered. Was
        // previously conditional on c.hasSSN, which meant
        // manually-created guarantors (via the Add Guarantor
        // modal on Loan Details) had no place to enter an SSN
        // and the field stayed missing forever. Now the field is
        // always present:
        //   - When SSN on file: shows masked •••-••-•••• with a
        //     Reveal button. Typing a new value will overwrite.
        //   - When no SSN: shows empty input with the
        //     XXX-XX-XXXX placeholder. Typing a valid 9-digit
        //     SSN + Save Profile encrypts + stores.
        '<div class="field" style="grid-column:1/-1"><label>Social Security Number ' +
          (c.hasSSN
            ? '<span style="font-size:11px;font-weight:400;color:var(--muted);font-family:\'DM Mono\',monospace">(encrypted on file)</span>'
            : '<span style="font-size:11px;font-weight:400;color:var(--muted);font-family:\'DM Mono\',monospace">(will be encrypted on save)</span>') +
          '</label>' +
          '<div style="display:flex;gap:8px;align-items:stretch">' +
            '<input type="text" id="pf-ssn" value="' + (c.hasSSN ? '•••-••-••••' : '') + '" data-sla-mask="ssn" placeholder="XXX-XX-XXXX" autocomplete="off" />' +
            (c.hasSSN
              ? '<button type="button" id="pf-ssn-reveal" onclick="revealClientSSN()" style="padding:8px 14px;font-size:12px;font-weight:600;border:1px solid var(--gold-border);background:var(--gold-light);color:var(--gold-mid);border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap">Reveal</button>'
              : '') +
          '</div>' +
        '</div>' +
        // Deploy 236.466 — marketing referral source (?ref= from the apply
        // link, e.g. slacapital.ai campaigns). Read-only; only shown when set.
        (c.ref
          ? '<div class="field" style="grid-column:1/-1"><label>Referral source ' +
              '<span style="font-size:11px;font-weight:400;color:var(--muted)">(from application link)</span></label>' +
              '<input type="text" value="'+escAttr(c.ref)+'" readonly style="background:var(--bg);color:var(--muted)" /></div>'
          : '') +
      '</div>' +

      // Home address (item #1 — was missing entirely)
      '<h3 style="margin:24px 0 10px;font-family:\'Lora\',serif;font-size:15px;font-weight:600;color:var(--text)">Home Address</h3>' +
      '<div class="profile-grid">' +
        '<div class="field" style="grid-column:1/-1"><label>Street Address</label>' +
          '<input type="text" id="pf-homeStreet" value="'+escAttr((c.homeAddress&&c.homeAddress.street)||'')+'" placeholder="1234 Main St" ' +
            'data-sla-autocomplete data-sla-ac-city="pf-homeCity" data-sla-ac-state="pf-homeState" data-sla-ac-zip="pf-homeZip" />' +
        '</div>' +
        '<div class="field"><label>City</label><input type="text" id="pf-homeCity" value="'+escAttr((c.homeAddress&&c.homeAddress.city)||'')+'" /></div>' +
        '<div class="field"><label>State</label>' + stateSelect('pf-homeState', (c.homeAddress&&c.homeAddress.state)||'') + '</div>' +
        '<div class="field"><label>Zip</label><input type="text" id="pf-homeZip" value="'+escAttr((c.homeAddress&&c.homeAddress.zip)||'')+'" /></div>' +
      '</div>' +

      '<div style="margin-top:16px;display:flex;align-items:center;gap:12px">' +
        '<button class="save-profile-btn" onclick="saveProfile()">Save Profile</button>' +
        '<span id="profileStatus" style="font-size:12px;color:var(--success);display:none">Saved ✓</span>' +
      '</div>' +
    '</div>' +
    '<div class="danger-zone">' +
      '<p>Permanently delete this client and all associated loans.</p>' +
      '<button class="del-client-btn" onclick="deleteClient()">Delete Client</button>' +
    '</div>' +
  '</div>';

  // Companies / Vesting Entities section (item #2 — was missing entirely)
  html += '<div class="section">' +
    '<div class="section-head">' +
      '<h2>Companies / Vesting Entities <span style="font-size:13px;font-weight:400;color:var(--muted);margin-left:6px">' + ((c.companies && c.companies.length) || 0) + '</span></h2>' +
      '<button class="save-profile-btn" style="padding:6px 14px;font-size:12px" onclick="addCompany()">+ Add Company</button>' +
    '</div>' +
    '<div class="section-body" id="companiesBody">' + renderCompanies(c.companies || []) + '</div>' +
  '</div>';

  // Deploy 236.779 — Credit (Xactus) section: pull a report for THIS person
  // without a loan context (uses the SSN/address captured by guarantor
  // onboarding; clean 400 when none is on file). Staff-only.
  if (window.SLA && SLA.isProcessor && SLA.isProcessor(_user)) {
    html += '<div class="section">' +
      '<div class="section-head">' +
        '<h2>Credit</h2>' +
        '<button class="save-profile-btn" style="padding:6px 14px;font-size:12px" onclick="pullClientCredit(this)">🧾 Pull Credit Report</button>' +
      '</div>' +
      '<div class="section-body" id="clientCreditBody" style="font-size:12.5px;color:var(--muted)">Loading credit history…</div>' +
    '</div>';
    setTimeout(loadClientCredit, 0);
  }

  // Loans section
  html += '<div class="section">' +
    '<div class="section-head">' +
      '<h2>Loans <span style="font-size:13px;font-weight:400;color:var(--muted);margin-left:6px">'+totalLoans+'</span></h2>' +
    '</div>';

  if (!loans.length) {
    html += '<div class="empty-state"><p>No loans yet. Save a quote from the DSCR or RTL sizer to create one.</p></div>';
  } else {
    html += '<div style="overflow-x:auto"><table class="loans-table"><thead><tr>' +
      '<th>Address</th><th>Tool</th><th>Status</th><th>Amount</th><th>Rate</th><th>FICO</th><th>Saved</th><th></th>' +
      '</tr></thead><tbody>';

    loans.forEach(function(l) {
      var fd = l.formData || {};
      var isDscr = (l.toolType||'') !== 'rtl';
      var rawAmt = l.loanAmt || fd.loanAmt || l.purchasePrice || fd.purchasePrice;
      var amt = rawAmt ? '$'+Number(rawAmt).toLocaleString() : '—';
      var rate = (l.rate || fd._finalRate) ? (l.rate||fd._finalRate)+'%' : '—';
      var fico = l.fico || fd.fico || '—';
      var date = (l.savedAt||l.updatedAt) ? new Date(l.savedAt||l.updatedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
      var status = l.status || 'active';
      var STATUS_LABELS = { active:'Active', on_hold:'On Hold', submitted:'Submitted', approved:'Approved', denied:'Denied' };
      var statusLabel = STATUS_LABELS[status] || status;
      var statusStyle = status==='approved'?'color:var(--success);font-weight:600':status==='denied'?'color:var(--danger);font-weight:600':status==='submitted'?'color:var(--dark);font-weight:600':'color:var(--muted)';
      // Thread owner through to loan-details when admin is viewing another
      // LO's client. Without this, loan-details runs a non-admin list call
      // that won't find the loan and shows "Loan not found".
      var detailsUrl = l.id
        ? SLA.urls.loanDetails(l.id, { owner: _loEmail })
        : '#';

      // Address cell links directly to Loan Details (Deploy 170 — was a
      // separate "Details →" button before). Saves the LO a click and
      // matches the convention used elsewhere (Pipeline cards, Loans
      // page) where the address is the primary affordance for opening
      // a loan. The trailing button cell now only has the delete
      // action so it stays narrow.
      var addrCell = l.id
        ? '<a href="'+detailsUrl+'" class="address-link" style="color:var(--gold-mid);text-decoration:none;border-bottom:1px dotted var(--gold-border)">'+escH(l.address||'—')+'</a>'
        : escH(l.address || '—');
      // Deploy 236.17 — surface broker connection under the address
      // when the loan has a broker attached (brokerId OR any inline
      // broker contact info). Helps the LO see which deals came in
      // via a broker without opening every Loan Details page.
      var brokerLine = '';
      if (l.brokerName || l.brokerEmail || l.brokerId) {
        var bDisplay = l.brokerName || l.brokerEmail || 'Linked to broker';
        brokerLine = '<div style="font-size:10.5px;color:var(--gold-mid);margin-top:2px;font-family:\'DM Sans\',sans-serif;font-weight:500" title="Broker on this loan"><svg width="9" height="9" viewBox="0 0 12 12" fill="none" style="display:inline-block;vertical-align:-1px;margin-right:3px"><path d="M6 6.5a2 2 0 100-4 2 2 0 000 4zM2 10.5c0-1.7 1.8-3 4-3s4 1.3 4 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>via '+escH(bDisplay)+'</div>';
      }
      html += '<tr>' +
        '<td class="td-mono" style="max-width:220px;overflow:hidden;white-space:nowrap"><div style="overflow:hidden;text-overflow:ellipsis">'+addrCell+'</div>'+brokerLine+'</td>' +
        '<td><span class="badge '+(l.toolType||'dscr')+'">'+((l.toolType||'dscr').toUpperCase())+'</span></td>' +
        '<td style="font-size:12px;'+statusStyle+'">'+escH(statusLabel)+'</td>' +
        '<td class="td-mono">'+escH(amt)+'</td>' +
        '<td class="td-mono">'+escH(rate)+'</td>' +
        '<td class="td-mono" style="font-size:11px">'+escH(fico)+'</td>' +
        '<td class="td-mono">'+date+'</td>' +
        '<td style="white-space:nowrap">' +
          (l.id ? '<button class="del-loan-btn" onclick="deleteLoan(\''+escAttr(l.id)+'\')">✕</button>' : '') +
        '</td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  // Deploy 236.85 — Loans where this client is listed as a guarantor
  // (not the primary borrower). Populated when the borrower-info-sign
  // endpoint auto-creates / links this client during the long-app
  // signing flow with 2+ guarantors. Renders a placeholder row that
  // refreshGuarantorOnLoans() fills in post-paint by walking the full
  // client list to resolve each backref into a concrete loan row.
  var guarantorBackrefs = Array.isArray(c._guarantorOnLoans) ? c._guarantorOnLoans : [];
  if (guarantorBackrefs.length) {
    html +=
      '<div class="section">' +
        '<div class="section-head">' +
          '<h2>Guarantor on these loans <span style="font-size:13px;font-weight:400;color:var(--muted);margin-left:6px">' + guarantorBackrefs.length + '</span></h2>' +
        '</div>' +
        '<div style="overflow-x:auto"><div id="guarantorOnLoansList">' +
          '<div style="padding:1.25rem;text-align:center;color:var(--muted);font-size:13px">Loading…</div>' +
        '</div></div>' +
      '</div>';
  }

  document.getElementById('pageContent').innerHTML = html;
  if (guarantorBackrefs.length) refreshGuarantorOnLoans(guarantorBackrefs);
  // Re-bind sla-forms behaviors (autocomplete, masks, money) on the rendered subtree
  if (window.SLAForms && SLAForms.reformatExisting) {
    SLAForms.reformatExisting(document.getElementById('pageContent'));
  }
  loadPortalInviteStatus(); // Deploy 236.538 — persistent "invited / last login" line
}

function _isValidClientEmail(s) {
  if (!s) return false;
  var t = String(s).trim();
  if (t.length > 254) return false;
  return /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[^\s@.]{2,}$/.test(t);
}

function _showEmailError(msg) {
  var err = document.getElementById('pf-emailErr');
  var input = document.getElementById('pf-email');
  if (err) { err.textContent = msg || 'Please enter a valid email address.'; err.style.display = 'block'; }
  if (input) input.classList.add('has-err');
}
function _clearEmailError() {
  var err = document.getElementById('pf-emailErr');
  var input = document.getElementById('pf-email');
  if (err) err.style.display = 'none';
  if (input) input.classList.remove('has-err');
}

function saveProfile() {
  if (!_client) return;

  // Validate email format if provided. Empty is allowed (the loan can still
  // be tracked) but garbage strings break Brevo sync and future lookups.
  var emailVal = document.getElementById('pf-email').value.trim();
  if (emailVal && !_isValidClientEmail(emailVal)) {
    _showEmailError('Please enter a valid email address.');
    document.getElementById('pf-email').focus();
    return;
  }
  _clearEmailError();
  _client.firstName = document.getElementById('pf-firstName').value.trim();
  _client.lastName  = document.getElementById('pf-lastName').value.trim();
  _client.email     = emailVal.toLowerCase();
  _client.phone     = document.getElementById('pf-phone').value.trim();
  _client.usCitizen = document.getElementById('pf-usCitizen').value;
  // New profile fields (item #1)
  _client.dob       = document.getElementById('pf-dob').value;
  _client.fico      = document.getElementById('pf-fico').value.trim();
  _client.flips     = document.getElementById('pf-flips').value.trim();
  _client.rentals   = document.getElementById('pf-rentals').value.trim();
  _client.maritalStatus = document.getElementById('pf-marital').value;
  _client.homeAddress = {
    street: document.getElementById('pf-homeStreet').value.trim(),
    city:   document.getElementById('pf-homeCity').value.trim(),
    state:  document.getElementById('pf-homeState').value,
    zip:    document.getElementById('pf-homeZip').value.trim(),
  };
  // Companies (item #2) — read from any rendered .co-row blocks in #companiesBody
  var rows = document.querySelectorAll('#companiesBody .co-row');
  var companies = [];
  rows.forEach(function(row) {
    var get = function(name) { var el = row.querySelector('[data-co="'+name+'"]'); return el ? el.value.trim() : ''; };
    var rec = {
      id:        row.getAttribute('data-id') || ('co_' + Date.now() + '_' + Math.random().toString(36).slice(2,6)),
      name:      get('name'),
      state:     get('state'),
      ein:       get('ein'),
      address:   get('address'),
      city:      get('city'),
      addrState: get('addrState'),
      zip:       get('zip'),
    };
    if (rec.name || rec.ein) companies.push(rec);
  });
  _client.companies = companies;

  // Deploy 236.150 — pick up a freshly-typed SSN. The field
  // ALWAYS renders now (so manually-created guarantors can
  // enter one), but we only send it when the value is
  // recognizably a 9-digit SSN. The •••-••-•••• mask shown
  // for existing on-file SSNs has no digits, so a user who
  // doesn't change anything won't accidentally clobber it.
  // Backend (clients-save) handles encryptField + ssnLast4.
  var ssnEl = document.getElementById('pf-ssn');
  if (ssnEl) {
    var ssnDigits = String(ssnEl.value || '').replace(/\D/g, '');
    if (ssnDigits.length === 9) {
      _client.ssn = ssnDigits;
    }
  }

  var saveOpts = _client;
  if (_loEmail && _user && _loEmail !== _user.email) {
    saveOpts = Object.assign({}, _client, { _owner: _loEmail });
  }

  SLA.Clients.save(saveOpts).then(function() {
    var s = document.getElementById('profileStatus');
    s.style.display = 'inline';
    setTimeout(function(){ s.style.display = 'none'; }, 2500);
    showToast('Profile saved');
    document.querySelector('.page-title').textContent = (_client.firstName+' '+_client.lastName).trim();
    document.querySelector('.page-subtitle').textContent = _client.email + (_client.phone ? ' · '+_client.phone : '');
  }).catch(function(err) {
    showToast('Save failed: ' + (err.message || 'unknown error'));
  });
}

// Deploy 236.85 — Populate the "Guarantor on these loans" section.
// `backrefs` is the client's _guarantorOnLoans array — entries shape:
//   { primaryClientId, loanId }
// We fetch the full client list (this LO scope, or all-LO for admins
// viewing a cross-LO client), index it by client id, look each loan
// up on its primary client, and render the same row format the Loans
// section uses.
function refreshGuarantorOnLoans(backrefs) {
  var container = document.getElementById('guarantorOnLoansList');
  if (!container) return;
  var listOpts = SLA.isAdmin && SLA.isAdmin(_user) ? { all: true } : {};
  SLA.Clients.list(listOpts).then(function(r) {
    var allClients = [];
    if (r && r.byOwner) {
      Object.keys(r.byOwner).forEach(function(k) {
        (r.byOwner[k] || []).forEach(function(cc) { allClients.push({ owner: k, c: cc }); });
      });
    } else {
      (r && r.clients ? r.clients : []).forEach(function(cc) { allClients.push({ owner: '', c: cc }); });
    }
    var byClientId = {};
    allClients.forEach(function(x) { byClientId[x.c.id] = x; });

    var rows = backrefs.map(function(b) {
      var primary = byClientId[b.primaryClientId];
      if (!primary) {
        return '<tr><td colspan="6" style="padding:10px 14px;color:var(--muted);font-size:12px">Loan ' + escH(b.loanId || '?') + ' — primary client not in your scope.</td></tr>';
      }
      var loan = (primary.c.loans || []).find(function(l) { return l && l.id === b.loanId; });
      if (!loan) {
        return '<tr><td colspan="6" style="padding:10px 14px;color:var(--muted);font-size:12px">Loan ' + escH(b.loanId) + ' no longer on ' + escH(((primary.c.firstName || '') + ' ' + (primary.c.lastName || '')).trim() || primary.c.email || primary.c.id) + ' (may have been moved or deleted).</td></tr>';
      }
      var fd = loan.formData || {};
      var rawAmt = loan.loanAmt || fd.loanAmt || loan.purchasePrice || fd.purchasePrice;
      var amt = rawAmt ? '$' + Number(rawAmt).toLocaleString() : '—';
      var status = loan.status || 'active';
      var STATUS_LABELS = { active:'Active', on_hold:'On Hold', submitted:'Submitted', approved:'Approved', denied:'Denied', closed:'Closed', cancelled:'Cancelled' };
      var statusLabel = STATUS_LABELS[status] || status;
      var statusStyle = status==='approved'?'color:var(--success);font-weight:600':status==='denied'?'color:var(--danger);font-weight:600':status==='submitted'?'color:var(--dark);font-weight:600':'color:var(--muted)';
      var primaryName = ((primary.c.firstName || '') + ' ' + (primary.c.lastName || '')).trim() || primary.c.email || primary.c.id;
      var detailsUrl = SLA.urls.loanDetails(loan.id, { owner: primary.owner });
      var addrCell = '<a href="' + detailsUrl + '" class="address-link" style="color:var(--gold-mid);text-decoration:none;border-bottom:1px dotted var(--gold-border)">' + escH(loan.address || '—') + '</a>';
      return '<tr>' +
        '<td class="td-mono" style="max-width:220px;overflow:hidden;white-space:nowrap"><div style="overflow:hidden;text-overflow:ellipsis">' + addrCell + '</div></td>' +
        '<td>' + escH(primaryName) + '</td>' +
        '<td><span class="badge ' + (loan.toolType || 'dscr') + '">' + ((loan.toolType || 'dscr').toUpperCase()) + '</span></td>' +
        '<td style="font-size:12px;' + statusStyle + '">' + escH(statusLabel) + '</td>' +
        '<td class="td-mono">' + escH(amt) + '</td>' +
        '<td style="white-space:nowrap"><a href="' + detailsUrl + '" style="color:var(--gold-mid);font-size:11px;font-weight:600;text-decoration:none">Open →</a></td>' +
      '</tr>';
    }).join('');

    container.innerHTML =
      '<table class="loans-table"><thead><tr>' +
        '<th>Address</th><th>Primary Borrower</th><th>Tool</th><th>Status</th><th>Amount</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }).catch(function(err) {
    container.innerHTML = '<div style="padding:1rem;text-align:center;color:#7C1F1F;font-size:13px">Failed to load guarantor loans: ' + escH(err.message || 'Unknown') + '</div>';
  });
}

// ── Companies helpers (item #2) ─────────────────────────
function renderCompanies(companies) {
  if (!companies || !companies.length) {
    return '<div class="empty-state" style="padding:18px"><p>No companies on file. Add one to use as a vesting entity.</p></div>';
  }
  return companies.map(function(c) { return renderCompanyRow(c); }).join('');
}

function renderCompanyRow(c) {
  c = c || {};
  var id = c.id || ('co_' + Date.now() + '_' + Math.random().toString(36).slice(2,6));
  // Per-row unique ids so address autocomplete can target the right fields
  var idCity   = 'co-' + id + '-city';
  var idState  = 'co-' + id + '-addrState';
  var idZip    = 'co-' + id + '-zip';
  return '<div class="co-row" data-id="'+escAttr(id)+'" style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px">' +
    '<div class="profile-grid">' +
      '<div class="field" style="grid-column:1/-1"><label>Entity Name</label>' +
        '<input type="text" data-co="name" value="'+escAttr(c.name||'')+'" placeholder="e.g. Spokane Holdings LLC" />' +
      '</div>' +
      '<div class="field"><label>State Registered In</label>' + stateSelectInline('state', c.state||'') + '</div>' +
      '<div class="field"><label>EIN</label><input type="text" data-co="ein" value="'+escAttr(c.ein||'')+'" placeholder="XX-XXXXXXX" data-sla-mask="ein" /></div>' +
      '<div class="field" style="grid-column:1/-1"><label>Registered Address</label>' +
        '<input type="text" data-co="address" value="'+escAttr(c.address||'')+'" placeholder="500 Main St" ' +
          'data-sla-autocomplete data-sla-ac-city="'+idCity+'" data-sla-ac-state="'+idState+'" data-sla-ac-zip="'+idZip+'" />' +
      '</div>' +
      '<div class="field"><label>City</label><input type="text" id="'+idCity+'" data-co="city" value="'+escAttr(c.city||'')+'" /></div>' +
      '<div class="field"><label>State</label>' + stateSelectInlineWithId('addrState', idState, c.addrState||'') + '</div>' +
      '<div class="field"><label>Zip</label><input type="text" id="'+idZip+'" data-co="zip" value="'+escAttr(c.zip||'')+'" /></div>' +
    '</div>' +
    '<div style="margin-top:10px;text-align:right">' +
      '<button class="del-client-btn" style="padding:6px 14px;font-size:12px;background:transparent;color:var(--danger);border:1px solid rgba(124,31,31,0.30)" onclick="removeCompany(this)">Remove</button>' +
    '</div>' +
  '</div>';
}

// ── Deploy 236.779 — Xactus credit pull from the Client page ─────────
function loadClientCredit() {
  var el = document.getElementById('clientCreditBody');
  if (!el || !_clientId) return;
  var q = '/api/xactus-verifications-list?clientId=' + encodeURIComponent(_clientId) +
    (_loEmail && _user && _loEmail !== _user.email ? '&owner=' + encodeURIComponent(_loEmail) : '');
  SLA.api('GET', q).then(function (r) {
    var list = ((r && r.verifications) || []).filter(function (v) { return v.kind === 'credit'; });
    if (!list.length) { el.innerHTML = '<span style="font-style:italic">No credit pulls on file for this client.</span>'; return; }
    var h = '';
    list.forEach(function (v) {
      var days = v.expiresAt ? Math.ceil((Date.parse(v.expiresAt) - Date.now()) / 86400000) : null;
      var badge = '';
      if (days != null) {
        var col = days <= 0 ? '#7c1f1f' : (days <= 20 ? '#b5712d' : '#166534');
        badge = '<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(0,0,0,0.05);color:' + col + '">' + (days > 0 ? 'valid ' + days + 'd' : 'EXPIRED') + '</span>';
      }
      var s = v.scores || {};
      h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">' +
        '<span style="flex:1;color:var(--text)">🧾 ' + escH((v.subject && v.subject.name) || '') +
        ' · TU ' + (s.transunion || '—') + ' / EXP ' + (s.experian || '—') + ' / EQ ' + (s.equifax || '—') +
        ' · <strong>mid ' + (v.mid || '—') + '</strong>' +
        (v.loanId ? ' <span style="color:var(--muted)">(loan pull)</span>' : '') + '</span>' + badge +
        '<span style="color:var(--muted);white-space:nowrap">' + escH(v.orderedAt ? new Date(v.orderedAt).toLocaleDateString() : '') + '</span>' +
        (v.hasPdf ? '<a href="#" onclick="downloadClientVerificationDoc(\'' + escAttr(v.id) + '\');return false">PDF</a>' : '') +
      '</div>';
    });
    el.innerHTML = h;
  }).catch(function (e) {
    el.innerHTML = 'Credit history unavailable: ' + escH((e && e.message) || 'unknown');
  });
}

function pullClientCredit(btn) {
  if (!_client) return;
  if (!confirm('Pull a TRI-MERGE credit report (HARD inquiry, billed order) for ' +
      ((_client.firstName || '') + ' ' + (_client.lastName || '')).trim() +
      '?\n\nMake sure a signed Credit Authorization is on file. The report is valid 120 days.')) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Ordering…'; }
  var body = { clientId: _client.id, gIndex: 0, reportType: 'Merge' };
  if (_loEmail && _user && _loEmail !== _user.email) body.owner = _loEmail;
  SLA.api('POST', '/api/xactus-credit-order', body).then(function (r) {
    if (btn) { btn.disabled = false; btn.textContent = '🧾 Pull Credit Report'; }
    var v = r.verification || {};
    showToast('Credit pulled — mid score ' + (v.mid || '?') + '.');
    loadClientCredit();
  }).catch(function (e) {
    if (btn) { btn.disabled = false; btn.textContent = '🧾 Pull Credit Report'; }
    showToast('Credit pull failed: ' + ((e && e.message) || 'unknown'));
  });
}

function downloadClientVerificationDoc(id) {
  var url = '/api/xactus-verification-doc?id=' + encodeURIComponent(id) +
    (_loEmail && _user && _loEmail !== _user.email ? '&owner=' + encodeURIComponent(_loEmail) : '');
  SLA.getToken().then(function (t) {
    return fetch(url, { headers: { Authorization: 'Bearer ' + t } });
  }).then(function (resp) {
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp.blob();
  }).then(function (b) {
    var u = URL.createObjectURL(b);
    var a = document.createElement('a');
    a.href = u; a.download = 'credit-report-' + id + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  }).catch(function (e) { showToast('Download failed: ' + ((e && e.message) || 'unknown')); });
}

function addCompany() {
  if (!_client) return;
  var body = document.getElementById('companiesBody');
  var es = body.querySelector('.empty-state');
  if (es) body.innerHTML = '';
  body.insertAdjacentHTML('beforeend', renderCompanyRow({}));
  // Re-bind sla-forms behaviors (autocomplete, masks) on the new row
  if (window.SLAForms && SLAForms.reformatExisting) {
    SLAForms.reformatExisting(body);
  }
}

function removeCompany(btn) {
  var row = btn.closest('.co-row');
  if (!row) return;
  if (!confirm('Remove this company?')) return;
  row.remove();
  // If no companies left, show empty state
  var body = document.getElementById('companiesBody');
  if (!body.querySelector('.co-row')) {
    body.innerHTML = '<div class="empty-state" style="padding:18px"><p>No companies on file. Add one to use as a vesting entity.</p></div>';
  }
  // Immediately persist the change so the user doesn't lose work if they
  // forget to click Save Profile.
  saveProfile();
}

  var states = ['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];
  var html = '<select data-co="'+coAttr+'"><option value="">— Select —</option>';

  var states = ['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];
  var html = '<select id="'+id+'" data-co="'+coAttr+'"><option value="">— Select —</option>';
  states.forEach(function(s) {
    html += '<option value="'+s+'"'+(current===s?' selected':'')+'>'+s+'</option>';
  });

// SSN reveal — calls the dedicated endpoint
function revealClientSSN() {
  if (!_client) return;
  var body = { clientId: _client.id };
  if (_loEmail && _user && _loEmail !== _user.email) body.owner = _loEmail;
  // Deploy 236.462 — use SLA.api (auth-agnostic: resolves a Supabase OR
  // Netlify token internally). Was netlifyIdentity.currentUser().jwt(),
  // which is null for Supabase logins → "Cannot read properties of null
  // (reading 'jwt')" when an LO clicked Reveal.
  SLA.api('POST', '/api/client-ssn-reveal', body).then(function(resp) {
    var input = document.getElementById('pf-ssn');
    var btn = document.getElementById('pf-ssn-reveal');
    if (input && resp.ssn) {
      input.value = resp.ssn;
      btn.textContent = 'Visible';
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btn.style.cursor = 'default';
    }
  }).catch(function(err) {
    showToast('Reveal failed: ' + (err.message || 'unknown'));
  });
}

function deleteLoan(loanId) {
  if (!confirm('Delete this loan? This cannot be undone.')) return;
  if (!_client) return;
  var loanToDelete = (_client.loans||[]).find(function(l){ return l.id === loanId; });

  var opts = { loanId: loanId };
  if (_loEmail && _user && _loEmail !== _user.email) opts._owner = _loEmail;

  SLA.Clients.delete(_clientId, opts).then(function(r) {
    if (r && r.client) _client = r.client;
    else _client.loans = (_client.loans || []).filter(function(l){ return l.id !== loanId; });
    if (loanToDelete && loanToDelete.address && window.QuoteStore) {
      QuoteStore.deleteQuote(_loEmail, loanToDelete.toolType || 'dscr', loanToDelete.address);
    }
    showToast('Loan deleted');
    render();
  }).catch(function(err) {
    showToast('Delete failed: ' + (err.message || 'unknown error'));
  });
}

function deleteClient() {
  if (!_client) return;
  if (!confirm('Delete '+(_client.firstName||'this client')+' and all their loans? This cannot be undone.')) return;

  var opts = {};
  if (_loEmail && _user && _loEmail !== _user.email) opts._owner = _loEmail;

  SLA.Clients.delete(_clientId, opts).then(function() {
    window.location.href = 'clients.html';
  }).catch(function(err) {
    showToast('Delete failed: ' + (err.message || 'unknown error'));
  });
}

// ─── Create New Loan modal (Deploy 170) ───────────────────────
// Opens from the gold "Create New Loan" button above Client Profile.
// User picks DSCR or RTL; we open the right sizer with the client's
// id + prefillContact=1 so borrower name/email/phone get populated
// without trying to load an existing loan.
function openCreateLoanModal() {
  if (!_client) { showToast('Client not loaded yet'); return; }
  var modal = document.getElementById('createLoanModal');
  if (modal) modal.style.display = 'flex';
}

function closeCreateLoanModal() {
  var modal = document.getElementById('createLoanModal');
  if (modal) modal.style.display = 'none';
}

function createLoanOfType(toolType) {
  closeCreateLoanModal();
  if (!_client) return;
  // Deploy 236.87 — GUC routing.
  var page = toolType === 'rtl' ? 'rtl-sizer.html' : toolType === 'guc' ? 'guc-sizer.html' : 'dscr-sizer.html';
  var url = page + '?clientId=' + encodeURIComponent(_client.id) + '&prefillContact=1';
  // Thread owner through if admin is viewing another LO's client.
  if (_loEmail && _user && _loEmail !== _user.email) {
    url += '&owner=' + encodeURIComponent(_loEmail);
  }
  window.location.href = url;
}

// Deploy 236.189 — format the client's _prequalLastSentAt as a
// small "Last sent {date}" caption under the Send Loan Prequal
// button. Empty string when never sent so the label just disappears.
function _prequalLastSentLabel(c) {
  var ts = c && c._prequalLastSentAt;
  if (!ts) return '';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  var opts = { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' };
  try { return 'Last sent ' + d.toLocaleString(undefined, opts); }
  catch (_) { return 'Last sent ' + d.toISOString().slice(0, 10); }
}

// ─── Send Loan Prequal (Deploy 170) ───────────────────────────
// Emails the client a link to the LO's public prequal form
// (apply.html?lo=<lo-email>) — same link the LO has on their Profile
// page, but with a personalized email message. When the borrower
// submits the form, the existing prospects-save flow upserts the
// client record by email match, so this is safe to send to an
// already-existing client.
// Deploy 236.189 — email now CCs the LO who owns the lead, and the
// backend stamps _prequalLastSentAt on the client record. On success
// we update the "Last sent" caption in place without a full reload.
// Deploy 236.226 (Broker Phase C) — flip _isBroker on the client.
// Optimistic update: label + badge toggle immediately, POST goes to
// /api/client-broker-tag which re-renders on success or reverts on
// failure.
function toggleBrokerTag() {
  if (!_client) { showToast('Client not loaded'); return; }
  var willBeBroker = !_client._isBroker;
  var btn = document.getElementById('brokerTagBtn');
  if (btn) { btn.disabled = true; btn.textContent = willBeBroker ? 'Tagging…' : 'Removing…'; }
  var body = { clientId: _client.id, isBroker: willBeBroker };
  if (_loEmail && _user && _loEmail !== _user.email) body.owner = _loEmail;
  SLA.api('POST', '/api/client-broker-tag', body).then(function(r) {
    if (!r || !r.ok) throw new Error((r && r.error) || 'unknown');
    _client = r.client;
    if (Array.isArray(_client.loans) === false) _client.loans = _client.loans || [];
    showToast(willBeBroker
      ? 'Tagged as Broker — now visible in the Broker Book.'
      : 'Removed Broker tag.');
    render();
  }).catch(function(err) {
    if (btn) { btn.disabled = false; btn.textContent = willBeBroker ? 'Tag as Broker' : 'Remove Broker Tag'; }
    showToast('Broker tag failed: ' + (err && err.message || 'unknown'));
  });
}

// Deploy 236.533 — invite this borrower to the portal: portal access to ALL
// their loans + a one-click magic-link sign-in (or Google). No password.
function invitePortal() {
  if (!_client) { showToast('Client not loaded'); return; }
  var email = (_client.email || '').trim();
  if (!email) { showToast('This client has no email on file — add one first.'); return; }
  if (!confirm('Invite ' + email + ' to the borrower portal?\n\nThey get portal access to all their loans and a one-click sign-in link (Google or magic link — no password).')) return;
  var btn = document.getElementById('portalInviteBtn');
  var status = document.getElementById('portalInviteStatus');
  if (btn) btn.disabled = true;
  if (status) status.textContent = 'Sending invite…';
  var body = { clientId: _clientId };
  if (_loEmail && _user && _loEmail !== _user.email) body.owner = _loEmail;
  SLA.api('POST', '/api/borrower-portal-invite', body).then(function(r) {
    if (btn) btn.disabled = false;
    if (!r || !r.ok) throw new Error((r && r.error) || 'unknown');
    var when = new Date(r.sentAt || Date.now()).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    if (status) status.innerHTML = '&#10003; Invited ' + escH(r.email) + ' &middot; ' + (r.loanCount || 0) + ' loan' + ((r.loanCount === 1) ? '' : 's') + ' &middot; ' + when + (r.emailed ? '' : ' (email pending)');
    showToast('Borrower portal invite sent to ' + r.email);
    loadPortalInviteStatus(); // refresh the persistent line (sent + last login)
  }).catch(function(err) {
    if (btn) btn.disabled = false;
    if (status) status.textContent = 'Invite failed: ' + (err && err.message || 'unknown');
    showToast('Invite failed: ' + (err && err.message || 'unknown'));
  });
}

// Deploy 236.538 — persistent portal-invite status: which borrower was invited,
// when it was sent, and the last time they signed in. Reads the per-loan
// borrower-invites store (written by BOTH this page's invite and the Loan
// Details Borrower/Broker invite buttons), so the status reflects the invite no
// matter which button sent it — previously the line only appeared right after
// this page's own invite click.
function loadPortalInviteStatus() {
  var status = document.getElementById('portalInviteStatus');
  if (!status || !_clientId || !window.SLA || !SLA.api) return;
  var url = '/api/borrower-portal-invite?clientId=' + encodeURIComponent(_clientId) +
    (_loEmail && _user && _loEmail !== _user.email ? '&owner=' + encodeURIComponent(_loEmail) : '');
  SLA.api('GET', url).then(function(r) {
    // Deploy 236.666 — account-status pill next to the borrower name.
    var slot = document.getElementById('acctPillSlot');
    if (slot) {
      var base = 'display:inline-flex;align-items:center;vertical-align:middle;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;';
      if (r && r.invited) {
        if (r.lastSignInAt) {
          var d = new Date(r.lastSignInAt); var ds = (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2);
          slot.innerHTML = '<span title="Registered · last sign-in ' + escH(ds) + '" style="' + base + 'background:rgba(22,101,52,0.10);color:#166534">&#10003; Account &middot; ' + escH(ds) + '</span>';
        } else {
          slot.innerHTML = '<span title="Invited — has not signed in yet" style="' + base + 'background:rgba(200,129,58,0.12);color:#b5712d">Invited</span>';
        }
      } else {
        slot.innerHTML = '<span title="No portal account yet" style="' + base + 'background:rgba(38,26,54,0.06);color:var(--muted)">No account</span>';
      }
    }
    if (!r || !r.invited) { status.innerHTML = ''; return; } // no invite yet — leave blank
    var sent = r.sentAt
      ? new Date(r.sentAt).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
      : '—';
    var last = r.lastSignInAt
      ? new Date(r.lastSignInAt).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
      : '<span style="color:#b5712d;font-weight:600">not yet logged in</span>';
    status.innerHTML = '&#10003; Portal invited ' + escH(r.email || '') +
      ' &middot; invited ' + sent + ' &middot; last login ' + last;
  }).catch(function() { /* non-fatal — the status line is a hint, not critical */ });
}

function sendLoanPrequal() {
  if (!_client) { showToast('Client not loaded'); return; }
  if (!_client.email) {
    showToast('Client has no email on file — add one in Client Profile first.');
    return;
  }
  if (!confirm('Send a prequal application link to ' + _client.email + '?')) return;

  var body = { clientId: _client.id };
  if (_loEmail && _user && _loEmail !== _user.email) body.owner = _loEmail;

  // Deploy 236.462 — SLA.api (auth-agnostic Supabase/Netlify token). Was
  // netlifyIdentity.currentUser().jwt(), which is null for Supabase logins.
  SLA.api('POST', '/api/prequal-send', body).then(function(data) {
    showToast(data.emailed
      ? 'Prequal link emailed to ' + _client.email
      : 'Link generated (email failed — check console)');
    // Deploy 236.189 — refresh the "Last sent" caption in place. The
    // backend returns the timestamp it stamped; mirror it onto the
    // client object so subsequent sends recompute correctly without a
    // full page reload.
    if (data.emailed && data.lastSentAt && _client) {
      _client._prequalLastSentAt = data.lastSentAt;
      var lbl = document.getElementById('prequalLastSent');
      if (lbl) lbl.textContent = _prequalLastSentLabel(_client);
    }
  })
  .catch(function(err) {
    showToast('Send failed: ' + (err.message || 'unknown'));
  });
}

init();
</script>
