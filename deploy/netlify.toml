[build]
  publish = "."
  command = "node inject-env.js"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/_shared/**", "netlify/functions/_templates/**"]

# Deploy 236.679 — the borrower application signing handlers render the signed
# PDF, stamp signatures, write the client + guarantors, advance the loan to
# In Processing, and email BOTH the borrower and the LO. At the 10s default this
# overran on multi-guarantor apps, so an internal 7.2s deadline SKIPPED the LO
# notification (and the loan advance) to protect the signature write — which is
# why LOs stopped getting "application completed" emails. Give them the full 26s
# on-demand budget so nothing gets skipped. (Internal deadline raised to match.)
[functions."borrower-info-sign"]
  timeout = 26
[functions."borrower2-auth-sign"]
  timeout = 26

# Supabase migration Phase 1 — the backfill walks 2 800+ blobs, does
# a second pass on the legacy brokers store, then chunk-writes
# thousands of rows to Postgres. Pro-plan on-demand functions get up
# to 26s; give the backfill the whole budget so it doesn't need
# cursor pagination for the typical run.
[functions."admin-backfill-loans-pg"]
  timeout = 26

# Deploy 236.711 — one-off Baseline→SLA disposition reconciler: live-fetches the
# Baseline roster + resolves each Sold/Paid-Off loan to its SLA record. Give it
# the full on-demand budget.
[functions."baseline-reconcile-dispositions"]
  timeout = 26

[build.environment]
  NODE_VERSION = "20"
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

# Deploy 236.325 — favicon rewrite. Browsers auto-request /favicon.ico
# on every page load; without this every LO page 404'd. 200-rewrite to
# our PNG (Netlify serves it with image/png Content-Type, which every
# major browser accepts as a favicon).
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200
  force = true

