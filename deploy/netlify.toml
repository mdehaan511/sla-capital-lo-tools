[build]
  publish = "."
  command = "node inject-env.js"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/_shared/**", "netlify/functions/_templates/**"]

[build.environment]
  NODE_VERSION = "20"
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

