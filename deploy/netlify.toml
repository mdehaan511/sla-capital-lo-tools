[build]
  publish = "."
  command = "node inject-env.js"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/_shared/**"]

[build.environment]
  NODE_VERSION = "20"
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

# ── API routes ──────────────────────────────────────────────
[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200
  force = true

[[redirects]]
  from = "/api/clients"
  to = "/.netlify/functions/clients-list"
  status = 200
  force = true

[[redirects]]
  from = "/api/clients-save"
  to = "/.netlify/functions/clients-save"
  status = 200
  force = true

[[redirects]]
  from = "/api/clients-delete"
  to = "/.netlify/functions/clients-delete"
  status = 200
  force = true

[[redirects]]
  from = "/api/prospects"
  to = "/.netlify/functions/prospects-list"
  status = 200
  force = true

[[redirects]]
  from = "/api/prospects-save"
  to = "/.netlify/functions/prospects-save"
  status = 200
  force = true

[[redirects]]
  from = "/api/prospects-delete"
  to = "/.netlify/functions/prospects-delete"
  status = 200
  force = true

[[redirects]]
  from = "/api/quotes"
  to = "/.netlify/functions/quotes-list"
  status = 200
  force = true

[[redirects]]
  from = "/api/quotes-save"
  to = "/.netlify/functions/quotes-save"
  status = 200
  force = true

[[redirects]]
  from = "/api/quotes-delete"
  to = "/.netlify/functions/quotes-delete"
  status = 200
  force = true

[[redirects]]
  from = "/api/users-stats"
  to = "/.netlify/functions/users-stats"
  status = 200
  force = true

[[redirects]]
  from = "/api/profile-ping"
  to = "/.netlify/functions/profile-ping"
  status = 200
  force = true

[[redirects]]
  from = "/api/debug-context"
  to = "/.netlify/functions/debug-context"
  status = 200
  force = true

[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200
  force = true

# ── Security headers ───────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
