[build]
  publish = "."
  command = "node inject-env.js"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/_shared/**", "netlify/functions/_templates/**"]

[build.environment]
  NODE_VERSION = "20"
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

# ── Page redirects (post pipeline migration) ──────────────
[[redirects]]
  from = "/prospects.html"
  to = "/pipeline.html"
  status = 301
  force = true

[[redirects]]
  from = "/saved-quotes.html"
  to = "/pipeline.html"
  status = 301
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/profile.html"
  status = 301
  force = true

