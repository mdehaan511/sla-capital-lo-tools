# ── Security headers ───────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Deploy 236.70 — HTML pages must NOT be cached aggressively. Without
# explicit headers, browsers (especially Chrome) sometimes hold a
# stale copy across deploys, which makes bug fixes appear to "not
# work" until the user does a hard refresh. no-cache + must-revalidate
# tells the browser it MAY keep the file but MUST check ETag with
# origin before serving — typically a 304 round-trip (fast) until
# we deploy, then a full re-download of the new content. Pages with
# auth content already aren't fit for shared caches, so 'private'
# stops upstream proxies from caching too.
[[headers]]
  for = "/*.html"
  [headers.values]
    # Deploy 236.260 (perf #1): let the browser cache HTML for 60s and
    # revalidate after — huge in-session win since every LO
    # navigation between Pipeline / Clients / Loan Details previously
    # redownloaded ~100-160KB per page even when nothing had changed.
    #
    # Tradeoff: an LO who's mid-navigation during a deploy could see
    # up to 60s of pre-deploy HTML before their next revalidation.
    # Acceptable — deploys land quietly during work hours and the
    # window is small.
    #
    # `private` = don't let any upstream CDN cache LO-specific pages.
    # `must-revalidate` = once the 60s window is up, the browser MUST
    # check with Netlify before serving stale (Netlify returns 304
    # when nothing changed — near-instant).
    Cache-Control = "private, max-age=60, must-revalidate"

# Deploy 194 (perf): cache static JS/CSS aggressively in the browser.
# These files change on each deploy (Netlify serves the latest build's
# content for the same URL), but within a session they should not be
# re-downloaded on every page navigation. 5-minute revalidation gives
# us a balance: fast in-session navigation, with a fresh fetch shortly
# after any new deploy. `stale-while-revalidate` lets the browser
# serve cached content immediately AND refresh in the background so
# the next nav also feels instant.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"
