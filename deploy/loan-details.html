<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Details — SLA Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="sla-api.js"></script>
  <script src="sla-search.js"></script>
  <script src="sla-notifications.js"></script>
  <script src="quotes.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C8813A; --gold-mid: #b5712d; --gold-light: rgba(200,129,58,0.10);
      --gold-border: rgba(200,129,58,0.28); --dark: #261a36; --bg: #f0ece5;
      --surface: #ffffff; --text: #1a1520; --muted: #7a7488; --border: #ddd8d0;
      --border-focus: #C8813A; --pill-bg: #f7f5f1;
      --success: #256940; --warn: #7a5218; --danger: #7c1f1f;
      --r: 12px; --r-sm: 8px; --r-xs: 6px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 1rem 5rem; }

    .nav { max-width: 960px; margin: 0 auto; padding: 1.5rem 0 0; display: flex; align-items: center; justify-content: space-between; }
    .nav img { height: 44px; width: auto; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .nav-tools-btn {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--gold-border, rgba(200,129,58,0.28));
      background: var(--gold-light, rgba(200,129,58,0.10));
      color: var(--gold-mid, #b5712d);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      text-decoration: none;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .nav-tools-btn:hover {
      background: var(--gold, #C8813A);
      color: #fff;
      border-color: var(--gold, #C8813A);
    }
    .nav-tool-link { font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); transition: all 0.15s; }
    .nav-tool-link:hover { border-color: var(--gold); color: var(--gold); }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 7px 14px; border: 1.5px solid var(--border); border-radius: 20px; transition: all 0.15s; }
    .back-btn:hover { color: var(--gold); border-color: var(--gold-border); }
    .back-btn svg { transition: transform 0.15s; }
    .back-btn:hover svg { transform: translateX(-2px); }

    .page { max-width: 960px; margin: 0 auto; padding-top: 2rem; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

    .page-header { margin-bottom: 2rem; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--gold); }
    .breadcrumb-sep { opacity: 0.4; }
    .page-title { font-family: 'Lora', serif; font-size: 22px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .page-subtitle { font-size: 13px; color: var(--muted); margin-top: 5px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 20px; border: 1px solid transparent; }
    .badge.dscr { background: rgba(38,26,54,0.08); color: var(--dark); border-color: rgba(38,26,54,0.2); }
    .badge.rtl  { background: rgba(200,129,58,0.10); color: var(--gold-mid); border-color: var(--gold-border); }
    .status-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; border: 1px solid transparent; }
    .status-badge.active    { background: rgba(38,26,54,0.05);  color: var(--muted);    border-color: var(--border); }
    .status-badge.submitted { background: rgba(38,26,54,0.08);  color: var(--dark);     border-color: rgba(38,26,54,0.25); }
    .status-badge.approved  { background: rgba(37,105,64,0.08); color: var(--success);  border-color: rgba(37,105,64,0.25); }
    .status-badge.denied    { background: rgba(124,31,31,0.07); color: var(--danger);   border-color: rgba(124,31,31,0.2); }
    .status-badge.on_hold   { background: rgba(122,82,24,0.07); color: var(--warn);     border-color: rgba(122,82,24,0.2); }

    .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 20px; }
    .section-head { padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .section-head h2 { font-family: 'Lora', serif; font-size: 15px; font-weight: 600; }
    .section-head .section-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; padding: 3px 8px; border-radius: 20px; }
    .tag-readonly { background: var(--pill-bg); color: var(--muted); border: 1px solid var(--border); }
    .tag-editable { background: var(--gold-light); color: var(--gold-mid); border: 1px solid var(--gold-border); }
    .section-body { padding: 1.25rem 1.5rem; }

    /* Read-only financial grid */
    .fin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-radius: var(--r-xs); overflow: hidden; }
    .fin-cell { background: var(--surface); padding: 12px 16px; }
    .fin-cell.span2 { grid-column: 1/-1; }
    .loan-hero {
      background: linear-gradient(135deg, var(--gold-light, rgba(200,129,58,0.10)) 0%, var(--surface, #fff) 100%);
      border: 1px solid var(--gold-border, rgba(200,129,58,0.28));
      border-radius: 10px; padding: 18px 22px; margin-bottom: 14px;
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    }
    .loan-hero[data-locked="1"] { border-color: var(--success, #256940); background: linear-gradient(135deg, rgba(37,105,64,0.08), var(--surface, #fff)); }
    .loan-hero-label { font-size: 12px; font-weight: 600; color: var(--gold-mid, #b5712d); text-transform: uppercase; letter-spacing: 0.08em; }
    .loan-hero[data-locked="1"] .loan-hero-label { color: var(--success, #256940); }
    .loan-hero-val { font-family: 'Lora', serif; font-size: 30px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; flex: 1; text-align: right; }
    .loan-hero-val .empty { font-size: 16px; color: var(--muted); font-weight: 400; }
    .loan-hero-edit { font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 14px; background: var(--surface, #fff); border: 1px solid var(--border, #ddd); color: var(--muted, #7a7488); cursor: pointer; font-family: inherit; }
    .loan-hero-edit:hover { border-color: var(--gold); color: var(--gold-mid); }
    .loan-hero-reset { font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 14px; background: var(--gold-light); border: 1px solid var(--gold-border); color: var(--gold-mid); cursor: pointer; font-family: inherit; }
    .loan-hero-reset:hover { background: var(--gold); color: #fff; border-color: var(--gold); }
    .loan-hero-lock { display: inline-block; font-size: 9px; font-weight: 700; background: var(--success, #256940); color: #fff; padding: 2px 6px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }
    .loan-hero-input { font-family: 'Lora', serif; font-size: 28px; font-weight: 600; color: var(--text); border: 1px solid var(--gold); border-radius: 6px; padding: 4px 10px; width: 200px; text-align: right; background: var(--surface); }
    .fin-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 4px; }
    .fin-val { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text); }
    .fin-val.big { font-size: 22px; color: var(--gold); }
    .fin-val.green { color: var(--success); }
    .fin-val.empty { color: var(--muted); font-style: italic; font-size: 13px; font-family: 'DM Sans', sans-serif; }

    .open-sizer-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px 16px; background: transparent; border: 1.5px solid var(--gold-border); border-radius: var(--r-xs); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: var(--gold-mid); cursor: pointer; transition: all 0.15s; text-decoration: none; justify-content: center; margin-top: 14px; }
    .open-sizer-btn:hover { background: var(--gold-light); border-color: var(--gold); color: var(--gold); }
    .term-sheet-btn { background: var(--gold); border-color: var(--gold); color: #fff; margin-top: 8px; }
    .term-sheet-btn:hover { background: var(--gold-mid); border-color: var(--gold-mid); color: #fff; }
    .borrower-info-btn { background: var(--surface); border-color: var(--gold-border); color: var(--gold-mid); margin-top: 8px; }
    .borrower-info-btn:hover { background: var(--gold-light); border-color: var(--gold); color: var(--gold); }
    .borrower-info-btn.complete { background: rgba(37,105,64,0.10); border-color: rgba(37,105,64,0.40); color: #1a5230; }
    .borrower-info-btn.complete:hover { background: rgba(37,105,64,0.20); }
    .borrower-info-btn.in-progress { background: rgba(200,129,58,0.10); border-color: rgba(200,129,58,0.55); color: #8a5215; }
    .borrower-info-btn.send-app-disabled,
    .borrower-info-btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
    /* Review + Generate buttons (Loan App workflow) */
    .review-app-btn { background: var(--surface); border: 1px solid rgba(38,26,54,0.20); color: var(--dark); }
    .review-app-btn:hover:not(:disabled) { background: var(--bg); border-color: var(--dark); }
    .review-app-btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
    .generate-app-btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

    /* Borrower-Info modal */
    .bi-modal-bg { position: fixed; inset: 0; background: rgba(38,26,54,0.55); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .bi-modal-bg.show { display: flex; }
    .bi-modal { background: var(--surface, #fff); border-radius: 12px; max-width: 500px; width: 100%; padding: 1.75rem; box-shadow: 0 12px 40px rgba(0,0,0,0.18); font-family: 'DM Sans', sans-serif; }
    .bi-modal h3 { font-family: 'Lora', serif; font-size: 19px; margin-bottom: 6px; color: var(--text, #1a1520); }
    .bi-sub { font-size: 13px; color: var(--muted, #7a7488); margin-bottom: 1.25rem; line-height: 1.5; }
    .bi-link-row { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; padding: 12px; background: var(--gold-light); border: 1px solid var(--gold-border); border-radius: 8px; }
    .bi-link-row input { flex: 1; padding: 7px 10px; font-family: 'DM Mono', monospace; font-size: 11px; border: 1px solid var(--gold-border); border-radius: 6px; background: #fff; color: var(--text); }
    .bi-link-row button { padding: 7px 14px; font-size: 12px; font-weight: 600; background: var(--gold); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .bi-link-row button:hover { background: var(--gold-mid); }
    .bi-options { margin-bottom: 1rem; }
    .bi-checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; margin-bottom: 8px; }
    .bi-checkbox input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--gold); }
    .bi-email-row { padding-left: 24px; }
    .bi-email-row input { width: 100%; padding: 9px 12px; border: 1px solid var(--border, #ddd8d0); border-radius: 8px; font-family: inherit; font-size: 13px; background: var(--surface); color: var(--text); margin-bottom: 4px; }
    .bi-email-row input:focus { outline: none; border-color: var(--gold); }
    .bi-email-hint { font-size: 11px; color: var(--muted); }
    .bi-status { font-size: 12px; min-height: 18px; margin-bottom: 8px; }
    .bi-status.err { color: var(--danger, #7c1f1f); }
    .bi-status.ok { color: #256940; }
    .bi-info-box { padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--muted); margin-bottom: 1rem; }
    .bi-info-box strong { color: var(--text); }
    .bi-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
    .bi-btn { font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 22px; cursor: pointer; font-family: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--muted); }
    .bi-btn:disabled { opacity: 0.5; cursor: wait; }
    .bi-btn.primary { background: var(--dark); border-color: var(--dark); color: #fff; }
    .bi-btn.primary:hover:not(:disabled) { background: #1c1227; }

    /* Editable application fields */
    .app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
    .app-grid .span2 { grid-column: 1/-1; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .field input, .field select, .field textarea {
      border: 1.5px solid var(--border); border-radius: var(--r-xs);
      padding: 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 13.5px;
      color: var(--text); background: var(--surface); transition: border-color 0.15s;
      width: 100%;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
    .field select { appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%237a7488' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 12px center; cursor: pointer; }
    .field textarea { min-height: 80px; resize: vertical; }
    .save-app-btn { height: 42px; padding: 0 22px; background: var(--dark); color: #fff; border: none; border-radius: var(--r-xs); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .save-app-btn:hover { background: var(--gold); }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--dark); color: #fff; font-size: 13px; font-weight: 500; padding: 10px 20px; border-radius: 30px; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; z-index: 9999; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .loading { text-align: center; padding: 4rem; font-size: 14px; color: var(--muted); }
      .nav-tool-link { font-size:12px; font-weight:600; color:var(--muted); text-decoration:none; padding:5px 12px; border-radius:20px; border:1px solid var(--border); transition:all 0.15s; white-space:nowrap; }
    .nav-tool-link:hover { border-color:var(--gold); color:var(--gold); }
    .nav-tool-link.current { background:var(--dark); border-color:var(--dark); color:#fff; }
    .logout-btn { font-size:12px; font-weight:600; color:var(--muted); background:transparent; border:1px solid var(--border); padding:5px 12px; border-radius:20px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.15s; -webkit-appearance:none; appearance:none; }
    .logout-btn:hover { border-color:var(--gold); color:var(--gold); }
  </style>
</head>

<nav class="nav">
  
  <div class="nav-left">
    <a href="index.html" style="display:flex;align-items:center;text-decoration:none"><img src="SLA_Capital_Logo_2_1.png" alt="SLA Capital" onerror="this.style.display='none'" /></a>
    <a href="index.html" class="nav-tools-btn">Tools</a></div>

    <a class="nav-tool-link" href="pipeline.html">Pipeline</a>

<div class="page" id="pageContent">
  <div class="loading">Loading loan details…</div>
</div>

<!-- Borrower-Info Request modal -->
<div class="bi-modal-bg" id="biModal">
  <div class="bi-modal">
    <h3 id="biTitle">Send Full Loan Application</h3>
    <p id="biSub" class="bi-sub">Generates a secure link the borrower can use to fill in everything we need for the loan application.</p>

    <div id="biContent">
      <div class="bi-link-row" id="biLinkRow" style="display:none">
        <input type="text" id="biLinkInput" readonly />
        <button type="button" id="biCopyBtn" onclick="biCopyLink()">Copy</button>
      </div>

      <div class="bi-options" id="biOptions">
        <label class="bi-checkbox">
          <input type="checkbox" id="biSendEmailCb" checked />
          <span>Email this link to the borrower</span>
        </label>
        <div class="bi-email-row" id="biEmailRow">
          <input type="email" id="biEmailInput" placeholder="borrower@example.com" />
          <span class="bi-email-hint">We'll send a secure link to this address.</span>
        </div>
      </div>

      <div class="bi-status" id="biStatusMsg"></div>

      <div class="bi-info-box" id="biExistingInfo" style="display:none"></div>
    </div>

    <div class="bi-actions">
      <button class="bi-btn cancel" onclick="closeBorrowerInfoModal()">Close</button>
      <button class="bi-btn primary" id="biSendBtn" onclick="biSendOrCopy()">Generate Link</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var _user = null;
var _clientId = null;
var _loanId = null;
var _client = null;
var _loan = null;
var _loEmail = null;

function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;'); }
function fmtM(n) { var v = Number(n); return (v && !isNaN(v)) ? '$'+v.toLocaleString() : '—'; }
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

function clientsKey(email) { return 'sla_clients_' + (email||''); }

function init() {
  var params = new URLSearchParams(window.location.search);
  _clientId = params.get('clientId');
  _loanId   = params.get('loanId');
  if (!_clientId || !_loanId) { window.location.href = 'clients.html'; return; }

  netlifyIdentity.on('init', function(user) {
    if (!user) { netlifyIdentity.open(); return; }
    onUser(user);
  });
  netlifyIdentity.on('login', function(user) { onUser(user); });
}

function onUser(user) {
  _user = user;
  _loEmail = user.email;
  var navAdmin = document.getElementById('navAdminLink');
  if (navAdmin && window.SLA && SLA.isAdmin && SLA.isAdmin(user)) {
    navAdmin.style.display = 'inline-block'; var navSub=document.getElementById('navSubmissionsLink'); if(navSub) navSub.style.display='inline-block';
  }
  fetchLoan().then(function(found) {
    if (!found) {
      document.getElementById('pageContent').innerHTML = '<div style="padding:4rem;text-align:center"><h3>Loan not found</h3><p><a href="clients.html">← Back to Clients</a></p></div>';
      return;
    }
    _client = found.client;
    _loan   = found.loan;
    render();
  }).catch(function(err) {
    document.getElementById('pageContent').innerHTML = '<div style="padding:4rem;text-align:center"><h3>Failed to load</h3><p>'+(err.message||'')+'</p><p><a href="clients.html">← Back to Clients</a></p></div>';
  });
}

// Find the {client, loan} in the backend. Admins may pass ?owner= to view another LO's loan.
function fetchLoan() {
  var params = new URLSearchParams(window.location.search);
  var ownerParam = params.get('owner');
  var listOpts = ownerParam ? { all: true } : {};
  return SLA.Clients.list(listOpts).then(function(r) {
    if (r && r.byOwner) {
      var keys = Object.keys(r.byOwner);
      for (var i = 0; i < keys.length; i++) {
        var ownerClients = r.byOwner[keys[i]] || [];
        for (var j = 0; j < ownerClients.length; j++) {
          if (ownerClients[j].id !== _clientId) continue;
          var loans = ownerClients[j].loans || [];
          for (var k = 0; k < loans.length; k++) {
            if (loans[k].id === _loanId) {
              _loEmail = keys[i];
              return { client: ownerClients[j], loan: loans[k] };
            }
          }
        }
      }
      return null;
    }
    var list = (r && r.clients) || [];
    for (var ci = 0; ci < list.length; ci++) {
      if (list[ci].id !== _clientId) continue;
      var ll = list[ci].loans || [];
      for (var li = 0; li < ll.length; li++) {
        if (ll[li].id === _loanId) return { client: list[ci], loan: ll[li] };
      }
    }
    return null;
  });
}

var STATUS_LABELS = { active:'Active', on_hold:'On Hold', submitted:'Submitted', approved:'Approved', denied:'Denied' };

function render() {
  var c = _client;
  var l = _loan;
  var fd = l.formData || {};
  var isDscr = (l.toolType||'') !== 'rtl';
  var status = l.status || 'active';
  var STATUS_LABELS = { active:'Active', on_hold:'On Hold', submitted:'Submitted', approved:'Approved', denied:'Denied' };

// Item #4: LO can override the loan amount on Loan Details. Setting the
// `loanAmtLocked` flag prevents future sizer re-saves from overwriting it.
// Item #5: when LO changes loan amount, ALSO update the matching saved quote
// so downstream consumers (term sheet, rate sheet PDF) see the override.
function syncOverrideToQuote() {
  if (!_loan || !_loan.address) return Promise.resolve();
  if (!window.SLA || !SLA.Quotes) return Promise.resolve();
  // Admin viewing another LO's loan: list the OWNER's quotes, not the current
  // user's. Otherwise we'd find no match.
  var listOpts = {};
  if (_loEmail && _user && _loEmail !== _user.email && SLA.isAdmin && SLA.isAdmin(_user)) {
    listOpts.all = true;
  }
  return SLA.Quotes.list(listOpts).then(function(r) {
    var quotes = (r && r.quotes) || (r && r.byOwner ? Object.values(r.byOwner).flat() : []);
    var targetFull = String(_loan.address).toLowerCase().trim();
    var targetStreet = targetFull.split(',')[0].trim().replace(/\s+/g, ' ');
    // Match by full address first, then fall back to street-segment
    var match = quotes.find(function(q) {
      return String(q.address || '').toLowerCase().trim() === targetFull;
    });
    if (!match) {
      match = quotes.find(function(q) {
        var qFull = String(q.address || '').toLowerCase().trim();
        var qStreet = qFull.split(',')[0].trim().replace(/\s+/g, ' ');
        return qStreet && targetStreet && qStreet === targetStreet;
      });
    }
    if (!match) {
      console.warn('syncOverrideToQuote: no matching quote for', _loan.address);
      return;
    }
    // Update both top-level loanAmt and formData.loanAmt
    var updated = Object.assign({}, match);
    if (!updated.formData) updated.formData = {};
    updated.formData.loanAmt = _loan.loanAmt;
    updated.formData.loanAmtLocked = !!_loan.loanAmtLocked;
    updated.loanAmt = _loan.loanAmt;
    updated.updatedAt = new Date().toISOString();
    if (_loEmail && _user && _loEmail !== _user.email) updated._owner = _loEmail;
    return SLA.Quotes.save(updated);
  }).catch(function(err) {
    console.warn('syncOverrideToQuote failed:', err);
  });
}

// Item #4: revert override back to the sizer-computed max loan amount
function resetLoanAmtToMax() {
  if (!_loan || !_client) return;
  if (!_loan.maxLoan) { showToast('No max loan on file'); return; }
  if (!confirm('Reset loan amount to maximum allowable from sizer?\n\n$' + Math.round(parseFloat(_loan.maxLoan)).toLocaleString())) return;
  _loan.loanAmt = String(_loan.maxLoan);
  _loan.loanAmtLocked = false;
  _loan.updatedAt = new Date().toISOString();
  persistClient().then(function() {
    return syncOverrideToQuote();
  }).then(function() {
    showToast('Loan amount reset to maximum');
    if (typeof render === 'function') render();
  }).catch(function(err) {
    showToast('Reset failed: ' + (err.message || 'unknown'));
  });
}

function overrideLoanAmt() {
  if (!_loan || !_client) return;
  var displayEl = document.getElementById('loanAmtDisplay');
  var heroEl    = displayEl ? displayEl.closest('.loan-hero') : null;
  if (!displayEl) return;
  var btn = heroEl.querySelector('.loan-hero-edit');
  // Replace display with input, swap button to Save
  var current = (_loan.loanAmt || '').toString().replace(/[^0-9.]/g, '');
  displayEl.outerHTML = '<input type="number" min="0" step="1000" id="loanAmtInput" class="loan-hero-input" value="' + current + '" />';
  btn.textContent = 'Save';
  btn.onclick = function() {
    var input = document.getElementById('loanAmtInput');
    var newAmt = (input.value || '').toString();
    if (!newAmt) { showToast('Enter a loan amount'); return; }
    _loan.loanAmt = newAmt;
    _loan.loanAmtLocked = true;
    _loan.updatedAt = new Date().toISOString();
    persistClient().then(function() {
      return syncOverrideToQuote();
    }).then(function() {
      showToast('Loan amount overridden — saved');
      // Re-render the page so the hero shows the locked badge
      if (typeof render === 'function') render();
    }).catch(function(err) {
      showToast('Save failed: ' + (err.message || 'unknown'));
    });
  };
}

// Save the current _client back via SLA.Clients.save, ensuring _loan changes
// are persisted to the parent client record.
function persistClient() {
  // Find the matching loan in client.loans and replace it
  if (!_client.loans) _client.loans = [];
  var idx = _client.loans.findIndex(function(l){ return l.id === _loan.id; });
  if (idx >= 0) _client.loans[idx] = _loan;
  else _client.loans.unshift(_loan);
  var saveOpts = _client;
  if (_loEmail && _user && _loEmail !== _user.email) {
    saveOpts = Object.assign({}, _client, { _owner: _loEmail });
  }
  return SLA.Clients.save(saveOpts);
}

function saveAppFields() {
  if (!_loan || !_client) return;
  var appFields = {
    bedrooms:    document.getElementById('af-bedrooms').value.trim(),
    bathrooms:   document.getElementById('af-bathrooms').value.trim(),
    sqft:        document.getElementById('af-sqft').value.trim(),
    propType:    document.getElementById('af-propType').value,
    loanPurpose: document.getElementById('af-loanPurpose').value,
    rentalType:  document.getElementById('af-rentalType').value,
    fundingDate: document.getElementById('af-fundingDate').value,
    notes:       document.getElementById('af-notes').value.trim(),
    projectDescription: (document.getElementById('af-projectDescription') || { value: '' }).value.trim(),
    updatedAt:   new Date().toISOString(),
  };

  // Update the loan inside the client and save the whole client back
  var loans = _client.loans || [];
  var idx = loans.findIndex(function(l){ return l.id === _loanId; });
  if (idx < 0) return;
  loans[idx] = Object.assign({}, loans[idx], appFields);
  _loan = loans[idx];
  _client.loans = loans;

  var saveOpts = _client;
  if (_loEmail && _user && _loEmail !== _user.email) {
    saveOpts = Object.assign({}, _client, { _owner: _loEmail });
  }
  SLA.Clients.save(saveOpts).then(function() {
    var s = document.getElementById('appStatus');
    s.style.display = 'inline';
    setTimeout(function(){ s.style.display = 'none'; }, 2500);
    showToast('Changes saved');
  }).catch(function(err) {
    showToast('Save failed: ' + (err.message || 'unknown error'));
  });
}

function submitLoan() {
  var status = _loan.status || 'active';
  if (status !== 'active' && status !== 'on_hold') {
    alert('This loan has already been submitted or decided.');
    return;
  }
  var notes = (document.getElementById('ld-submitNotes') || {}).value || '';

  // Update the loan status in the client record
  var loans = _client.loans || [];
  var idx = loans.findIndex(function(l){ return l.id === _loanId; });
  if (idx < 0) { alert('Loan not found.'); return; }
  loans[idx].status    = 'submitted';
  loans[idx].updatedAt = new Date().toISOString();
  _loan = loans[idx];
  _client.loans = loans;

  var saveOpts = _client;
  if (_loEmail && _user && _loEmail !== _user.email) {
    saveOpts = Object.assign({}, _client, { _owner: _loEmail });
  }

  SLA.Clients.save(saveOpts).then(function() {
    // Also reflect status in QuoteStore (Saved Quotes)
    try {
      if (window.QuoteStore) {
        var toolType = _loan.toolType || 'dscr';
        QuoteStore.updateStatus(_loEmail, toolType, _loan.address, 'submitted');
      }
    } catch(e) {}

    // Fire Slack notification (webhook from Settings backend)
    SLA.Settings.getAll().then(function(s) {
      var webhookUrl = (s && s.slack_webhook && s.slack_webhook.value) || '';
      if (webhookUrl) postSlackNotification(webhookUrl, notes);
      showToast(webhookUrl
        ? '\u2713 Loan submitted - Slack notification sent'
        : '\u2713 Loan submitted (configure Slack webhook in Admin)');
      render();
    }).catch(function() {
      showToast('\u2713 Loan submitted');
      render();
    });
  }).catch(function(err) {
    showToast('Submit failed: ' + (err.message || 'unknown error'));
  });
}

function postSlackNotification(webhookUrl, notes) {
  var user = _user;
  var loName  = user && user.user_metadata && user.user_metadata.full_name || '';
  var loEmail = user && user.email || '';
  var loPhone = user && user.user_metadata && user.user_metadata.phone || '';
  var c = _client;
  var l = _loan;
  var isDscr = (l.toolType||'') !== 'rtl';
  var loanAmt = l.loanAmt || l.purchasePrice || '';
  var amtFmt  = loanAmt ? '$'+Number(loanAmt).toLocaleString() : '-';
  var rate    = l.rate   ? l.rate+'%' : '-';
  var points  = l.points || '-';
  var dateStr = new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  var loLine  = [loName, loPhone, loEmail].filter(Boolean).join(' | ');
  var blocks = [
    { type:'header', text:{ type:'plain_text', text:':house: New Loan Submitted - SLA Capital', emoji:true } },
    { type:'section', fields:[
      { type:'mrkdwn', text:'*Address*\n'+(l.address||'-') },
      { type:'mrkdwn', text:'*Borrower*\n'+((c.firstName||'')+' '+(c.lastName||'')).trim() },
      { type:'mrkdwn', text:'*Tool*\n'+(isDscr?'DSCR':'RTL / Fix & Flip') },
      { type:'mrkdwn', text:'*Loan Amount*\n'+amtFmt },
      { type:'mrkdwn', text:'*Rate / Points*\n'+rate+' / '+points },
      { type:'mrkdwn', text:'*Loan Officer*\n'+(loLine||'-') }
    ]},
    { type:'section', fields:[
      { type:'mrkdwn', text:'*Submitted*\n'+dateStr }
    ]}
  ];
  if (notes) blocks.push({ type:'section', text:{ type:'mrkdwn', text:'*Notes*\n'+notes }});
  blocks.push({ type:'divider' });
  blocks.push({ type:'context', elements:[{ type:'mrkdwn', text:'View in SLA Capital -> Clients -> Loan Details' }] });
  try {
    fetch(webhookUrl, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ blocks: blocks })
    });
  } catch(e) {}
}

// ── Download Rate Sheet (server-generated PDF, B3 architecture) ─────
// Reads the loan record's pricing snapshot + current loanAmt (with override)
// from the server and generates a PDF. Bypasses the sizer entirely so any
// LO override on Loan Details flows through correctly.
function downloadRateSheet() {
  if (!_loan || !_client) { showToast('Loan not loaded yet'); return; }
  showToast('Generating rate sheet…');
  netlifyIdentity.currentUser().jwt().then(function(token) {
    var body = { clientId: _client.id, loanId: _loan.id };
    if (_loEmail && _user && _loEmail !== _user.email) body.owner = _loEmail;
    return fetch('/api/rate-sheet', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      },
      body: JSON.stringify(body),
    });
  }).then(function(r) {
    if (!r.ok) {
      return r.json().catch(function(){ return {}; }).then(function(d) {
        throw new Error((d && d.error) || ('HTTP ' + r.status));
      });
    }
    var disp = r.headers.get('Content-Disposition') || '';
    var m = disp.match(/filename="?([^"]+)"?/);
    var filename = m ? m[1] : 'SLA_Rate_Sheet.pdf';
    return r.blob().then(function(blob) { return { blob: blob, filename: filename }; });
  }).then(function(out) {
    var url = URL.createObjectURL(out.blob);
    var a = document.createElement('a');
    a.href = url; a.download = out.filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('Rate sheet downloaded');
  }).catch(function(err) {
    showToast('Failed: ' + (err.message || 'unknown error'));
  });
}

// ── Borrower Info Request modal ─────────────────────────
// State for the modal: holds the latest response from the request endpoint
// so the user can re-copy the link after sending.
var _biLatestUrl = '';

function openBorrowerInfoModal() {
  if (!_client) { showToast('Client not loaded'); return; }
  // Reset modal state
  _biLatestUrl = '';
  var modal = document.getElementById('biModal');
  document.getElementById('biLinkRow').style.display = 'none';
  document.getElementById('biLinkInput').value = '';
  document.getElementById('biStatusMsg').textContent = '';
  document.getElementById('biStatusMsg').className = 'bi-status';
  document.getElementById('biSendEmailCb').checked = true;
  document.getElementById('biEmailInput').value = (_client.email || '').toLowerCase();
  document.getElementById('biEmailRow').style.display = 'block';
  document.getElementById('biSendBtn').textContent = 'Generate Link';
  document.getElementById('biSendBtn').disabled = false;
  document.getElementById('biTitle').textContent = 'Send Full Loan Application — ' + ((_client.firstName||'') + ' ' + (_client.lastName||'')).trim();

  // Show existing-info notice if borrower already started/completed
  var info = document.getElementById('biExistingInfo');
  info.style.display = 'none';
  info.innerHTML = '';
  if (window.SLA && SLA.BorrowerInfo && SLA.BorrowerInfo.status) {
    SLA.BorrowerInfo.status(_client.id).then(function(r) {
      if (!r) return;
      var s = r.status;
      var msg = '';
      if (s === 'in_progress') msg = '<strong>In progress.</strong> Borrower has started but not finished. Generating a new link will replace the old one.';
      else if (s === 'complete') msg = '<strong>Already complete.</strong> Generating a new link will reset their data and require them to fill it in again.';
      else if (s === 'pending') msg = '<strong>Link already sent.</strong> Generating a new link will invalidate the previous one.';
      if (msg) {
        info.innerHTML = msg;
        info.style.display = 'block';
        document.getElementById('biSendBtn').textContent = 'Replace Link';
      }
    }).catch(function(){});
  }

  // Toggle the email field visibility on checkbox change
  document.getElementById('biSendEmailCb').onchange = function() {
    document.getElementById('biEmailRow').style.display = this.checked ? 'block' : 'none';
  };

  modal.classList.add('show');
}

function closeBorrowerInfoModal() {
  document.getElementById('biModal').classList.remove('show');
}

function biSendOrCopy() {
  if (!_client) return;
  var sendEmail = document.getElementById('biSendEmailCb').checked;
  var email = document.getElementById('biEmailInput').value.trim();
  if (sendEmail && (!email || !email.includes('@'))) {
    var s = document.getElementById('biStatusMsg');
    s.className = 'bi-status err';
    s.textContent = 'Enter a valid email address, or uncheck the email option.';
    return;
  }

  var btn = document.getElementById('biSendBtn');
  btn.disabled = true;
  btn.textContent = sendEmail ? 'Sending…' : 'Generating…';
  var status = document.getElementById('biStatusMsg');
  status.textContent = '';
  status.className = 'bi-status';

  var opts = { sendEmail: sendEmail };
  if (sendEmail) opts.email = email;
  if (_loEmail && _user && _loEmail !== _user.email) opts._owner = _loEmail;

  SLA.BorrowerInfo.request(_client.id, opts).then(function(resp) {
    btn.disabled = false; btn.textContent = 'Replace Link';
    _biLatestUrl = resp.url || '';
    document.getElementById('biLinkInput').value = _biLatestUrl;
    document.getElementById('biLinkRow').style.display = 'flex';
    status.className = 'bi-status ok';
    status.textContent = sendEmail
      ? (resp.emailed ? '✓ Link sent to ' + email : 'Link generated. (Email send failed; copy the link instead.)')
      : '✓ Link generated.';
    refreshBorrowerInfoStatus();
  }).catch(function(err) {
    btn.disabled = false; btn.textContent = 'Generate Link';
    status.className = 'bi-status err';
    status.textContent = 'Failed: ' + (err.message || 'unknown error');
  });
}

function biCopyLink() {
  var url = document.getElementById('biLinkInput').value;
  if (!url) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function(){
      var b = document.getElementById('biCopyBtn');
      var orig = b.textContent;
      b.textContent = 'Copied!';
      setTimeout(function(){ b.textContent = orig; }, 1500);
    }).catch(function(){ prompt('Copy this link:', url); });
  } else {
    prompt('Copy this link:', url);
  }
}

// Backdrop close
document.addEventListener('click', function(e) {
  var bg = document.getElementById('biModal');
  if (e.target === bg) closeBorrowerInfoModal();
});

// ── Status refresh: shows current borrower-info state on the button ──
function refreshBorrowerInfoStatus() {
  if (!_client) return;
  if (!window.SLA || !SLA.BorrowerInfo || !SLA.BorrowerInfo.status) return;
  var btn   = document.getElementById('borrowerInfoBtn');
  var label = document.getElementById('borrowerInfoBtnLabel');
  var note  = document.getElementById('borrowerInfoStatus');
  if (!btn || !label || !note) return;

  var opts = (_loEmail && _user && _loEmail !== _user.email) ? { _owner: _loEmail } : {};

  SLA.BorrowerInfo.status(_client.id, opts).then(function(r) {
    if (!r) return;
    btn.classList.remove('complete','in-progress');
    var s = r.status;
    var reviewBtn   = document.getElementById('reviewAppBtn');
    var generateBtn = document.getElementById('generateAppBtn');
    var canReview = (s === 'complete' || s === 'in_progress');
    if (reviewBtn)   reviewBtn.disabled   = !canReview;
    if (generateBtn) generateBtn.disabled = (s !== 'complete');
    // Don't override the gated default state when nothing's happened yet
    if (s === 'complete') {
      btn.classList.add('complete');
      label.textContent = 'Loan App Complete — Resend Link';
      note.textContent = 'Submitted ' + (r.completedAt ? new Date(r.completedAt).toLocaleDateString() : '');
    } else if (s === 'in_progress') {
      btn.classList.add('in-progress');
      label.textContent = 'Loan App — In Progress';
      note.textContent = 'Last activity: ' + (r.lastSavedAt ? new Date(r.lastSavedAt).toLocaleString() : 'unknown');
    } else if (s === 'pending') {
      btn.classList.add('in-progress');
      label.textContent = 'Loan App — Link Sent';
      note.textContent = 'Sent ' + (r.sentAt ? new Date(r.sentAt).toLocaleDateString() : 'recently') + '. Awaiting borrower.';
    } else {
      // Only reset when no record exists yet
      if (!btn.disabled) {
        label.textContent = 'Send Full Loan Application';
        note.textContent = '';
      }
    }
  }).catch(function(){});
}

// Hook the status refresh into the existing render() call.
// We monkey-patch by wrapping the original render so we don't need to find it.
var _origRender = (typeof render === 'function') ? render : null;
if (_origRender) {
  window.render = function() {
    var r = _origRender.apply(this, arguments);
    setTimeout(refreshBorrowerInfoStatus, 100); // give DOM time to mount the button
    return r;
  };
}

init();
