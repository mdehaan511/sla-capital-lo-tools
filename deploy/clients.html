<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book of Clients — SLA Capital</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="sla-api.js"></script>
<script src="quotes.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C8813A;--gold-mid:#b5712d;--gold-light:rgba(200,129,58,0.10);
  --gold-border:rgba(200,129,58,0.28);--dark:#261a36;--bg:#f0ece5;
  --surface:#fff;--text:#1a1520;--muted:#7a7488;--border:#ddd8d0;
  --r:12px;--r-xs:8px;--success:#256940;--danger:#7c1f1f;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 1rem 4rem}
#auth-gate{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:9999}
#auth-gate p{color:rgba(255,255,255,0.4);font-size:14px}
.nav{max-width:1200px;margin:0 auto;padding:1.5rem 0 0;display:flex;align-items:center;justify-content:space-between}
.nav img{height:44px;width:auto}
.nav-right{display:flex;align-items:center;gap:10px}
    .nav-left { display: flex; align-items: center; gap: 12px; }
.back-link{font-size:12px;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--gold)}
.user-pill{font-size:12px;color:var(--muted);background:var(--gold-light);border:1px solid var(--gold-border);padding:4px 12px;border-radius:20px;font-family:'DM Mono',monospace}
.logout-btn{font-size:12px;font-weight:600;color:var(--muted);background:transparent;-webkit-appearance:none;appearance:none;border:1px solid var(--border);padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .15s}
.logout-btn:hover{border-color:var(--gold);color:var(--gold)}
.page{max-width:1200px;margin:0 auto;padding-top:2.25rem}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:16px}
.page-header h1{font-size:22px;font-weight:600}
.page-header p{font-size:13px;color:var(--muted);margin-top:3px}

/* Tabs (admin view) */
.view-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:3px;gap:2px;margin-bottom:1.5rem;width:fit-content}
.view-tab{padding:6px 18px;border-radius:26px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .15s;white-space:nowrap}
.view-tab.active{background:var(--dark);color:#fff}

/* Summary */
.summary-bar{display:flex;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap}
.summary-pill{font-size:12px;padding:5px 14px;border-radius:20px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.summary-pill strong{color:var(--text)}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:1.25rem}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:320px}
.search-wrap input{width:100%;height:38px;padding:0 12px 0 36px;border:1px solid var(--border);border-radius:var(--r-xs);font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--gold)}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
.filter-btn{height:38px;padding:0 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.filter-btn:hover,.filter-btn.active{background:var(--dark);border-color:var(--dark);color:#fff}

/* Client card */
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.client-header{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none;transition:background .1s}
.client-header:hover{background:#faf8f5}
.client-header.open{border-bottom:1px solid var(--border)}
.client-avatar{width:36px;height:36px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.client-info{flex:1;min-width:0}
.client-name{font-size:14px;font-weight:600;color:var(--text)}
.client-meta{font-size:12px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.client-stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--gold-light);color:var(--gold-mid);border:1px solid var(--gold-border)}
.chevron{color:var(--muted);transition:transform .2s;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}
.client-del{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
    .client-header-left { display:flex; align-items:center; gap:14px; flex:1; min-width:0; overflow:hidden; }
    .client-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .client-chevron { display:flex; align-items:center; padding:4px; flex-shrink:0; cursor:pointer; }
.client-del:hover{border-color:var(--danger);color:var(--danger);background:rgba(124,31,31,.06)}
.client-loans{display:none}
.client-loans.open{display:block}

/* Loans sub-table */
.loans-table{width:100%;border-collapse:collapse}
.loans-table th{padding:9px 20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf8f5;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.loans-table td{padding:12px 20px;font-size:13px;border-bottom:1px solid #f0ece6;vertical-align:middle}
.loans-table tr:last-child td{border-bottom:none}
.loans-table tr{cursor:pointer;transition:background .1s}
.loans-table tr:hover{background:#faf8f5}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px}
.badge.dscr{background:rgba(38,26,54,.08);color:var(--dark)}
.badge.rtl,.badge.fix_flip{background:rgba(200,129,58,.12);color:var(--gold-mid)}
.td-mono{font-family:'DM Mono',monospace;font-size:12px}
.del-loan-btn{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid rgba(124,31,31,.2);background:none;color:var(--danger);cursor:pointer;transition:all .15s}
.del-loan-btn:hover{background:rgba(124,31,31,.06)}

.empty-state{padding:4rem 2rem;text-align:center}
.empty-state h3{font-size:16px;font-weight:600;margin-bottom:8px;color:var(--muted)}
.empty-state p{font-size:13px;color:var(--muted);line-height:1.6}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;font-size:13px;font-weight:500;padding:10px 20px;border-radius:30px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:9999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Admin sections */
.admin-section{margin-bottom:20px}
.user-section-hdr{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 20px;cursor:pointer;user-select:none;transition:background .1s}
.user-section-hdr:hover{background:#faf8f5}
.user-section-hdr.is-open{border-bottom-left-radius:0;border-bottom-right-radius:0}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.user-section-body{border:1px solid var(--border);border-top:none;border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);overflow:hidden;display:none;padding:16px 20px}
.user-section-body.open{display:block}
    .nav-tool-link { font-size:12px; font-weight:600; color:var(--muted); text-decoration:none; padding:5px 12px; border-radius:20px; border:1px solid var(--border); transition:all 0.15s; white-space:nowrap; }
    .nav-tool-link:hover { border-color:var(--gold); color:var(--gold); }
    .nav-tool-link.current { background:var(--dark); border-color:var(--dark); color:#fff; }
  </style>
</head>
<body>
<div id="auth-gate"><p>Checking authentication…</p></div>
<div class="toast" id="toast"></div>

<nav class="nav">
  
  <div class="nav-left">
    <img src="SLA_Capital_Logo_2_1.png" alt="SLA Capital" onerror="this.style.display='none'" />
    <a class="nav-tool-link" href="index.html">&#8592; Dashboard</a>
  </div>
  <div class="nav-right"><a class="nav-tool-link" href="saved-quotes.html">Saved Quotes</a>
    <a class="nav-tool-link" href="prospects.html">Prospects</a>
    <a class="nav-tool-link current" href="clients.html">Clients</a>
    <a class="nav-tool-link" id="navAdminLink" href="admin.html" style="display:none">Admin</a>
    <span class="user-pill" id="navEmail"></span>
    <button class="logout-btn" onclick="netlifyIdentity.logout()">Sign out</button>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <div>
      <h1>Book of Clients</h1>
      <p id="pageSubtitle">All clients with loan history.</p>
    </div>
  </div>

  <!-- Admin view switcher -->
  <div class="view-tabs" id="viewTabs" style="display:none">
    <button class="view-tab active" data-view="my" onclick="setView('my')">My Clients</button>
    <button class="view-tab" data-view="admin" onclick="setView('admin')">All Users</button>
  </div>

  <!-- My Clients -->
  <div id="myView">
    <div class="summary-bar" id="summaryBar"></div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="var(--muted)" stroke-width="1.4"/><path d="M10 10l2.5 2.5" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Search name, email, address…" oninput="renderClients()" />
      </div>
      <button class="filter-btn active" data-tf="all"  onclick="setTF('all')">All</button>
      <button class="filter-btn" data-tf="dscr"  onclick="setTF('dscr')">DSCR</button>
      <button class="filter-btn" data-tf="rtl"   onclick="setTF('rtl')">Fix &amp; Flip</button>
    </div>
    <div id="clientsList"></div>
  </div>

  <!-- Admin View -->
  <div id="adminView" style="display:none">
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="var(--muted)" stroke-width="1.4"/><path d="M10 10l2.5 2.5" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="text" id="adminSearch" placeholder="Search across all users…" oninput="renderAdminClients()" />
      </div>
      <button class="filter-btn" style="margin-left:auto" onclick="loadAdminClients(true)">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="display:inline;margin-right:4px"><path d="M10 6A4 4 0 1 1 6 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10 2v4h-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Refresh
      </button>
    </div>
    <div id="adminClientsList"></div>
  </div>
</div>

<script>
// ── Storage helpers ────────────────────────────────────────────
// Clients stored as: sla_clients_{userEmail} → array of client objects
// Each client: { email, firstName, lastName, phone, prospectData, loans:[...quote objects], addedAt }

var _user = null, _isAdmin = false, _clients = [], _tf = 'all', _view = 'my';
var _adminData = null;

// _clients is an in-memory cache of the current user's clients, loaded once
// from the backend. Mutations go through the backend and update the cache.

function refreshClientsFromBackend() {
  return SLA.Clients.list().then(function(r) {
    _clients = (r && r.clients) || [];
    return _clients;
  }).catch(function(err) {
    console.warn('Clients load failed:', err);
    _clients = [];
    return _clients;
  });
}

// ── Auth ────────────────────────────────────────────────────────
function checkAdmin(user) {
  if (!user) return false;
  var roles = [];
  if (user.app_metadata && Array.isArray(user.app_metadata.roles)) roles = user.app_metadata.roles;
  else if (user.app_metadata && typeof user.app_metadata.roles === 'string') roles = [user.app_metadata.roles];
  if (!roles.length && user.user_metadata && user.user_metadata.roles)
    roles = Array.isArray(user.user_metadata.roles) ? user.user_metadata.roles : [user.user_metadata.roles];
  return roles.some(function(r){ return r === 'admin' || r === 'super_admin'; });
}

netlifyIdentity.on('init', function(user) {
  if (!user) { window.location.replace('/'); return; }
  _user = user;
  _isAdmin = checkAdmin(user);
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('navEmail').textContent = user.email;
  if (_isAdmin) document.getElementById('viewTabs').style.display = 'flex';
  var navAdmin = document.getElementById('navAdminLink');
  if (navAdmin && _isAdmin) navAdmin.style.display = 'inline-block';
  refreshClientsFromBackend().then(function() {
    renderSummary();
    renderClients();
  });
});
netlifyIdentity.on('logout', function() { window.location.replace('/'); });

// ── Public API: add/update a client (called from sizers) ────────
// Note: for consistency with older code, this returns the cache synchronously
// and kicks off a backend save in the background.
window.ClientBook = {
  addOrUpdateClient: function(userEmail, prospectData, quote) {
    var borrowerEmail = (prospectData.email || '').toLowerCase().trim();
    var idx = _clients.findIndex(function(c) {
      return (c.email || '').toLowerCase() === borrowerEmail;
    });
    var record;
    if (idx >= 0) {
      record = _clients[idx];
      if (!record.loans) record.loans = [];
      record.loans.unshift(quote);
    } else {
      record = {
        id:          'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        email:       borrowerEmail,
        firstName:   prospectData.firstName || '',
        lastName:    prospectData.lastName  || '',
        phone:       prospectData.phone     || '',
        usCitizen:   prospectData.usCitizen || '',
        addedAt:     new Date().toISOString(),
        prospectData: prospectData,
        loans:       [quote],
      };
      _clients.unshift(record);
    }
    SLA.Clients.save(record).catch(function(err) {
      console.warn('ClientBook save failed:', err);
    });
    return _clients;
  }
};

// ── Render ──────────────────────────────────────────────────────
function renderSummary() {
  var total = _clients.length;
  var totalLoans = _clients.reduce(function(s,c){ return s+(c.loans||[]).length; }, 0);
  document.getElementById('summaryBar').innerHTML =
    '<div class="summary-pill"><strong>'+total+'</strong> clients</div>' +
    '<div class="summary-pill"><strong>'+totalLoans+'</strong> total loans</div>';
}

function setTF(t) {
  _tf = t;
  document.querySelectorAll('[data-tf]').forEach(function(b){ b.classList.toggle('active', b.dataset.tf===t); });
  renderClients();
}

function setView(v) {
  _view = v;
  document.querySelectorAll('[data-view]').forEach(function(b){ b.classList.toggle('active', b.dataset.view===v); });
  document.getElementById('myView').style.display    = v==='my'    ? 'block':'none';
  document.getElementById('adminView').style.display = v==='admin' ? 'block':'none';
  document.getElementById('pageSubtitle').textContent = v==='my'
    ? 'All clients with loan history.'
    : 'All clients across all loan officers — admin view.';
  if (v==='admin' && !_adminData) loadAdminClients(false);
}

function renderClients() {
  var search = (document.getElementById('searchInput').value||'').toLowerCase().trim();
  var list = document.getElementById('clientsList');
  list.innerHTML = '';

  var filtered = _clients.filter(function(c) {
    if (_tf !== 'all') {
      var hasType = (c.loans||[]).some(function(l){ return l.toolType===_tf; });
      if (!hasType) return false;
    }
    if (search) {
      var hay = [c.firstName,c.lastName,c.email,c.phone,(c.prospectData||{}).propAddress||''].join(' ').toLowerCase();
      if (hay.indexOf(search)<0) return false;
    }
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><h3>No clients yet</h3><p>Clients are added automatically when you save a quote<br>for a borrower who came through your application link.</p></div>';
    return;
  }

  filtered.forEach(function(c) { list.appendChild(buildClientCard(c, _user.email, false)); });
}

function buildClientCard(c, userEmail, readOnly) {
  var loans = (c.loans||[]);
  var totalLoans = loans.length;
  var initials = ((c.firstName||'?').charAt(0)+(c.lastName||'').charAt(0)).toUpperCase();
  var cardId = 'card-'+c.id;
  var loansId = 'loans-'+c.id;

  var card = document.createElement('div');
  card.className = 'client-card';
  card.innerHTML =
    '<div class="client-header" id="'+cardId+'">' +
      '<div class="client-header-left" onclick="toggleCard(\''+loansId+'\',\''+cardId+'\')">'+
        '<div class="client-avatar">'+escH(initials)+'</div>' +
        '<div class="client-info">' +
          '<div class="client-name">'+escH((c.firstName||'')+' '+(c.lastName||''))+'</div>' +
          '<div class="client-meta">'+escH(c.email)+(c.phone?' · '+escH(c.phone):'')+'</div>' +
        '</div>' +
      '</div>' +
      '<div class="client-stats">' +
        '<span class="stat-badge">'+totalLoans+' loan'+(totalLoans!==1?'s':'')+'</span>' +
        '<a href="client-details.html?clientId='+encodeURIComponent(c.id)+'" class="client-details-btn" onclick="event.stopPropagation()">Details →</a>' +
      '</div>' +
      (!readOnly
        ? '<button class="client-del" onclick="event.stopPropagation();deleteClient(\''+escAttr(c.id)+'\',\''+escAttr(userEmail||'')+'\')">✕</button>'
        : '') +
      '<div onclick="toggleCard(\''+loansId+'\',\''+cardId+'\')" style="cursor:pointer;padding:4px"><svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
    '</div>' +
    '<div class="client-loans" id="'+loansId+'">' +
      buildLoansTable(loans, c, userEmail, readOnly) +
    '</div>';

  return card;
}

function buildLoansTable(loans, client, userEmail, readOnly) {
  if (!loans || !loans.length) return '<div style="padding:20px;text-align:center;font-size:13px;color:var(--muted)">No loans yet.</div>';

  var html = '<table class="loans-table"><thead><tr>' +
    '<th>Address</th><th>Tool</th><th>Status</th><th>Amount</th><th>Rate</th><th>Saved</th><th></th>' +
    '</tr></thead><tbody>';

  loans.forEach(function(l) {
    var fd = l.formData || {};
    var isDscr = (l.toolType||'') !== 'rtl';
    var rawAmt = l.loanAmt || fd.loanAmt || l.purchasePrice || fd.purchasePrice;
    var amt  = rawAmt ? '$'+Number(rawAmt).toLocaleString() : '—';
    var rate = (l.rate || fd._finalRate) ? (l.rate||fd._finalRate)+'%' : '—';
    var date = (l.savedAt||l.updatedAt) ? new Date(l.savedAt||l.updatedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    var status = l.status || 'active';
    var STATUS_LABELS = { active:'Active', on_hold:'On Hold', submitted:'Submitted', approved:'Approved', denied:'Denied' };
    var statusLabel = STATUS_LABELS[status] || status;
    var statusStyle = status==='approved' ? 'color:var(--success);font-weight:600' :
                      status==='denied'   ? 'color:var(--danger);font-weight:600'  :
                      status==='submitted'? 'color:var(--dark);font-weight:600'    : 'color:var(--muted)';
    var detailsUrl = l.id ? 'loan-details.html?clientId='+encodeURIComponent(client.id)+'&loanId='+encodeURIComponent(l.id) : '#';

    html += '<tr>' +
      '<td class="td-mono" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escH(l.address||'—')+'</td>' +
      '<td><span class="badge '+(l.toolType||'dscr')+'">'+((l.toolType||'dscr').toUpperCase())+'</span></td>' +
      '<td style="font-size:12px;'+statusStyle+'">'+escH(statusLabel)+'</td>' +
      '<td class="td-mono">'+escH(amt)+'</td>' +
      '<td class="td-mono">'+escH(rate)+'</td>' +
      '<td class="td-mono">'+date+'</td>' +
      '<td onclick="event.stopPropagation()" style="white-space:nowrap">' +
        (l.id ? '<a href="'+detailsUrl+'" class="details-link" onclick="event.stopPropagation()">Details →</a> ' : '') +
        (!readOnly && l.id ? '<button class="del-loan-btn" onclick="event.stopPropagation();deleteLoan(\''+escAttr(client.id)+'\',\''+escAttr(l.id)+'\',\''+escAttr(userEmail||'')+'\')">✕</button>' : '') +
      '</td>' +
      '</tr>';
  });

  html += '</tbody></table>';
  return html;
}

function openLoanInSizer(loanJson) {
  var l = typeof loanJson === 'string' ? JSON.parse(loanJson) : loanJson;
  var tool = l.toolType==='rtl' ? 'rtl-sizer.html' : 'dscr-sizer.html';
  window.location.href = tool + '?loadQuote=' + encodeURIComponent(l.address||'');
}

function toggleCard(loansId, headerId) {
  var loans = document.getElementById(loansId);
  var head  = document.getElementById(headerId);
  if (!loans) return;
  var open = loans.classList.contains('open');
  loans.classList.toggle('open', !open);
  if (head) {
    head.classList.toggle('open', !open);
    var chev = head.querySelector('.chevron');
    if (chev) chev.classList.toggle('open', !open);
  }
}

function deleteClient(id, userEmail) {
  if (!confirm('Delete this client and all their loans? This cannot be undone.')) return;
  var loEmail = userEmail || _user.email;
  // Find client before removing so we can clean up QuoteStore
  var clientToDelete = _clients.find(function(c){ return c.id===id; });

  var opts = {};
  if (userEmail && userEmail !== _user.email) opts._owner = userEmail;

  SLA.Clients.delete(id, opts).then(function() {
    _clients = _clients.filter(function(c){ return c.id!==id; });
    // Remove all their loans from QuoteStore too
    if (clientToDelete && window.QuoteStore) {
      (clientToDelete.loans||[]).forEach(function(l) {
        if (l.address && l.toolType) QuoteStore.deleteQuote(loEmail, l.toolType, l.address);
      });
    }
    renderSummary();
    renderClients();
    showToast('Client deleted');
  }).catch(function(err) {
    showToast('Delete failed: ' + (err.message || 'unknown error'));
  });
}

function deleteLoan(clientId, loanId, userEmail) {
  if (!confirm('Delete this loan? The client will remain in the book.')) return;
  var loEmail = userEmail || _user.email;
  var c = _clients.find(function(c){ return c.id===clientId; });
  var loanToDelete = null;
  if (c && c.loans) {
    loanToDelete = c.loans.find(function(l){ return l.id===loanId || (l.address||l.id||'')===loanId; });
  }

  var opts = { loanId: loanId };
  if (userEmail && userEmail !== _user.email) opts._owner = userEmail;

  SLA.Clients.delete(clientId, opts).then(function(r) {
    if (c && r && r.client) {
      // Backend returns the updated client record
      var i = _clients.indexOf(c);
      if (i >= 0) _clients[i] = r.client;
    }
    // Also remove from QuoteStore
    if (loanToDelete && loanToDelete.address && window.QuoteStore) {
      var toolType = loanToDelete.toolType || 'dscr';
      QuoteStore.deleteQuote(loEmail, toolType, loanToDelete.address);
    }
    renderSummary();
    renderClients();
  }).catch(function(err) {
    showToast('Delete failed: ' + (err.message || 'unknown error'));
  });
}

// ── Admin view ──────────────────────────────────────────────────
function loadAdminClients(forceRefresh) {
  if (!forceRefresh && _adminData) { renderAdminClients(); return; }
  var wrap = document.getElementById('adminClientsList');
  wrap.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--muted);font-size:13px">Loading…</div>';
  if (!_user) return;
  SLA.Clients.list({ all: true }).then(function(resp) {
    var byOwner = (resp && resp.byOwner) || {};
    _adminData = Object.keys(byOwner).map(function(owner) {
      return {
        id: owner,          // storage-key "id" (email-based)
        email: owner,
        clients: byOwner[owner] || [],
        confirmed: true,
      };
    }).sort(function(a,b){ return a.email.localeCompare(b.email); });
    renderAdminClients();
  }).catch(function(err) {
    wrap.innerHTML = '<div class="empty-state"><h3>Failed to load</h3><p>'+escH(err.message || 'unknown error')+'</p></div>';
  });
}

function renderAdminClients() {
  if (!_adminData) return;
  var search = (document.getElementById('adminSearch').value||'').toLowerCase().trim();
  var wrap = document.getElementById('adminClientsList');
  wrap.innerHTML = '';

  _adminData.forEach(function(userData) {
    var sec = document.createElement('div');
    sec.className = 'admin-section';
    var displayName = humanizeEmail(userData.email);
    var initials = displayName.split(' ').map(function(p){return p.charAt(0);}).join('').slice(0,2).toUpperCase() || '?';
    var bodyId = 'abody-'+userData.id;
    var headId = 'ahead-'+userData.id;

    sec.innerHTML =
      '<div class="user-section-hdr" id="'+headId+'" onclick="toggleAdminSection(\''+bodyId+'\',\''+headId+'\')">' +
        '<div class="user-avatar">'+escH(initials)+'</div>' +
        '<div style="flex:1">'+
          '<div style="font-size:14px;font-weight:600">'+escH(displayName)+'</div>' +
          '<div style="font-size:11px;color:var(--muted)">'+escH(userData.email)+'</div>' +
        '</div>' +
        '<span style="font-size:12px;color:var(--muted)">'+userData.clients.length+' client'+(userData.clients.length!==1?'s':'')+'</span>' +
        '<svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '</div>' +
      '<div class="user-section-body" id="'+bodyId+'">'+
        buildAdminClientList(userData.clients) +
      '</div>';

    wrap.appendChild(sec);
  });

  if (!wrap.children.length) {
    wrap.innerHTML = '<div class="empty-state"><h3>No data</h3><p>No users found or no client data synced yet.</p></div>';
  }
}

function toggleAdminSection(bodyId, headId) {
  var body = document.getElementById(bodyId);
  var head = document.getElementById(headId);
  if (!body) return;
  var open = body.classList.contains('open');
  body.classList.toggle('open', !open);
  if (head) {
    head.classList.toggle('is-open', !open);
    var chev = head.querySelector('.chevron');
    if (chev) chev.classList.toggle('open', !open);
  }
}

function buildAdminClientList(clientList) {
  if (!clientList || !clientList.length) {
    return '<div style="padding:20px;text-align:center;font-size:13px;color:var(--muted)">No synced client data.<br><small style="font-size:11px">Clients sync automatically when a quote is saved for a prospect.</small></div>';
  }
  var html = '<table style="width:100%;border-collapse:collapse;font-size:13px">';
  html += '<thead><tr>';
  html += '<th style="padding:9px 20px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf8f5;border-bottom:1px solid var(--border)">Name</th>';
  html += '<th style="padding:9px 20px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf8f5;border-bottom:1px solid var(--border)">Email</th>';
  html += '<th style="padding:9px 20px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf8f5;border-bottom:1px solid var(--border)">Phone</th>';
  html += '<th style="padding:9px 20px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf8f5;border-bottom:1px solid var(--border)">Loans</th>';
  html += '<th style="padding:9px 20px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf8f5;border-bottom:1px solid var(--border)">Added</th>';
  html += '</tr></thead><tbody>';
  clientList.forEach(function(c, i) {
    var isLast = i === clientList.length - 1;
    var date = c.addedAt ? new Date(c.addedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    html += '<tr style="border-bottom:'+(isLast?'none':'1px solid #f0ece6')+'">';
    html += '<td style="padding:11px 20px;font-weight:500">'+escH((c.firstName||'')+' '+(c.lastName||''))+'</td>';
    html += '<td style="padding:11px 20px;font-family:DM Mono,monospace;font-size:12px">'+escH(c.email||'—')+'</td>';
    html += '<td style="padding:11px 20px;font-family:DM Mono,monospace;font-size:12px">'+escH(c.phone||'—')+'</td>';
    html += '<td style="padding:11px 20px"><span style="background:var(--gold-light);color:var(--gold-mid);border:1px solid var(--gold-border);font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">'+(c.loanCount||0)+' loan'+((c.loanCount||0)!==1?'s':'')+'</span></td>';
    html += '<td style="padding:11px 20px;font-size:12px;color:var(--muted);font-family:DM Mono,monospace">'+date+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function humanizeEmail(email) {
  if (!email) return '';
  var s = String(email);
  var at = s.indexOf('@');
  var local = at >= 0 ? s.slice(0, at) : s;
  var parts = local.split(/[._\-]+/).filter(Boolean);
  if (!parts.length) return s;
  return parts.map(function(p){ return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase(); }).join(' ') || s;
}
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},3000);
}
</script>
