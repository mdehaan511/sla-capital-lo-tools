<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book of Clients — SLA Capital</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="sla-api.js"></script>
<script src="sla-forms.js"></script>
<!-- Deploy 236.325 — defer non-critical shell scripts. -->
<script src="sla-nav.js" defer></script>
<script src="sla-notifications.js" defer></script>
<script src="sla-chat.js" defer></script>
<script src="quotes.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C8813A;--gold-mid:#b5712d;--gold-light:rgba(200,129,58,0.10);
  --gold-border:rgba(200,129,58,0.28);--dark:#261a36;--bg:#f0ece5;
  --surface:#fff;--text:#1a1520;--muted:#7a7488;--border:#ddd8d0;
  --r:12px;--r-xs:8px;--success:#256940;--danger:#7c1f1f;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 1rem 4rem}
#auth-gate{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:9999}
#auth-gate p{color:rgba(255,255,255,0.4);font-size:14px}
.nav{max-width:1200px;margin:0 auto;padding:1.5rem 0 0;display:flex;align-items:center;justify-content:space-between}
.nav img{height:44px;width:auto}
.nav-right{display:flex;align-items:center;gap:10px}
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .nav-tools-btn {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--gold-border, rgba(200,129,58,0.28));
      background: var(--gold-light, rgba(200,129,58,0.10));
      color: var(--gold-mid, #b5712d);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      text-decoration: none;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .nav-tools-btn:hover {
      background: var(--gold, #C8813A);
      color: #fff;
      border-color: var(--gold, #C8813A);
    }
.back-link{font-size:12px;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--gold)}
.user-pill{font-size:12px;color:var(--muted);background:var(--gold-light);border:1px solid var(--gold-border);padding:4px 12px;border-radius:20px;font-family:'DM Mono',monospace}
.logout-btn{font-size:12px;font-weight:600;color:var(--muted);background:transparent;-webkit-appearance:none;appearance:none;border:1px solid var(--border);padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .15s}
.logout-btn:hover{border-color:var(--gold);color:var(--gold)}
.page{max-width:1200px;margin:0 auto;padding-top:2.25rem}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:16px}
.page-header h1{font-size:22px;font-weight:600}
.page-header p{font-size:13px;color:var(--muted);margin-top:3px}

/* Tabs (admin view) */
.view-tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:3px;gap:2px;margin-bottom:1.5rem;width:fit-content}
.view-tab{padding:6px 18px;border-radius:26px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .15s;white-space:nowrap}
.view-tab.active{background:var(--dark);color:#fff}

/* Summary */
.summary-bar{display:flex;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap}
.summary-pill{font-size:12px;padding:5px 14px;border-radius:20px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.summary-pill strong{color:var(--text)}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:1.25rem}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:320px}
.search-wrap input{width:100%;height:38px;padding:0 12px 0 36px;border:1px solid var(--border);border-radius:var(--r-xs);font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--gold)}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}
.filter-btn{height:38px;padding:0 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.filter-btn:hover,.filter-btn.active{background:var(--dark);border-color:var(--dark);color:#fff}
.admin-lo-filter{height:38px;padding:0 32px 0 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;margin-left:auto;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23766f80' d='M0 0l5 6 5-6z'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
.admin-lo-filter:focus{outline:none;border-color:var(--gold)}
.admin-lo-filter.has-value{border-color:var(--gold);background-color:rgba(200,129,58,0.06);color:var(--gold-mid)}

/* Client card */
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.client-header{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none;transition:background .1s}
.client-header:hover{background:#faf8f5}
.client-header.open{border-bottom:1px solid var(--border)}
.client-avatar{width:36px;height:36px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.client-info{flex:1;min-width:0}
.client-name{font-size:14px;font-weight:600;color:var(--text)}
.client-name-link{color:inherit;text-decoration:none;border-bottom:1px solid transparent;transition:border-color 0.15s,color 0.15s}
.client-name-link:hover{color:var(--gold);border-bottom-color:var(--gold)}
.loan-addr-link{color:inherit;text-decoration:none;border-bottom:1px solid transparent;transition:border-color 0.15s,color 0.15s}
.loan-addr-link:hover{color:var(--gold);border-bottom-color:var(--gold)}
.client-meta{font-size:12px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.lo-tag-row{margin-top:4px}
.lo-tag-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--gold-light);color:var(--gold-mid);border:1px solid var(--gold-border)}
.lo-tag-badge::before{content:"●";font-size:8px;line-height:1}
.client-stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--gold-light);color:var(--gold-mid);border:1px solid var(--gold-border)}
.chevron{color:var(--muted);transition:transform .2s;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}
.client-del{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
    .client-header-left { display:flex; align-items:center; gap:14px; flex:1; min-width:0; overflow:hidden; }
    .client-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .client-chevron { display:flex; align-items:center; padding:4px; flex-shrink:0; cursor:pointer; }
.client-del:hover{border-color:var(--danger);color:var(--danger);background:rgba(124,31,31,.06)}
.client-loans{display:none}
.client-loans.open{display:block}

/* Loans sub-table */
.loans-table{width:100%;border-collapse:collapse}
.loans-table th{padding:9px 20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf8f5;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.loans-table td{padding:12px 20px;font-size:13px;border-bottom:1px solid #f0ece6;vertical-align:middle}
.loans-table tr:last-child td{border-bottom:none}
.loans-table tr{cursor:pointer;transition:background .1s}
.loans-table tr:hover{background:#faf8f5}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px}
.badge.dscr{background:rgba(38,26,54,.08);color:var(--dark)}
.badge.rtl,.badge.fix_flip{background:rgba(200,129,58,.12);color:var(--gold-mid)}
.td-mono{font-family:'DM Mono',monospace;font-size:12px}
.del-loan-btn{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid rgba(124,31,31,.2);background:none;color:var(--danger);cursor:pointer;transition:all .15s}
.del-loan-btn:hover{background:rgba(124,31,31,.06)}

.empty-state{padding:4rem 2rem;text-align:center}
.empty-state h3{font-size:16px;font-weight:600;margin-bottom:8px;color:var(--muted)}
.empty-state p{font-size:13px;color:var(--muted);line-height:1.6}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;font-size:13px;font-weight:500;padding:10px 20px;border-radius:30px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:9999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Add Contact button */
.add-contact-btn{padding:9px 16px;background:var(--dark);color:#fff;border:none;border-radius:22px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
.add-contact-btn:hover{background:#1c1227}

/* Alphabetical jump bar */
.alpha-jump{display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);position:sticky;top:8px;z-index:10}
.alpha-btn{flex:1;min-width:24px;padding:5px 0;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;border-radius:6px;transition:all .12s}
.alpha-btn:hover:not(:disabled){background:var(--gold-light);color:var(--gold-mid)}
.alpha-btn.empty{color:var(--muted);opacity:0.35;cursor:default}

/* Letter dividers */
.letter-divider{display:flex;align-items:baseline;gap:14px;padding:12px 4px 8px;margin-top:18px;margin-bottom:6px;border-bottom:1px solid var(--gold-border);scroll-margin-top:80px}
.letter-divider:first-of-type{margin-top:0}
.letter-divider-letter{font-family:'Lora',serif;font-size:24px;font-weight:600;color:var(--gold)}
.letter-divider-count{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(38,26,54,0.55);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:var(--r);max-width:480px;width:100%;padding:1.75rem}
.modal h3{font-family:'Lora',serif;font-size:19px;margin-bottom:8px}
.modal-intro{font-size:13px;color:var(--muted);margin-bottom:1.25rem;line-height:1.5}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-field{margin-bottom:1rem}
.modal-field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:6px}
.modal-field label .req{color:var(--danger)}
.modal-field input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-xs,8px);font-family:'DM Sans',sans-serif;font-size:13px;background:var(--surface);color:var(--text)}
.modal-field input:focus{outline:none;border-color:var(--gold)}
.modal-status{font-size:12px;min-height:18px;margin-bottom:8px}
.modal-status.err{color:var(--danger)}
.modal-status.ok{color:var(--success)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.modal-btn{font-size:13px;font-weight:600;padding:9px 18px;border-radius:22px;cursor:pointer;font-family:'DM Sans',sans-serif;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.modal-btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.modal-btn.primary:hover:not(:disabled){background:#1c1227}
.modal-btn:disabled{opacity:0.5;cursor:wait}

/* Admin sections */
.admin-section{margin-bottom:20px}
.user-section-hdr{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 20px;cursor:pointer;user-select:none;transition:background .1s}
.user-section-hdr:hover{background:#faf8f5}
.user-section-hdr.is-open{border-bottom-left-radius:0;border-bottom-right-radius:0}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.user-section-body{border:1px solid var(--border);border-top:none;border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);overflow:hidden;display:none;padding:16px 20px}
.user-section-body.open{display:block}
    .nav-tool-link { font-size:12px; font-weight:600; color:var(--muted); text-decoration:none; padding:5px 12px; border-radius:20px; border:1px solid var(--border); transition:all 0.15s; white-space:nowrap; }
    .nav-tool-link:hover { border-color:var(--gold); color:var(--gold); }
    .nav-tool-link.current { background:var(--dark); border-color:var(--dark); color:#fff; }
  </style>
</head>
<body>
<div id="auth-gate"><p>Checking authentication…</p></div>
<div class="toast" id="toast"></div>

<!-- Add Contact modal -->
<div class="modal-bg" id="addContactModal">
  <div class="modal">
    <h3>Add Contact</h3>
    <p class="modal-intro">Save a contact without a loan. If they later submit an application or you save a loan with their email, both will be linked to this record automatically.</p>
    <div class="modal-row">
      <div class="modal-field">
        <label>First Name <span class="req">*</span></label>
        <input type="text" id="ac-firstName" />
      </div>
      <div class="modal-field">
        <label>Last Name <span class="req">*</span></label>
        <input type="text" id="ac-lastName" />
      </div>
    </div>
    <div class="modal-field">
      <label>Email <span class="req">*</span></label>
      <input type="email" id="ac-email" placeholder="contact@example.com" />
    </div>
    <div class="modal-field">
      <label>Phone</label>
      <input type="tel" id="ac-phone" placeholder="(555) 123-4567" data-sla-mask="phone" />
    </div>
    <div class="modal-status" id="ac-status"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeAddContact()">Cancel</button>
      <button class="modal-btn primary" id="ac-saveBtn" onclick="saveAddContact()">Save Contact</button>
    </div>
  </div>
</div>

<nav class="nav" id="slaNav"></nav>

<div class="page">
  <div class="page-header">
    <div>
      <h1>Book of Clients</h1>
      <p id="pageSubtitle">All clients with loan history.</p>
    </div>
    <div>
      <button class="add-contact-btn" onclick="openAddContact()">+ Add Contact</button>
    </div>
  </div>

  <!-- Admin view switcher -->
  <div class="view-tabs" id="viewTabs" style="display:none">
    <button class="view-tab active" data-view="my" onclick="setView('my')">My Clients</button>
    <button class="view-tab" data-view="admin" onclick="setView('admin')">All Users</button>
  </div>

  <!-- My Clients -->
  <div id="myView">
    <div class="summary-bar" id="summaryBar"></div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="var(--muted)" stroke-width="1.4"/><path d="M10 10l2.5 2.5" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Search name, email, address…" oninput="_debouncedRenderClients()" />
      </div>
      <button class="filter-btn active" data-tf="all"  onclick="setTF('all')">All</button>
      <button class="filter-btn" data-tf="dscr"  onclick="setTF('dscr')">DSCR</button>
      <button class="filter-btn" data-tf="rtl"   onclick="setTF('rtl')">Fix &amp; Flip</button>
      <button class="filter-btn" onclick="downloadClientsCSV()" title="Download visible clients as CSV">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="display:inline;margin-right:4px;vertical-align:-1px"><path d="M6 1.5v6m0 0L3.5 5M6 7.5L8.5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 9v1.5h8V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        CSV
      </button>
      <!-- Deploy 236.230 — Select Multiple toggle. When on, a checkbox
           appears on each client card and the action bar (below) slides
           in with Merge Selected + Delete Selected. Mirrors the loans.html
           pattern from Deploy 236.29. -->
      <button class="filter-btn" id="selectModeBtn" onclick="toggleSelectMode()" style="margin-left:auto">
        Select Multiple
      </button>
    </div>
    <!-- Selection action bar — shows in select mode with 1+ selected. -->
    <div id="selectActionBar" style="display:none;background:var(--gold-light);border:1px solid var(--gold-border);border-radius:12px;padding:10px 14px;margin:0 0 1rem 0;align-items:center;gap:14px;flex-wrap:wrap">
      <span id="selectCount" style="font-size:13px;font-weight:600;color:var(--gold-mid)"></span>
      <button type="button" class="filter-btn" onclick="clearSelections()">Clear</button>
      <span style="flex:1"></span>
      <button type="button" class="filter-btn" id="mergeSelectedBtn" onclick="openMergeSelectedModal()" style="background:rgba(133,77,14,0.10);color:#854d0e;border:1px solid rgba(133,77,14,0.40)">Merge Selected (pick 2)</button>
      <button type="button" class="filter-btn" id="deleteSelectedBtn" onclick="confirmDeleteSelected()" style="background:rgba(124,31,31,0.10);color:var(--danger);border:1px solid rgba(124,31,31,0.40)">Delete Selected</button>
    </div>
    <div class="alpha-jump" id="alphaJump" style="display:none"></div>
    <div id="clientsList"></div>
  </div>

  <!-- Admin View -->
  <div id="adminView" style="display:none">
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="var(--muted)" stroke-width="1.4"/><path d="M10 10l2.5 2.5" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="text" id="adminSearch" placeholder="Search across all users…" oninput="renderAdminClients()" />
      </div>
      <select id="adminLoFilter" class="admin-lo-filter" onchange="renderAdminClients()">
        <option value="">All LOs</option>
      </select>
      <button class="filter-btn" onclick="loadAdminClients(true)">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="display:inline;margin-right:4px"><path d="M10 6A4 4 0 1 1 6 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10 2v4h-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Refresh
      </button>
      <!-- Deploy 236.231 — same Select Multiple UX in the admin view. -->
      <button class="filter-btn" id="selectModeBtnAdmin" onclick="toggleSelectMode()" style="margin-left:auto">
        Select Multiple
      </button>
    </div>
    <!-- Admin-view action bar. refreshSelectionBar() toggles both this
         and the personal-view one — only the one under the visible
         view is on-screen anyway. -->
    <div id="selectActionBarAdmin" style="display:none;background:var(--gold-light);border:1px solid var(--gold-border);border-radius:12px;padding:10px 14px;margin:0 0 1rem 0;align-items:center;gap:14px;flex-wrap:wrap">
      <span id="selectCountAdmin" style="font-size:13px;font-weight:600;color:var(--gold-mid)"></span>
      <button type="button" class="filter-btn" onclick="clearSelections()">Clear</button>
      <span style="flex:1"></span>
      <button type="button" class="filter-btn" id="mergeSelectedBtnAdmin" onclick="openMergeSelectedModal()" style="background:rgba(133,77,14,0.10);color:#854d0e;border:1px solid rgba(133,77,14,0.40)">Merge Selected (pick 2)</button>
      <button type="button" class="filter-btn" id="deleteSelectedBtnAdmin" onclick="confirmDeleteSelected()" style="background:rgba(124,31,31,0.10);color:var(--danger);border:1px solid rgba(124,31,31,0.40)">Delete Selected</button>
    </div>
    <div class="alpha-jump" id="adminAlphaJump" style="display:none"></div>
    <div class="summary-bar" id="adminSummaryBar"></div>
    <div id="adminClientsList"></div>
  </div>
</div>

<script>
// ── Storage helpers ────────────────────────────────────────────
// Clients stored as: sla_clients_{userEmail} → array of client objects
// Each client: { email, firstName, lastName, phone, prospectData, loans:[...quote objects], addedAt }

// Deploy 236.266 — `_isStaff` (admin OR processor) for cross-LO scope.
var _user = null, _isAdmin = false, _isStaff = false, _clients = [], _tf = 'all', _view = 'my';
var _adminData = null;
// Deploy 236.26 — keySafed owner keys for LOs flagged deleted by
// users-stats. Used to hide them from the admin LO filter.
var _deletedOwners = {};
function _keySafe(e) { return String(e || '').toLowerCase().replace(/[^a-z0-9]/g, '_'); }

// _clients is an in-memory cache of the current user's clients, loaded once
// from the backend. Mutations go through the backend and update the cache.

function refreshClientsFromBackend() {

function checkAdmin(user) {
  if (!user) return false;
  var roles = [];
  if (user.app_metadata && Array.isArray(user.app_metadata.roles)) roles = user.app_metadata.roles;
  else if (user.app_metadata && typeof user.app_metadata.roles === 'string') roles = [user.app_metadata.roles];
  if (!roles.length && user.user_metadata && user.user_metadata.roles)
    roles = Array.isArray(user.user_metadata.roles) ? user.user_metadata.roles : [user.user_metadata.roles];
  return roles.some(function(r){ return r === 'admin' || r === 'super_admin'; });
}

    if (_view === 'admin') setView('admin');
  });

  // Deploy 194 (perf): stale-while-revalidate paint. If there\u2019s a
  // recent cached client list in localStorage (populated by any prior
  // visit within the last 5 min), render it synchronously so the
  // page paints instantly. The fresh fetch above still runs and
  // re-renders with up-to-date data when it arrives.
  try {

});

// ── Public API: add/update a client (called from sizers) ────────
// Note: for consistency with older code, this returns the cache synchronously
// and kicks off a backend save in the background.
window.ClientBook = {
  addOrUpdateClient: function(userEmail, prospectData, quote) {
    var borrowerEmail = (prospectData.email || '').toLowerCase().trim();
    var idx = _clients.findIndex(function(c) {
      return (c.email || '').toLowerCase() === borrowerEmail;
    });
    var record;
    if (idx >= 0) {
      record = _clients[idx];
      if (!record.loans) record.loans = [];
      record.loans.unshift(quote);
    } else {
      record = {
        id:          'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        email:       borrowerEmail,
        firstName:   prospectData.firstName || '',
        lastName:    prospectData.lastName  || '',
        phone:       prospectData.phone     || '',
        usCitizen:   prospectData.usCitizen || '',
        addedAt:     new Date().toISOString(),
        prospectData: prospectData,
        loans:       [quote],
      };
      _clients.unshift(record);
    }
    SLA.Clients.save(record).catch(function(err) {
      console.warn('ClientBook save failed:', err);
    });
    return _clients;
  }
};

// CSV export of the LO's clients. Respects the currently-applied search +
// type filter so the file matches what the LO is looking at on screen
// (less surprising than always-exports-everything). Four columns:
// Name, Email, Phone, Added Date.
//
// Escaping follows RFC 4180: wrap any value with comma/quote/newline in
// double quotes, double-up internal quotes. UTF-8 BOM at the top so Excel
// reads accented chars correctly.
function downloadClientsCSV() {
  if (!_clients || !_clients.length) {
    alert('No clients to download yet.');
    return;
  }
  // Apply the same filter logic renderClients() uses, so the CSV matches
  // the on-screen view. If we ever diverge, this is the place to fix.
  var search = (document.getElementById('searchInput').value||'').toLowerCase().trim();
  var rows = _clients.filter(function(c) {
    if (_tf !== 'all') {
      var hasType = (c.loans||[]).some(function(l){ return l.toolType===_tf; });
      if (!hasType) return false;
    }
    if (search) {
      var hay = [c.firstName,c.lastName,c.email,c.phone,(c.prospectData||{}).propAddress||''].join(' ').toLowerCase();
      if (hay.indexOf(search)<0) return false;
    }
    return true;
  });
  rows.sort(function(a, b) {
    var aFirst = (a.firstName || '').toLowerCase();
    var bFirst = (b.firstName || '').toLowerCase();
    if (aFirst !== bFirst) return aFirst.localeCompare(bFirst);
    return (a.lastName || '').toLowerCase().localeCompare((b.lastName || '').toLowerCase());
  });
  if (!rows.length) {
    alert('No clients match the current filter.');
    return;
  }

  function csvEsc(v) {
    var s = String(v == null ? '' : v);
    // Per RFC 4180: only quote if necessary
    if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0 || s.indexOf('\r') >= 0) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    // YYYY-MM-DD so the CSV sorts naturally and Excel reads it as a date
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  var lines = ['Name,Email,Phone,Added Date'];
  rows.forEach(function(c) {
    var name = ((c.firstName || '') + ' ' + (c.lastName || '')).trim();
    lines.push([
      csvEsc(name),
      csvEsc(c.email || ''),
      csvEsc(c.phone || ''),
      csvEsc(fmtDate(c.createdAt)),
    ].join(','));
  });

  // UTF-8 BOM so Excel handles accented characters correctly
  var bom = '\uFEFF';
  var blob = new Blob([bom + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
  var ts = new Date().toISOString().slice(0, 10);
  var fnSuffix = _tf !== 'all' ? '_' + _tf : '';
  if (search) fnSuffix += '_filtered';
  var filename = 'SLA_Clients_' + ts + fnSuffix + '.csv';

  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // Free the blob URL after the click is handled
  setTimeout(function() { URL.revokeObjectURL(url); }, 0);
}

// Deploy 236.325 — debounced trampoline for search input.
var _debouncedRenderClients = (window.SLAForms && SLAForms.debounce)
  ? SLAForms.debounce(function() { renderClients(); }, 140)
  : function() { renderClients(); };

function renderClients() {
  var search = (document.getElementById('searchInput').value||'').toLowerCase().trim();
  var list = document.getElementById('clientsList');
  list.innerHTML = '';

  var filtered = _clients.filter(function(c) {
    if (_tf !== 'all') {
      var hasType = (c.loans||[]).some(function(l){ return l.toolType===_tf; });
      if (!hasType) return false;
    }
    if (search) {
      var hay = [c.firstName,c.lastName,c.email,c.phone,(c.prospectData||{}).propAddress||''].join(' ').toLowerCase();
      if (hay.indexOf(search)<0) return false;
    }
    return true;
  });

  // Sort clients alphabetically by last name, then first name
  filtered.sort(function(a, b) {
    var aLast = (a.lastName || '').toLowerCase();
    var bLast = (b.lastName || '').toLowerCase();
    if (aLast !== bLast) return aLast.localeCompare(bLast);
    var aFirst = (a.firstName || '').toLowerCase();
    var bFirst = (b.firstName || '').toLowerCase();
    return aFirst.localeCompare(bFirst);
  });

  if (!filtered.length) {
    document.getElementById('alphaJump').style.display = 'none';
    if (search) {
      list.innerHTML = '<div class="empty-state"><h3>No matching clients</h3><p>Nothing matches "<strong>'+escH(search)+'</strong>". Try a different search.</p></div>';
    } else {
      list.innerHTML = '<div class="empty-state"><h3>No clients yet</h3><p>Add a contact above, or clients will appear automatically<br>when you save a quote for a borrower.</p></div>';
    }
    return;
  }

  // Group by first letter of last name (or '#' for missing)
  var groups = {};
  filtered.forEach(function(c) {
    var letter = ((c.firstName || c.lastName || '#').charAt(0) || '#').toUpperCase();
    if (!/[A-Z]/.test(letter)) letter = '#';
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(c);
  });
  var letters = Object.keys(groups).sort(function(a, b) {
    if (a === '#') return 1;
    if (b === '#') return -1;
    return a.localeCompare(b);
  });

  // Render the A-Z jump bar
  renderAlphaJump(letters);

  // Render groups
  letters.forEach(function(L) {
    var hdr = document.createElement('div');
    hdr.className = 'letter-divider';
    hdr.id = 'letter-' + L;
    hdr.innerHTML = '<span class="letter-divider-letter">' + L + '</span>' +
      '<span class="letter-divider-count">' + groups[L].length + ' client' + (groups[L].length === 1 ? '' : 's') + '</span>';
    list.appendChild(hdr);
    groups[L].forEach(function(c) { list.appendChild(buildClientCard(c, _user.email, false)); });
  });
}

function renderAlphaJump(presentLetters, opts) {
  opts = opts || {};
  var barId = opts.barId || 'alphaJump';
  var prefix = opts.prefix || 'letter-';
  var bar = document.getElementById(barId);
  if (!bar) return;
  bar.style.display = 'flex';
  var ALL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
  var present = new Set(presentLetters);
  bar.innerHTML = ALL.map(function(L) {
    var has = present.has(L);
    return '<button class="alpha-btn' + (has ? '' : ' empty') + '"' +
      (has ? ' onclick="jumpToLetter(\'' + L + '\', \'' + prefix + '\')"' : ' disabled') +
      '>' + L + '</button>';
  }).join('');
}

function jumpToLetter(L, prefix) {
  prefix = prefix || 'letter-';
  var el = document.getElementById(prefix + L);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function buildLoansTable(loans, client, userEmail, readOnly) {
  if (!loans || !loans.length) return '<div style="padding:20px;text-align:center;font-size:13px;color:var(--muted)">No loans yet.</div>';

  var html = '<table class="loans-table"><thead><tr>' +
    '<th>Address</th><th>Tool</th><th>Status</th><th>Amount</th><th>Rate</th><th>Saved</th><th></th>' +
    '</tr></thead><tbody>';

  loans.forEach(function(l) {
    var fd = l.formData || {};
    var isDscr = (l.toolType||'') !== 'rtl';
    var rawAmt = l.loanAmt || fd.loanAmt || l.purchasePrice || fd.purchasePrice;
    var amt  = rawAmt ? '$'+Number(rawAmt).toLocaleString() : '—';
    var rate = (l.rate || fd._finalRate) ? (l.rate||fd._finalRate)+'%' : '—';
    var date = (l.savedAt||l.updatedAt) ? new Date(l.savedAt||l.updatedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    var status = l.status || 'active';
    var STATUS_LABELS = { active:'Active', on_hold:'On Hold', submitted:'Submitted', approved:'Approved', denied:'Denied' };
    var statusLabel = STATUS_LABELS[status] || status;
    var statusStyle = status==='approved' ? 'color:var(--success);font-weight:600' :
                      status==='denied'   ? 'color:var(--danger);font-weight:600'  :
                      status==='submitted'? 'color:var(--dark);font-weight:600'    : 'color:var(--muted)';
    var detailsUrl = l.id ? 'loan-details.html?clientId='+encodeURIComponent(client.id)+'&loanId='+encodeURIComponent(l.id) + (userEmail ? '&owner='+encodeURIComponent(userEmail) : '') : '';
    var addrCell = (detailsUrl
      ? '<a href="'+detailsUrl+'" class="loan-addr-link" onclick="event.stopPropagation()">'+escH(l.address||'—')+'</a>'
      : escH(l.address||'—'));

    html += '<tr>' +
      '<td class="td-mono" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+addrCell+'</td>' +
      '<td><span class="badge '+(l.toolType||'dscr')+'">'+((l.toolType||'dscr').toUpperCase())+'</span></td>' +
      '<td style="font-size:12px;'+statusStyle+'">'+escH(statusLabel)+'</td>' +
      '<td class="td-mono">'+escH(amt)+'</td>' +
      '<td class="td-mono">'+escH(rate)+'</td>' +
      '<td class="td-mono">'+date+'</td>' +
      '<td onclick="event.stopPropagation()" style="white-space:nowrap">' +
        (!readOnly && l.id ? '<button class="del-loan-btn" onclick="event.stopPropagation();deleteLoan(\''+escAttr(client.id)+'\',\''+escAttr(l.id)+'\',\''+escAttr(userEmail||'')+'\')">✕</button>' : '') +
      '</td>' +
      '</tr>';
  });

  html += '</tbody></table>';
  return html;
}

// ── Deploy 236.230 — Select Multiple + bulk merge / delete ──────
// Mirrors the loans.html Select Multiple UX (Deploy 236.29).
// Selection is keyed by "<owner>|<clientId>" so re-renders (search,
// filter, letter-jump) preserve state, and it works cleanly in both
// personal-view and admin cross-LO view.
var _selectMode = false;
var _selected = {};
function _selectedCount() { var n = 0; for (var k in _selected) if (_selected[k]) n++; return n; }

function toggleSelectMode() {
  _selectMode = !_selectMode;
  // Deploy 236.231 — both personal + admin toolbars now have their
  // own Select Multiple button. Keep both in sync.
  ['selectModeBtn', 'selectModeBtnAdmin'].forEach(function(btnId) {
    var btn = document.getElementById(btnId);
    if (!btn) return;
    btn.textContent = _selectMode ? 'Done' : 'Select Multiple';
    btn.style.background = _selectMode ? 'var(--dark)' : '';
    btn.style.color      = _selectMode ? '#fff'        : '';
    btn.style.borderColor = _selectMode ? 'var(--dark)' : '';
  });
  if (!_selectMode) _selected = {};
  refreshSelectionBar();
  // Re-render both views so checkbox visibility updates in place.
  renderClients();
  if (_isStaff && _view === 'admin' && typeof renderAdminClients === 'function') renderAdminClients();
}

function toggleRowSelect(cb) {
  var k = cb.getAttribute('data-selkey');
  if (!k) return;
  if (cb.checked) _selected[k] = true;
  else delete _selected[k];
  refreshSelectionBar();
}

function clearSelections() {
  _selected = {};
  document.querySelectorAll('.client-select-cell input[type="checkbox"]').forEach(function(cb) { cb.checked = false; });
  refreshSelectionBar();
}

function refreshSelectionBar() {
  var n = _selectedCount();
  var visible = _selectMode && n > 0;
  // Deploy 236.231 — mirror the state across personal + admin bars.
  ['', 'Admin'].forEach(function(suffix) {
    var bar = document.getElementById('selectActionBar' + suffix);
    var lbl = document.getElementById('selectCount'     + suffix);
    var mergeBtn = document.getElementById('mergeSelectedBtn' + suffix);
    var delBtn   = document.getElementById('deleteSelectedBtn' + suffix);
    if (bar) bar.style.display = visible ? 'flex' : 'none';
    if (!visible) return;
    if (lbl) lbl.textContent = n + ' selected';
    if (mergeBtn) {
      mergeBtn.disabled = n !== 2;
      mergeBtn.style.opacity = n === 2 ? '1' : '0.4';
      mergeBtn.style.cursor  = n === 2 ? 'pointer' : 'not-allowed';
      mergeBtn.title = n === 2 ? 'Merge these 2 clients' : 'Select exactly 2 clients to merge';
    }
    if (delBtn) {
      delBtn.disabled = n < 1;
      delBtn.style.opacity = n >= 1 ? '1' : '0.4';
    }
  });
}

function _selectedClientIds() {
  var out = [];
  Object.keys(_selected).forEach(function(k) {
    if (!_selected[k]) return;
    var parts = k.split('|');
    out.push({ owner: parts[0] || '', clientId: parts[1] || '' });
  });
  return out;
}
// Deploy 236.238 — reload both the personal and admin lists after a
// bulk delete or merge. Earlier code called loadAll() which never
// existed in this file — the mutation succeeded server-side but the
// success callback threw "loadAll is not defined" and the user saw
// "Merge failed" even though the merge had actually landed. Uses
// the same primitives the initial page-load flow uses so both views
// stay consistent.
function _reloadAfterMutation() {
  try { refreshClientsFromBackend().then(function() { renderClients(); }); } catch (_) {}
  if (_isStaff && typeof loadAdminClients === 'function') {
    try { loadAdminClients(true); } catch (_) {}
  }
}

function _findClientById(id, ownerHint) {
  // Personal-view list first (fast path).
  for (var i = 0; i < _clients.length; i++) {
    if (_clients[i] && _clients[i].id === id) return _clients[i];
  }
  // Deploy 236.236 — also walk _adminData when admin is on All Users
  // view. Without this, Merge Selected on cross-LO clients threw
  // "Could not locate one of the selected clients in the loaded list."
  // ownerHint is the owner email that _selectedClientIds recorded when
  // the row was checked; we prefer it to speed up the search when the
  // selection came from a specific LO's bucket.
  if (Array.isArray(_adminData)) {
    if (ownerHint) {
      for (var oi = 0; oi < _adminData.length; oi++) {
        if (_adminData[oi] && _adminData[oi].email === ownerHint) {
          var oc = _adminData[oi].clients || [];
          for (var ci = 0; ci < oc.length; ci++) {
            if (oc[ci] && oc[ci].id === id) return oc[ci];
          }
        }
      }
    }
    // Fall back to a full sweep (no ownerHint or hint miss).
    for (var ui = 0; ui < _adminData.length; ui++) {
      var uc = (_adminData[ui] && _adminData[ui].clients) || [];
      for (var uj = 0; uj < uc.length; uj++) {
        if (uc[uj] && uc[uj].id === id) return uc[uj];
      }
    }
  }
  return null;
}

function confirmDeleteSelected() {
  var sel = _selectedClientIds();
  if (!sel.length) return;
  // Deploy 236.234 — spell out exactly what dies. The 236.230 delete
  // path takes out the WHOLE CLIENT (every loan on it), and the LO's
  // "select two dupe LOANS to delete" mental model can wipe an
  // innocent 3rd loan attached to the same client. Show the exact
  // loan tally + list of loan addresses so the impact is unambiguous.
  var loanTally = 0;
  var loanLines = [];
  sel.forEach(function(s) {
    var c = _findClientById(s.clientId);
    if (!c) return;
    var name = ((c.firstName || '') + ' ' + (c.lastName || '')).trim() || c.email || '(unnamed)';
    var loans = Array.isArray(c.loans) ? c.loans : [];
    loanTally += loans.length;
    loans.forEach(function(l) {
      loanLines.push('   · ' + (l.address || '(no address)') + '  [' + (l.status || '?') + ']');
    });
    loanLines.push(' — ' + name + '  (' + loans.length + ' loan' + (loans.length === 1 ? '' : 's') + ')');
  });
  var msg = 'DELETE ' + sel.length + ' client' + (sel.length === 1 ? '' : 's') +
    ' AND ' + loanTally + ' loan' + (loanTally === 1 ? '' : 's') + '.\n\n' +
    'This deletes the entire client record — every loan attached to each ' +
    'selected client is destroyed along with them, plus their long-app + ' +
    'signed application records. Saved sizer quotes for these loans are ' +
    'also swept.\n\n' +
    'Loans that will be deleted:\n' + loanLines.join('\n') + '\n\n' +
    'This CANNOT be undone. Continue?';
  if (!confirm(msg)) return;
  var btn = document.getElementById('deleteSelectedBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Deleting…'; }
  // Group by owner in case admin selected across LOs.
  var byOwner = {};
  sel.forEach(function(s) {
    var o = s.owner || _user.email;
    (byOwner[o] = byOwner[o] || []).push(s.clientId);
  });
  var owners = Object.keys(byOwner);
  var chain = Promise.resolve();
  var results = [];
  owners.forEach(function(o) {
    chain = chain.then(function() {
      var body = { clientIds: byOwner[o] };
      if (o && o !== _user.email) body.owner = o;
      return SLA.api('POST', '/api/clients-bulk-delete', body).then(function(r) {
        if (r && Array.isArray(r.deleted)) results = results.concat(r.deleted);
      }).catch(function(err) {
        byOwner[o].forEach(function(id) { results.push({ clientId: id, ok: false, error: (err && err.message) || 'unknown' }); });
      });
    });
  });
  chain.then(function() {
    var okCount = results.filter(function(x) { return x.ok; }).length;
    var errCount = results.length - okCount;
    if (btn) { btn.disabled = false; btn.textContent = 'Delete Selected'; }
    _selected = {};
    _selectMode = false;
    var b = document.getElementById('selectModeBtn');
    if (b) { b.textContent = 'Select Multiple'; b.style.background = ''; b.style.color = ''; b.style.borderColor = ''; }
    refreshSelectionBar();
    showToast('Deleted ' + okCount + (errCount ? ' (' + errCount + ' failed)' : ''));
    _reloadAfterMutation();
  });
}

  document.body.appendChild(m);

function closeMergeClientsModal() {
  var m = document.getElementById('mergeClientsModal'); if (m) m.remove();

}
function pickMergeWinner(i) {
  var clients = window._mergeClientsSelection || [];
  if (clients.length !== 2) return;
  _mergeWinnerKey = clients[i].clientId;
  for (var j = 0; j < 2; j++) {
    var card = document.getElementById('mergeCard_' + j);
    var badge = document.getElementById('mergeWinnerBadge_' + j);
    if (!card) continue;
    if (j === i) {
      card.style.borderColor = '#166534';
      card.style.background  = 'rgba(21,128,61,0.06)';

    } else {

      card.style.background  = '#fff';

  document.getElementById('mergeClientsCommitBtn').disabled = false;
}
function commitClientMerge() {
  var clients = window._mergeClientsSelection || [];
  if (clients.length !== 2 || !_mergeWinnerKey) return;
  var winner = clients[0].clientId === _mergeWinnerKey ? clients[0] : clients[1];
  var loser  = clients[0].clientId === _mergeWinnerKey ? clients[1] : clients[0];
  if (winner.owner !== loser.owner) {
    alert('Cross-owner merges aren\'t supported yet. Reassign one client first, then merge.');
    return;
  }
  if (!confirm('Merge these two? Loser ' + loser.clientId + ' will be deleted and its data folded into ' + winner.clientId + '. This cannot be undone.')) return;
  var btn = document.getElementById('mergeClientsCommitBtn');
  btn.disabled = true; btn.textContent = 'Merging…';
  var body = { winnerClientId: winner.clientId, loserClientId: loser.clientId };
  if (winner.owner && winner.owner !== _user.email) body.owner = winner.owner;
  SLA.api('POST', '/api/clients-merge-manual', body).then(function(r) {
    if (!r || !r.ok) throw new Error((r && r.error) || 'unknown');
    closeMergeClientsModal();
    _selected = {};
    _selectMode = false;
    var b = document.getElementById('selectModeBtn');
    if (b) { b.textContent = 'Select Multiple'; b.style.background = ''; b.style.color = ''; b.style.borderColor = ''; }
    refreshSelectionBar();
    showToast('Merged — ' + r.loansAdded + ' loan(s) + ' + r.companiesAdded + ' compan(ies) moved.');
    _reloadAfterMutation();
  }).catch(function(err) {
    btn.disabled = false; btn.textContent = 'Merge';
    alert('Merge failed: ' + (err && err.message || 'unknown'));
  });
}

function deleteClient(id, userEmail) {
  if (!confirm('Delete this client and all their loans? This cannot be undone.')) return;
  var loEmail = userEmail || _user.email;
  // Find client before removing so we can clean up QuoteStore
  var clientToDelete = _clients.find(function(c){ return c.id===id; });

  var opts = {};
  if (userEmail && userEmail !== _user.email) opts._owner = userEmail;

  SLA.Clients.delete(id, opts).then(function() {
    _clients = _clients.filter(function(c){ return c.id!==id; });
    // Remove all their loans from QuoteStore too
    if (clientToDelete && window.QuoteStore) {
      (clientToDelete.loans||[]).forEach(function(l) {
        if (l.address && l.toolType) QuoteStore.deleteQuote(loEmail, l.toolType, l.address);
      });
    }
    renderSummary();
    renderClients();
    showToast('Client deleted');
  }).catch(function(err) {
    showToast('Delete failed: ' + (err.message || 'unknown error'));
  });
}

function deleteLoan(clientId, loanId, userEmail) {
  if (!confirm('Delete this loan? The client will remain in the book.')) return;
  var loEmail = userEmail || _user.email;
  var c = _clients.find(function(c){ return c.id===clientId; });
  var loanToDelete = null;
  if (c && c.loans) {
    loanToDelete = c.loans.find(function(l){ return l.id===loanId || (l.address||l.id||'')===loanId; });
  }

  var opts = { loanId: loanId };
  if (userEmail && userEmail !== _user.email) opts._owner = userEmail;

  SLA.Clients.delete(clientId, opts).then(function(r) {
    if (c && r && r.client) {
      // Backend returns the updated client record
      var i = _clients.indexOf(c);
      if (i >= 0) _clients[i] = r.client;
    }
    // Also remove from QuoteStore
    if (loanToDelete && loanToDelete.address && window.QuoteStore) {
      var toolType = loanToDelete.toolType || 'dscr';
      QuoteStore.deleteQuote(loEmail, toolType, loanToDelete.address);
    }
    renderSummary();
    renderClients();
  }).catch(function(err) {
    showToast('Delete failed: ' + (err.message || 'unknown error'));
  });
}

// ── Admin view ──────────────────────────────────────────────────
function loadAdminClients(forceRefresh) {
  if (!forceRefresh && _adminData) { renderAdminClients(); return; }
  var wrap = document.getElementById('adminClientsList');
  wrap.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--muted);font-size:13px">Loading…</div>';
  if (!_user) return;
  // Deploy 236.26 — fetch user-stats alongside the client roster so we
  // can drop deleted LOs from the filter dropdown. Stats failure is
  // silent (we just don't filter); client-list failure shows the
  // empty-state error like before.
  var statsP = SLA.Admin
    ? SLA.Admin.userStats().catch(function() { return { users: [] }; })
    : Promise.resolve({ users: [] });
  Promise.all([SLA.Clients.list({ all: true }), statsP]).then(function(results) {
    var resp = results[0];
    var statsResp = results[1] || { users: [] };
    _deletedOwners = {};
    (statsResp.users || []).forEach(function(u) {
      if (u && u.deleted && u.email) _deletedOwners[_keySafe(u.email)] = true;
    });
    var byOwner = (resp && resp.byOwner) || {};
    _adminData = Object.keys(byOwner).map(function(owner) {
      return {
        id: owner,          // storage-key "id" (email-based)
        email: owner,
        clients: byOwner[owner] || [],
        confirmed: true,
      };
    }).sort(function(a,b){ return a.email.localeCompare(b.email); });
    renderAdminClients();
  }).catch(function(err) {
    wrap.innerHTML = '<div class="empty-state"><h3>Failed to load</h3><p>'+escH(err.message || 'unknown error')+'</p></div>';
  });
}

function renderAdminClients() {
  if (!_adminData) return;
  var search = (document.getElementById('adminSearch').value||'').toLowerCase().trim();
  var loFilterEl = document.getElementById('adminLoFilter');
  var loFilter = (loFilterEl && loFilterEl.value || '').toLowerCase();
  if (loFilterEl) loFilterEl.classList.toggle('has-value', !!loFilter);
  var wrap = document.getElementById('adminClientsList');
  wrap.innerHTML = '';
  var alphaJump = document.getElementById('adminAlphaJump');

  // Populate LO filter dropdown lazily — every render rebuilds it from
  // _adminData so it always reflects the freshest set of LOs we know about.
  // Kept stable (alphabetical) so the order doesn't jitter as data refreshes.
  // Deploy 236.26 — deleted LOs (no longer in Netlify Identity) are
  // dropped from the dropdown so admins can't filter to a ghost account.
  // Their clients still appear in the unfiltered list.
  if (loFilterEl) {
    var currentVal = loFilterEl.value;
    var sortedLos = _adminData.slice().filter(function(u) {
      return !_deletedOwners[_keySafe(u.email)];
    }).sort(function(a, b) {
      return humanizeEmail(a.email).localeCompare(humanizeEmail(b.email));
    });
    var html = '<option value="">All LOs</option>';
    sortedLos.forEach(function(u) {
      var sel = (u.email.toLowerCase() === currentVal.toLowerCase()) ? ' selected' : '';
      html += '<option value="'+escAttr(u.email)+'"'+sel+'>'+escH(humanizeEmail(u.email))+'</option>';
    });
    loFilterEl.innerHTML = html;
  }

  // Flatten every (owner, client) pair into a single list, then sort
  // alphabetically by last name (matching the My Clients view's behavior).
  var flat = [];
  _adminData.forEach(function(userData) {
    // Deploy 236.37 — drop clients whose owning LO has been removed
    // from Netlify Identity. _deletedOwners is populated by
    // loadAdminClients() from users-stats. Empty set falls back to
    // showing every owner (never hide everyone on a transient failure).
    if (_deletedOwners[_keySafe(userData.email)]) return;
    (userData.clients || []).forEach(function(c) {
      // Owner-filter applies before search so the search count is accurate
      if (loFilter && userData.email.toLowerCase() !== loFilter) return;
      // Search across name, email, phone, and the owning LO's email so admins
      // can quickly find "everything Bob owns" by typing his email
      if (search) {
        var hay = ((c.firstName||'')+' '+(c.lastName||'')+' '+(c.email||'')+' '+(c.phone||'')+' '+userData.email).toLowerCase();
        if (hay.indexOf(search) < 0) return;
      }
      flat.push({ owner: userData.email, client: c });
    });
  });

  flat.sort(function(a, b) {
    var aFirst = (a.client.firstName||'').toLowerCase();
    var bFirst = (b.client.firstName||'').toLowerCase();
    if (aFirst !== bFirst) return aFirst.localeCompare(bFirst);
    return (a.client.lastName||'').toLowerCase().localeCompare((b.client.lastName||'').toLowerCase());
  });

  // Summary bar: total clients + total loans across the *filtered* set.
  // Updates reactively whenever the search box or LO filter changes since
  // both call renderAdminClients(). Mirrors the My Clients summary pattern.
  var summaryEl = document.getElementById('adminSummaryBar');
  if (summaryEl) {
    var totalClients = flat.length;
    var totalLoans = flat.reduce(function(s, e) { return s + ((e.client.loans||[]).length); }, 0);
    var loCount = loFilter ? 1 : _adminData.filter(function(u){
      return (u.clients || []).some(function(c) {
        if (!search) return true;
        var hay = ((c.firstName||'')+' '+(c.lastName||'')+' '+(c.email||'')+' '+(c.phone||'')+' '+u.email).toLowerCase();
        return hay.indexOf(search) >= 0;
      });
    }).length;
    summaryEl.innerHTML =
      '<div class="summary-pill"><strong>'+totalClients+'</strong> clients</div>' +
      '<div class="summary-pill"><strong>'+totalLoans+'</strong> total loans</div>' +
      '<div class="summary-pill"><strong>'+loCount+'</strong> '+(loCount===1?'LO':'LOs')+'</div>';
  }

  if (!flat.length) {
    if (alphaJump) alphaJump.style.display = 'none';
    if (summaryEl) summaryEl.innerHTML = '';
    wrap.innerHTML = '<div class="empty-state"><h3>No clients</h3><p>'+
      (search || loFilter
        ? 'No clients match your search/filter. Try clearing them.'
        : 'No client data has been synced yet.')+
      '</p></div>';
    return;
  }

  // Group flat list by first letter of last name (matches My Clients behavior).
  // Use a different DOM-id prefix from My Clients ("aletter-" vs "letter-")
  // so the two views never collide on a hidden duplicate ID.
  var groups = {};
  flat.forEach(function(entry) {
    var c = entry.client;
    var letter = ((c.firstName || c.lastName || '#').charAt(0) || '#').toUpperCase();
    if (!/[A-Z]/.test(letter)) letter = '#';
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(entry);
  });
  var letters = Object.keys(groups).sort(function(a, b) {
    if (a === '#') return 1;
    if (b === '#') return -1;
    return a.localeCompare(b);
  });

  // Render the alphabet jump bar
  renderAlphaJump(letters, { barId: 'adminAlphaJump', prefix: 'aletter-' });

  // Render each letter group
  letters.forEach(function(L) {
    var hdr = document.createElement('div');
    hdr.className = 'letter-divider';
    hdr.id = 'aletter-' + L;
    hdr.innerHTML = '<span class="letter-divider-letter">' + L + '</span>' +
      '<span class="letter-divider-count">' + groups[L].length + ' client' + (groups[L].length === 1 ? '' : 's') + '</span>';
    wrap.appendChild(hdr);
    groups[L].forEach(function(entry) {
      var card = buildClientCard(entry.client, entry.owner, true);
      // Inject a "Belongs to" badge into the card's meta row so admins can see
      // ownership at a glance without opening the client.
      var meta = card.querySelector('.client-meta');
      if (meta) {
        var loBadge = document.createElement('div');
        loBadge.className = 'lo-tag-row';
        loBadge.innerHTML = '<span class="lo-tag-badge" title="Loan officer">'+escH(humanizeEmail(entry.owner))+'</span>';
        meta.parentNode.insertBefore(loBadge, meta.nextSibling);
      }
      wrap.appendChild(card);
    });
  });
}

function buildAdminClientList(clientList) {

  html += '<th style="padding:9px 20px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf8f5;border-bottom:1px solid var(--border)">Email</th>';
  html += '<th style="padding:9px 20px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf8f5;border-bottom:1px solid var(--border)">Phone</th>';
  html += '<th style="padding:9px 20px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#faf8f5;border-bottom:1px solid var(--border)">Loans</th>';

  html += '</tr></thead><tbody>';
  sorted.forEach(function(c, i) {
    var isLast = i === sorted.length - 1;
    var date = c.addedAt ? new Date(c.addedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    html += '<tr style="border-bottom:'+(isLast?'none':'1px solid #f0ece6')+'">';
    html += '<td style="padding:11px 20px;font-weight:500">'+escH((c.firstName||'')+' '+(c.lastName||''))+'</td>';
    html += '<td style="padding:11px 20px;font-family:DM Mono,monospace;font-size:12px">'+escH(c.email||'—')+'</td>';
    html += '<td style="padding:11px 20px;font-family:DM Mono,monospace;font-size:12px">'+escH(c.phone ? fmtPhoneDisplay(c.phone) : '—')+'</td>';
    html += '<td style="padding:11px 20px"><span style="background:var(--gold-light);color:var(--gold-mid);border:1px solid var(--gold-border);font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">'+(c.loanCount||0)+' loan'+((c.loanCount||0)!==1?'s':'')+'</span></td>';
    html += '<td style="padding:11px 20px;font-size:12px;color:var(--muted);font-family:DM Mono,monospace">'+date+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Display phone with dashes/parens; use SLAForms helper if available
function fmtPhoneDisplay(s) {
  if (window.SLAForms && SLAForms.formatPhone) return SLAForms.formatPhone(s);
  var d = String(s||'').replace(/\D/g,'');
  if (d.length !== 10) return s;
  return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6);
}
function humanizeEmail(email) {
  if (!email) return '';
  var s = String(email);
  var at = s.indexOf('@');
  var local = at >= 0 ? s.slice(0, at) : s;
  var parts = local.split(/[._\-]+/).filter(Boolean);
  if (!parts.length) return s;
  return parts.map(function(p){ return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase(); }).join(' ') || s;
}
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ── Add Contact modal ─────────────────────────────────────
function openAddContact() {
  ['ac-firstName','ac-lastName','ac-email','ac-phone'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  var s = document.getElementById('ac-status');
  s.textContent = ''; s.className = 'modal-status';
  // Deploy 198 (fix): reset the save button. It gets disabled during
  // the save (line ~988) and is only reset on failure in the .catch
  // path — so after a SUCCESSFUL add, the button stays disabled with
  // text "Saving…" and the modal just closes. The next time the user
  // opens this modal, clicking Save does nothing because the button is
  // still disabled. User reported as "every 2nd add doesn't save."
  // Resetting here makes every fresh open start clean regardless of
  // how the previous open ended.
  var resetBtn = document.getElementById('ac-saveBtn');
  if (resetBtn) { resetBtn.disabled = false; resetBtn.textContent = 'Save Contact'; }
  document.getElementById('addContactModal').classList.add('show');
  setTimeout(function(){ document.getElementById('ac-firstName').focus(); }, 50);
}
function closeAddContact() {
  document.getElementById('addContactModal').classList.remove('show');
}
function saveAddContact() {
  var firstName = document.getElementById('ac-firstName').value.trim();
  var lastName  = document.getElementById('ac-lastName').value.trim();
  var email     = document.getElementById('ac-email').value.trim().toLowerCase();
  var phone     = document.getElementById('ac-phone').value.trim();
  var status    = document.getElementById('ac-status');

  if (!firstName) { status.className = 'modal-status err'; status.textContent = 'First name is required.'; return; }
  if (!lastName)  { status.className = 'modal-status err'; status.textContent = 'Last name is required.'; return; }
  if (!email || !email.includes('@')) {
    status.className = 'modal-status err';
    status.textContent = 'A valid email is required so future loans link to this contact.';
    return;
  }

  // Check for existing client with this email — if found, just toast and close
  var existing = _clients.find(function(c){ return (c.email||'').toLowerCase() === email; });
  if (existing) {
    status.className = 'modal-status err';
    status.textContent = 'A contact with that email already exists: ' + (existing.firstName||'') + ' ' + (existing.lastName||'');
    return;
  }

  var btn = document.getElementById('ac-saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  var record = {
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    email: email,
    firstName: firstName,
    lastName: lastName,
    phone: phone,
    createdAt: new Date().toISOString(),
    createdBy: _user.email || '',
    loans: [],
    addedManually: true,
  };
  SLA.Clients.save(record).then(function() {
    _clients.unshift(record);
    closeAddContact();
    showToast('Contact added — ' + firstName + ' ' + lastName);
    renderSummary();
    renderClients();
  }).catch(function(err) {
    btn.disabled = false; btn.textContent = 'Save Contact';
    status.className = 'modal-status err';
    status.textContent = 'Save failed: ' + (err.message || 'unknown error');
  });
}
// Close modal on backdrop click
document.addEventListener('DOMContentLoaded', function() {
  var bg = document.getElementById('addContactModal');
  if (bg) bg.addEventListener('click', function(e){ if (e.target === bg) closeAddContact(); });
});

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},3000);
}
</script>
