<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-Borrower Authorization · SLA Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C8813A;--gold-mid:#b5712d;--gold-light:rgba(200,129,58,0.10);
  --gold-border:rgba(200,129,58,0.28);--dark:#261a36;--bg:#f0ece5;
  --surface:#ffffff;--text:#1a1520;--muted:#7a7488;--border:#E4DFD4;
  --success:#256940;--danger:#7c1f1f;
  --r:12px;--r-sm:8px;--r-xs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 1rem 5rem}
.nav{max-width:760px;margin:0 auto;padding:1.5rem 0 0;display:flex;align-items:center;gap:12px}
.nav img{height:44px}
.nav-tagline{font-size:12px;color:var(--muted)}
.page{max-width:760px;margin:0 auto;padding-top:2rem}
.page-header h1{font-family:'Lora',serif;font-size:24px;font-weight:600;margin-bottom:8px}
.page-header p{font-size:13.5px;color:var(--muted);line-height:1.6;max-width:560px}
.summary-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:18px 22px;margin:22px 0;font-size:13.5px;line-height:1.7}
.summary-card .row{display:flex;gap:12px;padding:3px 0}
.summary-card .row .lbl{color:var(--muted);flex:0 0 130px}
.summary-card .row .val{font-weight:600}
.auth-section-title{font-family:'Lora',serif;font-size:18px;font-weight:600;color:var(--dark);margin:28px 0 8px}
.consent-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:18px 22px;max-height:300px;overflow-y:auto;font-size:12.5px;line-height:1.6;white-space:pre-wrap;font-family:Georgia,serif;color:var(--text);margin-bottom:16px}
.consent-row{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;background:var(--gold-light);border:1px solid var(--gold-border);border-radius:6px;margin-bottom:20px}
.consent-row input[type="checkbox"]{margin-top:3px;flex-shrink:0;width:18px;height:18px;cursor:pointer}
.consent-row label{font-size:13px;line-height:1.5;cursor:pointer}
.sig-block{background:#fff;border:2px solid var(--gold);border-radius:8px;padding:20px 22px;margin-bottom:18px}
.sig-block label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--gold);display:block;margin-bottom:8px}
.sig-block input{font-family:"Brush Script MT","Lucida Handwriting",cursive;font-size:28px;padding:8px 12px;border:0;border-bottom:1.5px solid #888;width:100%;background:transparent}
.sig-block input:focus{outline:none;border-bottom-color:var(--gold)}
.sig-block .sig-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}
.sign-btn{background:var(--gold);color:#fff;border:0;padding:14px 28px;font-size:15px;font-weight:600;border-radius:8px;cursor:pointer;width:100%;transition:background 0.15s}
.sign-btn:hover:not(:disabled){background:var(--gold-mid)}
.sign-btn:disabled{opacity:0.5;cursor:not-allowed}
.err{color:var(--danger);font-size:13px;margin-top:14px;text-align:center;display:none}
.status-banner{padding:16px 20px;border-radius:8px;font-size:13.5px;line-height:1.55;margin:24px 0}
.status-banner.error{background:#fdebec;border:1px solid #f3c1c4;color:var(--danger)}
.status-banner.success{background:#e6f4ec;border:1px solid #b9dcc7;color:var(--success)}
.loading{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}
/* Deploy 236.642 — co-signer "Your Information" verify/complete form */
.info-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:20px 22px;margin:22px 0}
.info-card h2{font-family:'Lora',serif;font-size:17px;font-weight:600;color:var(--dark);margin-bottom:4px}
.info-card .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fgrid .full{grid-column:1 / -1}
.fld label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--muted);margin-bottom:5px}
.fld input,.fld select{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:#fff}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--gold)}
.fld .fldhint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-opt{flex:1;min-width:76px}
.radio-opt input{display:none}
.radio-opt label{display:block;text-align:center;padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;text-transform:none;letter-spacing:0;margin:0}
.radio-opt input:checked + label{border-color:var(--gold);background:var(--gold-light);color:var(--gold-mid);font-weight:600}
.decl-q{padding:11px 0;border-bottom:1px solid var(--border)}
.decl-q:last-child{border-bottom:0}
.decl-q .q{font-size:13px;line-height:1.45;margin-bottom:7px}
.ssn-onfile{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--text);padding:9px 11px;border:1.5px solid var(--border);border-radius:6px;background:var(--bg)}
.ssn-onfile button{background:none;border:0;color:var(--gold-mid);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0}
@media (max-width:600px){
  .page{padding-top:1rem}
  .page-header h1{font-size:20px}
  .fgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="nav">
  <img src="SLA_Capital_Logo_2_1.png" alt="SLA Capital">
  <div class="nav-tagline">Co-Borrower Authorization</div>
</div>
<div class="page" id="root">
  <div class="loading">Loading authorization\u2026</div>
</div>

<script src="sla-api.js"></script>
<script>
var qs = new URLSearchParams(window.location.search);
var TOKEN = qs.get('t') || '';
var CONSENT = null;
var INFO = null;

function escH(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escA(s){return escH(s).replace(/"/g,'&quot;');}

// ── Deploy 236.642 — "Your Information" verify/complete form helpers ──
function pf(k){ return (INFO && INFO.prefill && INFO.prefill[k] != null) ? INFO.prefill[k] : ''; }
function fldText(id, label, type, opts){
  opts = opts || {};
  var key = opts.key || id.replace(/^gi_/, '');
  return '<div class="fld' + (opts.full ? ' full' : '') + '"><label>' + escH(label) + '</label>' +
    '<input id="' + id + '" type="' + (type || 'text') + '" value="' + escA(pf(key)) + '"' +
    (opts.ph ? ' placeholder="' + escA(opts.ph) + '"' : '') + (opts.attr || '') + ' autocomplete="off" />' +
    (opts.hint ? '<div class="fldhint">' + escH(opts.hint) + '</div>' : '') + '</div>';
}
function fldRadio(id, label, options, opts){
  opts = opts || {};
  var cur = pf(opts.key || id.replace(/^gi_/, ''));
  var r = '<div class="fld' + (opts.full ? ' full' : '') + '"><label>' + escH(label) + '</label><div class="radio-row">';
  options.forEach(function(o, i){
    r += '<div class="radio-opt"><input type="radio" id="' + id + '_' + i + '" name="' + id + '" value="' + escA(o.v) + '"' +
      (cur === o.v ? ' checked' : '') + (opts.onchange ? ' onchange="' + opts.onchange + '"' : '') + '/>' +
      '<label for="' + id + '_' + i + '">' + escH(o.l) + '</label></div>';
  });
  return r + '</div></div>';
}
function ssnField(){
  var hasSSN = !!(INFO.prefill && INFO.prefill.hasSSN);
  var last4 = (INFO.prefill && INFO.prefill.ssnLast4) || '';
  if (hasSSN) {
    return '<div class="fld"><label>Social Security Number</label>' +
      '<div class="ssn-onfile" id="ssnOnFile"><span>On file' + (last4 ? (' (ending ' + escH(last4) + ')') : '') + '</span>' +
      '<button type="button" onclick="showSsnInput()">Update</button></div>' +
      '<input id="gi_ssn" type="text" inputmode="numeric" placeholder="XXX-XX-XXXX" style="display:none;margin-top:8px" oninput="maskSsn(this)" maxlength="11" autocomplete="off" />' +
      '</div>';
  }
  return '<div class="fld"><label>Social Security Number</label>' +
    '<input id="gi_ssn" type="text" inputmode="numeric" placeholder="XXX-XX-XXXX" oninput="maskSsn(this)" maxlength="11" autocomplete="off" />' +
    '<div class="fldhint">Securely encrypted at rest. Used only for the loan application document.</div></div>';
}
function showSsnInput(){ var o = document.getElementById('ssnOnFile'), i = document.getElementById('gi_ssn'); if (o) o.style.display = 'none'; if (i) { i.style.display = 'block'; i.focus(); } }
function maskSsn(el){ var v = el.value.replace(/\D/g, '').slice(0, 9); var out = v; if (v.length > 5) out = v.slice(0, 3) + '-' + v.slice(3, 5) + '-' + v.slice(5); else if (v.length > 3) out = v.slice(0, 3) + '-' + v.slice(3); el.value = out; }
function togglePrevAddr(){ var wrap = document.getElementById('prevAddrWrap'); if (!wrap) return; var sel = document.querySelector('input[name="gi_twoYearAddress"]:checked'); wrap.style.display = (sel && sel.value === 'no') ? 'block' : 'none'; }

function buildInfoForm(){
  var lt = (INFO && INFO.loanType) || '';
  var h = '<div class="info-card">' +
    '<h2>Your Information</h2>' +
    '<div class="sub">Please review and complete your information below — it becomes part of the loan application you are signing. Anything already on file is pre-filled; just confirm it is accurate.</div>' +
    '<div class="fgrid">' +
      fldText('gi_firstName', 'First Name') +
      fldText('gi_lastName', 'Last Name') +
      fldText('gi_email', 'Email', 'email') +
      fldText('gi_phone', 'Phone', 'tel', { ph: '(XXX) XXX-XXXX' }) +
      fldText('gi_dob', 'Date of Birth', 'date') +
      fldText('gi_fico', 'Estimated Credit Score', 'text', { ph: 'e.g. 740' }) +
      ssnField() +
    '</div>' +
    '<div class="fgrid" style="margin-top:14px">' +
      fldText('gi_address', 'Home Street Address', 'text', { full: true, ph: '123 Main St' }) +
      fldText('gi_city', 'City') + fldText('gi_state', 'State') + fldText('gi_zip', 'ZIP') +
    '</div>' +
    '<div style="margin-top:14px">' + fldRadio('gi_twoYearAddress', 'Have you lived at this address for 2 or more years?', [{ v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }], { onchange: 'togglePrevAddr()', full: true }) + '</div>' +
    '<div id="prevAddrWrap" style="display:none;margin-top:12px"><div class="fgrid">' +
      fldText('gi_prevAddress', 'Previous Street Address', 'text', { full: true }) +
      fldText('gi_prevCity', 'City') + fldText('gi_prevState', 'State') + fldText('gi_prevZip', 'ZIP') +
    '</div></div>' +
    '<div class="fgrid" style="margin-top:14px">' +
      fldRadio('gi_marital', 'Marital Status', [{ v: 'married', l: 'Married' }, { v: 'single', l: 'Not Married' }]) +
      fldRadio('gi_usCitizen', 'U.S. Citizen?', [{ v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }]) +
    '</div>';
  if (lt === 'fix_flip' || lt === 'construction') h += '<div class="fgrid" style="margin-top:14px">' + fldText('gi_flips', '# of flips completed in last 36 months', 'number') + '</div>';
  if (lt === 'dscr' || lt === 'dscr_2nd')          h += '<div class="fgrid" style="margin-top:14px">' + fldText('gi_rentals', '# of rental properties currently owned', 'number') + '</div>';
  if (INFO && INFO.hasLLC === 'yes')               h += '<div class="fgrid" style="margin-top:14px">' + fldText('gi_ownership', 'Percent ownership of the vesting LLC', 'number', { ph: 'e.g. 50', hint: 'Enter 0–100.' }) + '</div>';
  h += '<h2 style="margin-top:22px;font-size:15px">Declarations</h2>' +
    '<div class="sub">Answer truthfully — these statements form part of your loan application.</div>';
  var decls = [
    ['gi_bankruptcy7yr', 'Have you been declared bankrupt in the past 7 years?'],
    ['gi_foreclosure7yr', 'Have you had a property foreclosed upon or given title or deed in lieu thereof in the last 7 years?'],
    ['gi_partyToLawsuit', 'Are you a party to a lawsuit?'],
    ['gi_delinquentFederalDebt', 'Are you presently delinquent or in default on any Federal debt or any other loan, mortgage, financial obligation, bond, or loan guarantee?'],
    ['gi_obligatedToForeclosed', 'Have you directly or indirectly been obligated on any loan which resulted in foreclosure?'],
    ['gi_outstandingJudgments', 'Are there any outstanding judgments against you?'],
    ['gi_intendToOccupy', 'Do you intend to occupy the subject property?'],
  ];
  decls.forEach(function(d){
    var cur = pf(d[0].replace(/^gi_/, ''));
    h += '<div class="decl-q"><div class="q">' + escH(d[1]) + '</div><div class="radio-row">' +
      '<div class="radio-opt"><input type="radio" id="' + d[0] + '_y" name="' + d[0] + '" value="yes"' + (cur === 'yes' ? ' checked' : '') + '/><label for="' + d[0] + '_y">Yes</label></div>' +
      '<div class="radio-opt"><input type="radio" id="' + d[0] + '_n" name="' + d[0] + '" value="no"' + (cur === 'no' ? ' checked' : '') + '/><label for="' + d[0] + '_n">No</label></div>' +
      '</div></div>';
  });
  return h + '</div>';
}
function giText(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function radioVal(name){ var el = document.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ''; }
function collectInfo(){
  var info = {
    firstName: giText('gi_firstName'), lastName: giText('gi_lastName'), email: giText('gi_email'), phone: giText('gi_phone'),
    dob: giText('gi_dob'), fico: giText('gi_fico'),
    address: giText('gi_address'), city: giText('gi_city'), state: giText('gi_state'), zip: giText('gi_zip'),
    twoYearAddress: radioVal('gi_twoYearAddress'),
    prevAddress: giText('gi_prevAddress'), prevCity: giText('gi_prevCity'), prevState: giText('gi_prevState'), prevZip: giText('gi_prevZip'),
    marital: radioVal('gi_marital'), usCitizen: radioVal('gi_usCitizen'),
    flips: giText('gi_flips'), rentals: giText('gi_rentals'), ownership: giText('gi_ownership'),
    bankruptcy7yr: radioVal('gi_bankruptcy7yr'), foreclosure7yr: radioVal('gi_foreclosure7yr'),
    partyToLawsuit: radioVal('gi_partyToLawsuit'), delinquentFederalDebt: radioVal('gi_delinquentFederalDebt'),
    obligatedToForeclosed: radioVal('gi_obligatedToForeclosed'), outstandingJudgments: radioVal('gi_outstandingJudgments'),
    intendToOccupy: radioVal('gi_intendToOccupy'),
  };
  var ssnEl = document.getElementById('gi_ssn');
  if (ssnEl && ssnEl.value.trim()) info.ssn = ssnEl.value.trim();
  return info;
}
function validateInfo(info){
  var missing = [];
  function need(v, label){ if (!v) missing.push(label); }
  need(info.firstName, 'First Name'); need(info.lastName, 'Last Name'); need(info.email, 'Email'); need(info.phone, 'Phone');
  need(info.dob, 'Date of Birth'); need(info.fico, 'Estimated Credit Score');
  need(info.address, 'Home Street Address'); need(info.city, 'City'); need(info.state, 'State'); need(info.zip, 'ZIP');
  need(info.twoYearAddress, '2+ years at address');
  if (info.twoYearAddress === 'no') need(info.prevAddress, 'Previous Street Address');
  need(info.marital, 'Marital Status'); need(info.usCitizen, 'U.S. Citizen');
  if (!(INFO.prefill && INFO.prefill.hasSSN) && !info.ssn) missing.push('Social Security Number');
  var declKeys = ['bankruptcy7yr', 'foreclosure7yr', 'partyToLawsuit', 'delinquentFederalDebt', 'obligatedToForeclosed', 'outstandingJudgments', 'intendToOccupy'];
  if (declKeys.some(function(k){ return !info[k]; })) missing.push('all Declarations');
  return missing;
}

function renderError(msg, expired) {
  document.getElementById('root').innerHTML =
    '<div class="page-header"><h1>Co-Borrower Authorization</h1></div>' +
    '<div class="status-banner error">' +
      '<strong>' + (expired ? 'Link expired' : 'Unable to load this authorization link.') + '</strong><br>' +
      escH(msg || 'Please ask your loan officer to send a new link.') +
    '</div>';
}

function renderAlreadySigned() {
  document.getElementById('root').innerHTML =
    '<div class="page-header"><h1>Already signed</h1></div>' +
    '<div class="status-banner success">' +
      'You\u2019ve already signed this authorization. Thank you! You can close this page.' +
    '</div>';
}

function renderComplete() {
  document.getElementById('root').innerHTML =
    '<div class="page-header"><h1>Authorization signed</h1></div>' +
    '<div class="status-banner success">' +
      '<strong>Thank you.</strong> You\u2019ve signed the Authorization to Conduct Prequal Credit &amp; Background Checks. A copy of the fully-signed loan application has been emailed to both borrowers.' +
    '</div>';
}

function renderForm() {
  if (!INFO || !CONSENT) return;
  var html = '';
  html += '<div class="page-header">';
  html += '<h1>Co-Borrower Authorization</h1>';
  html += '<p>' + escH(INFO.b1Name || 'Your co-borrower') + ' has submitted a loan application with SLA Capital that lists you as a guarantor. ' +
          'Federal law requires <strong>your own</strong> authorization to pull your credit and run background checks. Please review and sign below.</p>';
  html += '</div>';

  html += '<div class="summary-card">';
  if (INFO.propertyAddress) html += '<div class="row"><div class="lbl">Property</div><div class="val">' + escH(INFO.propertyAddress) + '</div></div>';
  html += '<div class="row"><div class="lbl">Primary Borrower</div><div class="val">' + escH(INFO.b1Name) + '</div></div>';
  html += '<div class="row"><div class="lbl">Co-Borrower (you)</div><div class="val">' + escH(INFO.b2Name) + '</div></div>';
  html += '<div class="row"><div class="lbl">Email</div><div class="val">' + escH(INFO.b2Email) + '</div></div>';
  html += '</div>';

  // Deploy 236.642 — collect/verify the co-signer's own info before signing;
  // it gets written onto the loan application by borrower2-auth-sign.
  html += buildInfoForm();

  html += '<div class="auth-section-title">Authorization to Conduct Prequal Credit &amp; Background Checks</div>';
  html += '<div class="consent-box">' + escH(CONSENT.prequalText) + '</div>';

  html += '<div class="consent-row">' +
    '<input type="checkbox" id="prequalCheck" onchange="updateBtn()" />' +
    '<label for="prequalCheck">' + escH(CONSENT.prequalLabel) + '</label>' +
  '</div>';

  html += '<div class="auth-section-title" style="margin-top:10px;font-size:15px">Electronic Signature Consent (ESIGN / UETA)</div>';
  html += '<div class="consent-box" style="max-height:220px">' + escH(CONSENT.esignText) + '</div>';
  html += '<div class="consent-row">' +
    '<input type="checkbox" id="esignCheck" onchange="updateBtn()" />' +
    '<label for="esignCheck">' + escH(CONSENT.esignLabel) + '</label>' +
  '</div>';

  html += '<div class="sig-block">' +
    '<label for="sigName">Type your full legal name to sign</label>' +
    '<input type="text" id="sigName" value="' + escH(INFO.b2Name) + '" oninput="updateBtn()" autocomplete="off" spellcheck="false" />' +
    '<div class="sig-note">By typing your full legal name above and clicking <strong>Sign Authorization</strong>, you are electronically signing this authorization. This signature has the same legal effect as a handwritten signature.</div>' +
  '</div>';

  html += '<button type="button" class="sign-btn" id="signBtn" onclick="signNow()" disabled>Sign Authorization</button>';
  html += '<div class="err" id="errEl"></div>';

  document.getElementById('root').innerHTML = html;
  togglePrevAddr(); // reflect a pre-filled "2+ years = no"
}

function updateBtn() {
  var btn = document.getElementById('signBtn');
  if (!btn) return;
  var pq = document.getElementById('prequalCheck');
  var es = document.getElementById('esignCheck');
  var nm = document.getElementById('sigName');
  btn.disabled = !(pq && pq.checked && es && es.checked && nm && nm.value.trim().length >= 3);
}

function signNow() {
  var btn = document.getElementById('signBtn');
  var err = document.getElementById('errEl');
  var nm = document.getElementById('sigName');
  err.style.display = 'none'; err.textContent = '';

  // Deploy 236.642 \u2014 validate the "Your Information" form before signing so
  // the application is complete. Blocks (without disabling the button) and
  // lists what's missing.
  var info = collectInfo();
  var missing = validateInfo(info);
  if (missing.length) {
    err.textContent = 'Please complete your information above \u2014 missing: ' + missing.join(', ') + '.';
    err.style.display = 'block';
    if (typeof err.scrollIntoView === 'function') err.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing\u2026';

  // Optional geolocation (best-effort, like the borrower-info flow)
  new Promise(function (resolve) {
    if (!navigator.geolocation) return resolve('');
    var timed = false;
    var to = setTimeout(function () { timed = true; resolve(''); }, 3000);
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        if (timed) return;
        clearTimeout(to);
        var g = pos.coords;
        resolve(g.latitude.toFixed(4) + ',' + g.longitude.toFixed(4) +
                ' (\u00B1' + Math.round(g.accuracy || 0) + 'm)');
      },
      function () { clearTimeout(to); resolve(''); },
      { enableHighAccuracy: false, timeout: 2500, maximumAge: 60000 }
    );
  }).then(function (geo) {
    return fetch('/api/borrower2-auth-sign', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        t: TOKEN,
        signerName: nm.value.trim(),
        guarantorInfo: info, // Deploy 236.642 — verified/completed co-signer info
        consentAccepted: true,
        consentVersion: CONSENT.version,
        geolocation: geo,
      }),
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) {
          var e = new Error(d.error || ('HTTP ' + r.status));
          e.status = r.status;
          throw e;
        }
        return d;
      });
    });
  }).then(function () {
    renderComplete();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }).catch(function (e) {
    btn.disabled = false;
    btn.textContent = 'Sign Authorization';
    err.textContent = (e && e.message) || 'Signing failed. Please try again.';
    err.style.display = 'block';
  });
}

// Load info + consent text in parallel, then render the form
if (!TOKEN) {
  renderError('Missing signing token.');
} else {
  Promise.all([
    fetch('/api/borrower2-auth-info?t=' + encodeURIComponent(TOKEN)).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw new Error(d.error || 'Failed to load');
        return d;
      });
    }),
    fetch('/api/esign-consent').then(function (r) { return r.json(); }),
  ]).then(function (results) {
    INFO = results[0];
    if (INFO.expired)       { renderError('This signing link has expired. Ask your loan officer to send a new one.', true); return; }
    if (INFO.alreadySigned) { renderAlreadySigned(); return; }
    var c = results[1];
    CONSENT = {
      version: c.version,
      esignText: c.text || c.esignText,
      esignLabel: c.checkboxLabel || c.esignLabel,
      prequalText: c.prequalText || '',
      prequalLabel: c.prequalLabel || '',
    };
    if (!CONSENT.prequalText) {
      renderError('Authorization text could not be loaded. Please try again later.');
      return;
    }
    renderForm();
  }).catch(function (e) {
    renderError((e && e.message) || 'Failed to load.');
  });
}
</script>
</body>
</html>
