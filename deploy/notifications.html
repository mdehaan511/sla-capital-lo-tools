<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>/* clean-url (Deploy 237.220, Mike): the address bar never shows ".html". Netlify serves /pipeline and /pipeline.html as the SAME page, so nothing is redirected and every old link, bookmark and emailed URL keeps working - this only tidies what is displayed. Query and #hash are kept (sign-in tokens arrive in the hash). First script in <head> so it runs before anything reads the path. */(function(){try{var l=window.location;if(!/^https?:$/.test(l.protocol))return;var p=l.pathname,n=p.replace(/\/index\.html$/i,'/').replace(/\.html$/i,'');if(n!==p&&window.history&&history.replaceState){history.replaceState(history.state,'',n+l.search+l.hash);}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — SLA Capital</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<!--
  Deploy 237.197 (Mike): "a profile based notifications page. You get to it by clicking
  the bell and going to See All Notifications and it shows all historical notifications,
  both unread and read, and has links to whatever loan or client ties to that
  notification ... if they click one of the notifications it goes to whatever that
  notification is and marks it as read. They can also mark notifications as unread or
  mark all notifications as read ... filter by date and type."

  The bell shows what is outstanding; this page is the record. Every notification kind
  ever pushed shows up here without this page being taught about it — an unknown kind
  still renders with its title, its date and its link (see kindLabel / hrefFor), because
  the next kind someone adds should not silently go missing from the history.

  Nav comes from sla-nav.js — this page adds no nav CSS of its own (see
  feedback_one_nav_everywhere).
-->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="/sla-api.js?v=237207"></script>
<script src="/sla-nav.js"></script>
<script src="/sla-search.js"></script>
<script src="/sla-notifications.js?v=237207"></script>
<script src="/sla-chat.js"></script>
<style>
  :root{
    --bg:#faf7f2; --surface:#fff; --text:#1a1520; --muted:#7a7488;
    --line:#e4dfd4; --gold:#c8813a; --gold-soft:rgba(200,129,58,.10);
    --red:#7c1f1f; --green:#166534;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px}
  .page{max-width:900px;margin:0 auto;padding:28px 20px 80px}
  h1{font-family:'Fraunces',serif;font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}

  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;
       background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .fld select,.fld input{padding:7px 10px;font-family:inherit;font-size:13px;color:var(--text);
       border:1px solid var(--line);border-radius:8px;background:#fff}
  .bar .spacer{flex:1}
  button.act{padding:8px 14px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;
       cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text)}
  button.act.primary{background:var(--gold);border-color:var(--gold);color:#fff}
  button.act:disabled{opacity:.5;cursor:default}

  .list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .row{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line);position:relative}
  .row:first-child{border-top:none}
  .row.unread{background:var(--gold-soft)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:6px;flex:0 0 8px}
  .row.read .dot{background:transparent;border:1px solid var(--line)}
  .main{flex:1;min-width:0}
  .ttl{font-weight:600;line-height:1.35}
  .row.read .ttl{font-weight:500;color:#4a4458}
  .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .kind{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
        color:#6b5322;background:var(--gold-soft);border:1px solid rgba(200,129,58,.28);
        border-radius:20px;padding:1px 8px;margin-right:6px}
  .go{color:inherit;text-decoration:none;display:block}
  .go:hover .ttl{text-decoration:underline}
  .rowbtn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;
          font-size:11px;font-weight:600;padding:4px 8px;cursor:pointer;white-space:nowrap}
  .empty{padding:48px 20px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
  .count{font-size:12px;color:var(--muted);margin:10px 2px}
  /* Deploy 237.202 -- the live half of the bell. Deliberately quieter than the history
     rows: there is nothing to mark read here, these clear themselves. */
  .sec{font-family:'Fraunces',serif;font-size:16px;margin:22px 2px 8px;display:flex;align-items:baseline;gap:8px}
  .sec .n{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;color:#6b5322;
          background:var(--gold-soft);border:1px solid rgba(200,129,58,.28);border-radius:20px;padding:1px 8px}
  .sec .why{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:400;color:var(--muted)}
  /* Deploy 237.204 -- a category heading inside a list. Sits on the list's own border
     rhythm, so a group reads as part of the list rather than a stack of separate cards. */
  .grp{display:flex;align-items:baseline;gap:8px;padding:9px 16px;border-top:1px solid var(--line);
       background:#fbf8f3;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
       color:#6b5322}
  .grp:first-child{border-top:none}
  .grp .gn{font-weight:600;color:var(--muted);letter-spacing:0;text-transform:none;font-size:11px}
  .row.live{background:#fff}
  .row.live .dot{background:#b98a4e}
  #auth-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
  #auth-gate .gate-msg{color:var(--muted);font-size:14px;text-align:center}
  #auth-gate .gate-msg strong{color:var(--text);display:block;margin-bottom:8px;font-size:18px}
</style>
</head>
<body>
<div id="auth-gate"><div class="gate-msg"><strong>Loading…</strong>Checking authentication.</div></div>
<div class="page" id="appWrap" style="display:none">
  <h1>Notifications</h1>
  <div class="sub" id="sub">Everything sent to you — read and unread.</div>

  <!-- Deploy 237.202 -- Mike: the bell said 9+ and this page said 5. It was not a
       miscount: the badge also counts mail waiting, processing alerts, due tasks, loan
       apps and reminders, and none of those are stored notifications, so none of them
       were ever on this page. They are now, in their own section, because they behave
       differently -- they are live, and they disappear when the work is done rather than
       when you read them. The numbers come from the bell's own openCount(). -->
  <div id="liveWrap" style="display:none">
    <div class="sec"><span>Open now</span><span class="n" id="liveN"></span>
      <span class="why">from the bell &mdash; these clear when the work is done, not when you read them</span></div>
    <div class="list" id="liveList"></div>
  </div>

  <div class="sec" id="histHdr" style="display:none"><span>History</span>
    <span class="why">everything ever sent to you</span></div>

  <div class="bar">
    <div class="fld">
      <label for="fCat">Category</label>
      <select id="fCat" onchange="applyFilters()"><option value="">All categories</option></select>
    </div>
    <div class="fld">
      <label for="fState">Status</label>
      <select id="fState" onchange="applyFilters()">
        <option value="">Read &amp; unread</option>
        <option value="unread">Unread only</option>
        <option value="read">Read only</option>
      </select>
    </div>
    <div class="fld">
      <label for="fFrom">From</label>
      <input type="date" id="fFrom" onchange="applyFilters()">
    </div>
    <div class="fld">
      <label for="fTo">To</label>
      <input type="date" id="fTo" onchange="applyFilters()">
    </div>
    <div class="spacer"></div>
    <button class="act" id="btnClear" onclick="clearFilters()">Clear filters</button>
    <button class="act primary" id="btnAll" onclick="markAllRead()">Mark all as read</button>
  </div>

  <div class="count" id="count"></div>
  <div class="list" id="list"><div class="empty">Loading…</div></div>
</div>

<script>
/* eslint-disable */
var _items = [];

function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return escH(s); }

/* A kind we have never seen still gets a readable label rather than a blank chip —
   the next notification someone adds must not go missing from the history. */
var KIND_LABELS = {
  mention:         'Mention',
  borrower_upload: 'New document',
  full_file:       'Full file',
  servicing:       'Servicing',
  deed:            'Deed',
  payoff_confirmed:   'Payoff confirmed',
  payoff_unconfirmed: 'Payoff unconfirmed',
  /* Deploy 237.207 -- Mike's five events. */
  condition_added:    'Condition added',
  clear_to_close:     'Cleared to Close',
  loan_assigned:      'Loan assigned',
  task_assigned:      'Task assigned',
  doc_signed:         'Signed document'
};
function kindLabel(k){
  if (KIND_LABELS[k]) return KIND_LABELS[k];
  return String(k||'Notification').replace(/[_-]+/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

/* Where a notification goes when you click it. Explicit href wins; otherwise the loan it
   names; otherwise the client. Mike: "has links to whatever loan or client ties to that
   notification". */
function hrefFor(n){
  if (n.href) return n.href;
  if (n.loanId){
    return '/loan-details/' + encodeURIComponent(n.loanId) +
      (n.owner ? '?owner=' + encodeURIComponent(n.owner) : '');
  }
  if (n.clientId) return '/client-details.html?clientId=' + encodeURIComponent(n.clientId);
  return '';
}

/* Every kind stores its wording slightly differently (mentions use snippet, the newer
   ones use title/text). Read them all rather than showing an empty row. */
function titleOf(n){
  if (n.title) return n.title;
  if (n.kind === 'mention'){
    return (n.fromName || n.fromEmail || 'Someone') + ' mentioned you' +
      (n.address ? ' on ' + String(n.address).split(',')[0] : '');
  }
  return kindLabel(n.kind);
}
function bodyOf(n){
  return n.text || n.snippet || n.address || '';
}
function fmtWhen(iso){
  if (!iso) return '';
  var d = new Date(iso); if (isNaN(d)) return '';
  var now = new Date();
  var sameDay = d.toDateString() === now.toDateString();
  return sameDay
    ? 'Today ' + d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })
    : d.toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' }) +
      ' ' + d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
}

/* Deploy 237.202 -- the live half, straight from the bell's own collect()/openCount()
   so the two surfaces cannot drift. Zero-throw: the history is the point of this page and
   must still render if a feed endpoint is having a bad day. */
var _openN = 0;

/* Deploy 237.203 -- ride the bell's own refresh rather than fetching the feeds here. The
   first version fetched once at page boot, which happened BEFORE the bell had resolved
   that this user is a processor, so mail and processing alerts were still empty and this
   section rendered nothing beside a 9+ badge -- the very mismatch it was added to fix.
   Subscribing means the page redraws from the same pass that draws the badge. */
function bootLive(){
  if (!window.SLANotify || !SLANotify.subscribe) return;
  SLANotify.subscribe(function(f){ paintLive(f); applyFilters(); });
}

function paintLive(f){
  var wrap = document.getElementById('liveWrap');
  if (!wrap) return;
  var rows = (f && SLANotify.openRows(f)) || [];
  // openCount counts mail by the piece, so the badge can read 33 where this list shows
  // one row. Print the bell's number, not the row count, or we are back where we started.
  _openN = f ? (SLANotify.openCount(f) - (f.mentions || []).length) : 0;
  if (!rows.length){ wrap.style.display = 'none'; _openN = 0; return; }
  wrap.style.display = 'block';
  document.getElementById('liveN').textContent = String(_openN);
  document.getElementById('liveList').innerHTML =
    groupedHtml(rows, function(r){ return r.kind; }, liveRowHtml);
}

function liveRowHtml(r){
  var meta = '<span class="kind">' + escH(kindLabel(r.kind)) + '</span>' +
    escH(r.text || '') + ((r.text && r.when) ? ' \u00b7 ' : '') + escH(r.when ? fmtWhen(r.when) || r.when : '');
  var inner = '<div class="ttl">' + escH(r.title) + '</div><div class="meta">' + meta + '</div>';
  return '<div class="row live"><div class="dot"></div><div class="main">' +
    (r.href ? '<a class="go" href="' + escAttr(r.href) + '">' + inner + '</a>' : inner) +
    '</div>' +
    (r.weight > 1 ? '<span class="rowbtn" style="cursor:default">' + r.weight + ' items</span>' : '') +
    '</div>';
}

function load(){
  // SLA.api resolves to the PARSED BODY already — it is not fetch, there is no
  // .json() to call. Deploy 237.200.
  return SLA.api('GET', '/api/notifications-list')
    .then(function(j){
      _items = (j && j.items) || [];
      buildCategoryFilter();
      applyFilters();
    })
    .catch(function(e){
      document.getElementById('list').innerHTML =
        '<div class="empty"><b>Could not load your notifications</b>' + escH((e && e.message) || '') + '</div>';
    });
}

/* Deploy 237.204 -- categories come from the bell (one map for both halves of this page).
   If that script is missing everything falls into 'Other' and the page still works. */
function catOf(kind){
  return (window.SLANotify && SLANotify.categoryOf) ? SLANotify.categoryOf(kind) : 'Other';
}
function catOrder(){
  return (window.SLANotify && SLANotify.categories)
    ? SLANotify.categories
    : ['Documents Uploaded', 'Loan Updates', 'Mail', 'Payments', 'Other'];
}

/* Group rows under their category heading, in a fixed order, skipping categories this
   person has nothing in — an empty heading is worse than no heading. */
function groupedHtml(rows, kindOf, rowFn){
  var buckets = {};
  rows.forEach(function(r){
    var c = catOf(kindOf(r));
    if (!buckets[c]) buckets[c] = [];
    buckets[c].push(r);
  });
  var out = '';
  catOrder().forEach(function(c){
    var b = buckets[c];
    if (!b || !b.length) return;
    out += '<div class="grp">' + escH(c) + '<span class="gn">' + b.length + '</span></div>' +
           b.map(rowFn).join('');
  });
  return out;
}

/* Only offer categories that are actually in this person's history — an empty filter
   option is a dead end. */
function buildCategoryFilter(){
  var sel = document.getElementById('fCat');
  var cur = sel.value;
  var cats = [];
  _items.forEach(function(n){
    var c = catOf(n.kind || 'mention');
    if (cats.indexOf(c) < 0) cats.push(c);
  });
  cats.sort(function(a,b){ return catOrder().indexOf(a) - catOrder().indexOf(b); });
  sel.innerHTML = '<option value="">All categories</option>' + cats.map(function(c){
    return '<option value="' + escAttr(c) + '">' + escH(c) + '</option>';
  }).join('');
  if (cur && cats.indexOf(cur) >= 0) sel.value = cur;
}

function filtered(){
  var cat   = document.getElementById('fCat').value;
  var state = document.getElementById('fState').value;
  var from  = document.getElementById('fFrom').value;
  var to    = document.getElementById('fTo').value;
  return _items.filter(function(n){
    if (cat && catOf(n.kind || 'mention') !== cat) return false;
    if (state === 'unread' && n.readAt) return false;
    if (state === 'read' && !n.readAt) return false;
    var day = String(n.createdAt || '').slice(0, 10);
    if (from && day < from) return false;
    if (to && day > to) return false;   // inclusive: the To date itself is included
    return true;
  });
}

function applyFilters(){
  var rows = filtered();
  var unread = _items.filter(function(n){ return !n.readAt; }).length;
  // Deploy 237.204 -- three plain counts. 237.202 tried to EXPLAIN the bell here ("2
  // unread of 5 in your history · 93 open now — the bell shows 9+ (95)"), which read like
  // a reconciliation of two things that disagree. They no longer disagree, so there is
  // nothing to reconcile; just say what is on the page.
  var parts = [];
  if (_openN) parts.push(_openN + ' open now');
  if (unread) parts.push(unread + ' unread');
  parts.push(_items.length + ' in your history');
  document.getElementById('sub').textContent = (_openN || _items.length)
    ? parts.join(' \u00b7 ')
    : 'Nothing needs your attention right now.';
  document.getElementById('histHdr').style.display = _openN ? 'flex' : 'none';
  document.getElementById('count').textContent =
    rows.length === _items.length ? '' : ('Showing ' + rows.length + ' of ' + _items.length);
  document.getElementById('btnAll').disabled = !unread;

  var list = document.getElementById('list');
  if (!rows.length){
    list.innerHTML = _items.length
      ? '<div class="empty"><b>Nothing matches those filters</b>Try widening the dates or the category.</div>'
      : '<div class="empty"><b>No notifications yet</b>Mentions, new documents from borrowers and alerts will collect here.</div>';
    return;
  }
  list.innerHTML = groupedHtml(rows, function(n){ return n.kind || 'mention'; }, rowHtml);
}

function rowHtml(n){
  var href = hrefFor(n);
  var read = !!n.readAt;
  var inner =
    '<div class="ttl">' + escH(titleOf(n)) + '</div>' +
    '<div class="meta"><span class="kind">' + escH(kindLabel(n.kind)) + '</span>' +
      escH(bodyOf(n)) + (bodyOf(n) ? ' · ' : '') + escH(fmtWhen(n.createdAt)) +
      (read ? ' · read' : '') +
    '</div>';
  return '<div class="row ' + (read ? 'read' : 'unread') + '" id="nrow_' + escAttr(n.id) + '">' +
      '<div class="dot"></div>' +
      '<div class="main">' +
        (href
          ? '<a class="go" href="' + escAttr(href) + '" onclick="return openOne(\'' + escAttr(n.id) + '\')">' + inner + '</a>'
          : inner) +
      '</div>' +
      '<button class="rowbtn" onclick="toggleRead(\'' + escAttr(n.id) + '\')">' +
        (read ? 'Mark unread' : 'Mark read') +
      '</button>' +
    '</div>';
}

/* Mike: "if they click one of the notifications it goes to whatever that notification is
   and marks it as read." The mark is fired and NOT awaited — the navigation should not
   wait on a write, and if it fails the item simply stays unread, which is the safe way
   round. */
function openOne(id){
  var n = _items.filter(function(x){ return x.id === id; })[0];
  if (n && !n.readAt){
    n.readAt = new Date().toISOString();
    // Deploy 237.202 (Mike: "if I click into one and return with the back button ... show
    // it as now being read"). Paint the row read BEFORE leaving rather than re-rendering
    // the list -- a full re-render would make the row vanish under the cursor while the
    // "Unread only" filter is on. Coming back through the bfcache restores this DOM, so
    // the row is already correct before the pageshow refresh below lands.
    var row = document.getElementById('nrow_' + id);
    if (row){
      row.className = 'row read';
      var meta = row.querySelector('.meta');
      if (meta && meta.textContent.indexOf(' · read') < 0) meta.textContent += ' · read';
      var btn = row.querySelector('.rowbtn');
      if (btn) btn.textContent = 'Mark unread';
    }
    try { SLA.api('POST', '/api/notifications-read', { ids: [id] }); } catch (_) {}
  }
  return true;   // let the browser follow the link
}

/* Back button. A bfcached page runs no script on return, so without this the list is
   whatever it was when you left -- including anything marked read in another tab, or the
   mail you just sorted. Re-read both halves; it is two cheap calls. Deploy 237.202. */
window.addEventListener('pageshow', function(e){
  if (!e.persisted) return;                     // a fresh load already fetched
  if (!document.getElementById('appWrap') ||
      document.getElementById('appWrap').style.display === 'none') return;
  load();   // the live half redraws on the bell's next pass by itself
});

function toggleRead(id){
  var n = _items.filter(function(x){ return x.id === id; })[0];
  if (!n) return;
  var makeUnread = !!n.readAt;
  n.readAt = makeUnread ? '' : new Date().toISOString();
  applyFilters();
  SLA.api('POST', '/api/notifications-read', makeUnread ? { ids: [id], unread: true } : { ids: [id] })
    .catch(function(e){
      console.warn('notification mark failed:', e && e.message);
      n.readAt = makeUnread ? new Date().toISOString() : '';   // put it back
      applyFilters();
    });
}

function markAllRead(){
  var stamp = new Date().toISOString();
  var was = _items.map(function(n){ return n.readAt || ''; });
  _items.forEach(function(n){ if (!n.readAt) n.readAt = stamp; });
  applyFilters();
  SLA.api('POST', '/api/notifications-read', { all: true })
    .catch(function(e){
      console.warn('mark all failed:', e && e.message);
      _items.forEach(function(n, i){ n.readAt = was[i]; });
      applyFilters();
    });
}

function clearFilters(){
  ['fCat','fState','fFrom','fTo'].forEach(function(id){ document.getElementById(id).value = ''; });
  applyFilters();
}

// Same gate as every other staff page. Everyone signed in has notifications of their
// own, so there is no role check beyond being logged in.
window.netlifyIdentity.on('init', function (user) {
  if (!user) { window.location.replace('/'); return; }
  // ?unread=1 from the bell's "See all" — land on what is still outstanding.
  var p = new URLSearchParams(location.search);
  if (p.get('unread') === '1') document.getElementById('fState').value = 'unread';
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  load();
  bootLive();   // the subtitle's arithmetic needs _openN, which arrives with the bell
});
</script>
</body>
</html>
