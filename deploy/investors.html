<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investors — SLA Capital</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="/sla-api.js"></script>
  <script src="/sla-nav.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C8813A; --gold-mid: #b5712d; --gold-light: rgba(200,129,58,0.10);
      --gold-border: rgba(200,129,58,0.28); --dark: #261a36; --bg: #f0ece5;
      --surface: #ffffff; --text: #1a1520; --muted: #7a7488; --border: #ddd8d0;
      --success: #166534; --danger: #7c1f1f; --r: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .page { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 4rem; }
    /* Deploy 236.476 — full shared-nav CSS. sla-nav.js injects styles for its
       dropdown/link classes but the PAGE must supply .nav layout + logo sizing;
       without .nav img the logo rendered at full size (the giant logo). */
    .nav { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.5rem 0; display: flex; align-items: center; justify-content: space-between; }
    .nav img { height: 48px; width: auto; }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .nav-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .nav-tools-btn { display: inline-block; padding: 6px 14px; border: 1px solid var(--gold-border); background: var(--gold-light); color: var(--gold-mid); border-radius: 20px; font-size: 12px; font-weight: 600; font-family: 'DM Sans', sans-serif; text-decoration: none; transition: all 0.15s; white-space: nowrap; }
    .nav-tools-btn:hover { background: var(--gold); color: #fff; border-color: var(--gold); }
    .nav-tool-link { font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); transition: all 0.15s; white-space: nowrap; }
    .nav-tool-link:hover { border-color: var(--gold); color: var(--gold); }
    .nav-tool-link.current { background: var(--dark); border-color: var(--dark); color: #fff; }
    #auth-gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .gate-msg { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 2rem 2.5rem; text-align: center; font-size: 14px; color: var(--muted); }
    .gate-msg strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
    .gate-msg a { color: var(--gold); }

    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: 2rem 0 1.5rem; }
    .page-header h1 { font-family: 'Lora', serif; font-size: 26px; font-weight: 600; color: var(--text); }
    .page-header p { font-size: 13px; color: var(--muted); margin-top: 4px; max-width: 640px; }
    .ctrl-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-box { padding: 7px 14px; border: 1px solid var(--border); border-radius: 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--surface); min-width: 240px; }
    .search-box:focus { outline: none; border-color: var(--gold); }
    .add-btn { padding: 7px 16px; border: 1px solid var(--gold); background: var(--gold); color: #fff; border-radius: 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .add-btn:hover { background: var(--gold-mid); border-color: var(--gold-mid); }

    .inv-table { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .inv-head, .inv-row { display: grid; grid-template-columns: 1.4fr 1.2fr 1.2fr 1fr 130px 30px; gap: 12px; padding: 12px 16px; align-items: center; }
    .inv-head { background: rgba(38,26,54,0.04); border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; color: var(--muted); }
    .inv-row { border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; transition: background 0.10s; }
    .inv-row:last-child { border-bottom: none; }
    .inv-row:hover { background: var(--bg); }
    .inv-name { font-weight: 600; color: var(--text); }
    .inv-sub { font-size: 12px; color: var(--muted); }
    .inv-del { background: transparent; border: none; color: var(--muted); font-size: 13px; cursor: pointer; padding: 0; }
    .inv-del:hover { color: var(--danger); }
    .loading, .empty-state { padding: 3rem 1rem; text-align: center; color: var(--muted); font-size: 13px; }

    .vm-bg { position: fixed; inset: 0; background: rgba(38,26,54,0.45); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
    .vm-card { background: var(--surface); border-radius: 14px; padding: 1.75rem; width: 100%; max-width: 480px; box-shadow: 0 24px 48px rgba(0,0,0,0.25); max-height: 92vh; overflow-y: auto; }
    .vm-card h3 { font-family: 'Lora', serif; font-size: 18px; margin-bottom: 1rem; color: var(--text); }
    .vm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .vm-field { margin-bottom: 12px; }
    .vm-field.full { grid-column: 1 / -1; }
    .vm-field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
    .vm-field input, .vm-field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--surface); color: var(--text); box-sizing: border-box; }
    .vm-field textarea { min-height: 64px; resize: vertical; }
    .vm-field input:focus, .vm-field textarea:focus { outline: none; border-color: var(--gold); }
    .vm-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.25rem; }
    .vm-actions button { padding: 9px 18px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .vm-actions button.primary { background: var(--gold); border-color: var(--gold); color: #fff; }
    .vm-status { font-size: 12px; margin-top: 8px; min-height: 16px; }
    .vm-status.err { color: var(--danger); }

    /* Deploy 236.478 — Loan Type multi-select (checkbox dropdown). */
    .ms-dd { position: relative; }
    .ms-dd-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); cursor: pointer; text-align: left; }
    .ms-dd-btn:focus { outline: none; border-color: var(--gold); }
    .ms-dd-btn.placeholder { color: var(--muted); }
    .ms-dd-btn span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ms-dd-caret { color: var(--muted); font-size: 11px; flex: none; }
    .ms-dd-panel { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 12px 28px rgba(0,0,0,0.16); padding: 6px; z-index: 20; }
    .ms-dd-panel.open { display: block; }
    .ms-dd-opt { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 6px; font-size: 13px; color: var(--text); cursor: pointer; user-select: none; }
    .ms-dd-opt:hover { background: var(--bg); }
    .ms-dd-opt input { width: 15px; height: 15px; accent-color: var(--gold); cursor: pointer; margin: 0; }
    @media (max-width: 720px) {
      .inv-head, .inv-row { grid-template-columns: 1.4fr 1fr 30px; }
      .inv-head .h-poc, .inv-head .h-email, .inv-row .c-poc, .inv-row .c-email { display: none; }
      .vm-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="auth-gate"><div class="gate-msg"><strong>Loading…</strong>Checking access.</div></div>
  <nav class="nav" id="slaNav"></nav>

  <div class="page" id="appWrap" style="display:none">
    <div class="page-header">
      <div>
        <h1>Investors</h1>
        <p>Your primary capital partners. Store the investor's contact + criteria here; loan officers pick from this list on a deal's Funding Plan so we can track volume by investor.</p>
      </div>
      <div class="ctrl-row">
        <input type="text" class="search-box" id="searchBox" placeholder="Search name, loan type, contact…" oninput="render()" />
        <button class="add-btn" onclick="openInvestorModal()">+ Add Investor</button>
      </div>
    </div>
    <div class="inv-table" id="invTable"><div class="loading">Loading investors…</div></div>
  </div>

  <!-- Add / Edit investor -->
  <div class="vm-bg" id="invModalBg" onclick="if(event.target===this)closeInvestorModal()">
    <div class="vm-card">
      <h3 id="imTitle">Add Investor</h3>
      <input type="hidden" id="imId">
      <div class="vm-grid">
        <div class="vm-field"><label>Investor Name</label><input type="text" id="imName" placeholder="e.g. King Arthur Fund"></div>
        <div class="vm-field"><label>Loan Type</label>
          <div class="ms-dd">
            <button type="button" class="ms-dd-btn placeholder" id="imLoanTypesBtn" onclick="toggleLoanTypesDD(event)">
              <span id="imLoanTypesLabel">Select loan types…</span>
              <span class="ms-dd-caret">▾</span>
            </button>
            <div class="ms-dd-panel" id="imLoanTypesPanel"></div>
          </div>
        </div>
        <div class="vm-field"><label>Contact Name</label><input type="text" id="imPocName" placeholder="Main point of contact"></div>
        <div class="vm-field"><label>Contact Phone</label><input type="tel" id="imPocPhone" placeholder="(555) 123-4567" oninput="applyPhoneMask(this)"></div>
        <div class="vm-field full"><label>Contact Email</label><input type="email" id="imPocEmail" placeholder="name@investor.com"></div>
        <div class="vm-field full"><label>Buy-Box / Criteria</label><textarea id="imCriteria" placeholder="What they buy — product types, LTV/DSCR limits, states, min/max loan, etc."></textarea></div>
        <div class="vm-field full"><label>Notes</label><textarea id="imNotes" placeholder="Anything else worth remembering"></textarea></div>
      </div>
      <div class="vm-status" id="imStatus"></div>
      <div class="vm-actions">
        <button onclick="closeInvestorModal()">Cancel</button>
        <button class="primary" id="imSaveBtn" onclick="saveInvestor()">Save Investor</button>
      </div>
    </div>
  </div>

<script>
'use strict';
var _user = null;
var _investors = [];

// Deploy 236.478 — "Company" replaced by "Loan Type" (multi-select). These
// are the fixed options; the same list is whitelisted server-side in
// investors-save.mjs so the two can't drift.
var LOAN_TYPE_OPTS = ['RTL', 'DSCR', 'New Construction', 'Multifamily', 'Other'];

function escH(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Loan Type multi-select dropdown ─────────────────────────────────
function buildLoanTypePanel() {
  var panel = document.getElementById('imLoanTypesPanel');
  if (!panel) return;
  var html = '';
  for (var i = 0; i < LOAN_TYPE_OPTS.length; i++) {
    var v = LOAN_TYPE_OPTS[i];
    html += '<label class="ms-dd-opt"><input type="checkbox" value="' + escAttr(v) + '" onchange="updateLoanTypesLabel()">' + escH(v) + '</label>';
  }
  panel.innerHTML = html;
}
function toggleLoanTypesDD(event) {
  if (event) event.stopPropagation();
  var panel = document.getElementById('imLoanTypesPanel');
  if (panel) panel.classList.toggle('open');
}
function closeLoanTypesDD() {
  var panel = document.getElementById('imLoanTypesPanel');
  if (panel) panel.classList.remove('open');
}
// Close the panel when clicking anywhere outside it.
document.addEventListener('click', function (e) {
  var panel = document.getElementById('imLoanTypesPanel');
  if (!panel || !panel.classList.contains('open')) return;
  var wrap = panel.parentNode; // .ms-dd
  if (wrap && !wrap.contains(e.target)) closeLoanTypesDD();
});
function getSelectedLoanTypes() {
  var panel = document.getElementById('imLoanTypesPanel');
  if (!panel) return [];
  var boxes = panel.querySelectorAll('input[type=checkbox]');
  var out = [];
  for (var i = 0; i < boxes.length; i++) { if (boxes[i].checked) out.push(boxes[i].value); }
  return out;
}
function setSelectedLoanTypes(arr) {
  arr = Array.isArray(arr) ? arr : [];
  var panel = document.getElementById('imLoanTypesPanel');
  if (!panel) return;
  var boxes = panel.querySelectorAll('input[type=checkbox]');
  for (var i = 0; i < boxes.length; i++) { boxes[i].checked = arr.indexOf(boxes[i].value) >= 0; }
  updateLoanTypesLabel();
}
function updateLoanTypesLabel() {
  var sel = getSelectedLoanTypes();
  var lbl = document.getElementById('imLoanTypesLabel');
  var btn = document.getElementById('imLoanTypesBtn');
  if (!lbl || !btn) return;
  if (sel.length) { lbl.textContent = sel.join(', '); btn.classList.remove('placeholder'); }
  else { lbl.textContent = 'Select loan types…'; btn.classList.add('placeholder'); }
}
buildLoanTypePanel();

// Auth + admin gate (Supabase-safe via SLA.getCurrentUser).
(function init() {
  if (!(window.SLA && SLA.getCurrentUser)) { setTimeout(init, 120); return; }
  SLA.getCurrentUser().then(function (user) {
    if (!user) { window.location.replace('/'); return; }
    if (!(SLA.isAdmin && SLA.isAdmin(user))) {
      document.getElementById('auth-gate').innerHTML =
        '<div class="gate-msg"><strong>Admin access required.</strong>The Investors book is admin-only. <a href="/">Back to home</a></div>';
      return;
    }
    _user = user;
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    loadAll();
  }).catch(function () { window.location.replace('/'); });
})();

function loadAll() {
  document.getElementById('invTable').innerHTML = '<div class="loading">Loading investors…</div>';
  SLA.Investors.list().then(function (r) {
    _investors = (r && r.investors) || [];
    render();
  }).catch(function (err) {
    document.getElementById('invTable').innerHTML =
      '<div class="empty-state" style="color:var(--danger)">Failed to load: ' + escH(err && err.message || 'unknown') + '</div>';
  });
}

function render() {
  var q = (document.getElementById('searchBox').value || '').toLowerCase().trim();
  var rows = _investors.slice();
  if (q) {
    rows = rows.filter(function (i) {
      var lt = Array.isArray(i.loanTypes) ? i.loanTypes.join(' ') : '';
      return ((i.name || '') + ' ' + lt + ' ' + (i.pocName || '') + ' ' + (i.pocEmail || '') + ' ' + (i.pocPhone || '')).toLowerCase().indexOf(q) >= 0;
    });
  }
  if (!rows.length) {
    document.getElementById('invTable').innerHTML =
      '<div class="empty-state">' + (q ? 'No investors match your search.' : 'No investors yet. Click <strong>+ Add Investor</strong> to add your first capital partner.') + '</div>';
    return;
  }
  var html =
    '<div class="inv-head">' +
      '<div>Investor</div><div class="h-poc">Contact</div><div class="h-email">Email</div><div>Phone</div><div>Updated</div><div></div>' +
    '</div>';
  html += rows.map(renderRow).join('');
  document.getElementById('invTable').innerHTML = html;
}

function renderRow(i) {
  var updated = i.updatedAt ? new Date(i.updatedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
  var emailHtml = i.pocEmail ? '<a href="mailto:' + escAttr(i.pocEmail) + '" onclick="event.stopPropagation()">' + escH(i.pocEmail) + '</a>' : '<span class="inv-sub">—</span>';
  var phoneHtml = i.pocPhone ? '<a href="tel:' + escAttr(String(i.pocPhone).replace(/[^\d+]/g, '')) + '" onclick="event.stopPropagation()">' + escH(i.pocPhone) + '</a>' : '<span class="inv-sub">—</span>';
  var ltSub = (Array.isArray(i.loanTypes) && i.loanTypes.length) ? i.loanTypes.join(', ') : '';
  return '<div class="inv-row" onclick="openInvestorModalById(\'' + escAttr(i.id) + '\')" title="Click to edit">' +
    '<div><div class="inv-name">' + escH(i.name || '(unnamed)') + '</div>' + (ltSub ? '<div class="inv-sub">' + escH(ltSub) + '</div>' : '') + '</div>' +
    '<div class="c-poc">' + escH(i.pocName || '') + '</div>' +
    '<div class="c-email">' + emailHtml + '</div>' +
    '<div>' + phoneHtml + '</div>' +
    '<div class="inv-sub">' + escH(updated) + '</div>' +
    '<button class="inv-del" onclick="event.stopPropagation();delInvestor(\'' + escAttr(i.id) + '\')" title="Delete">✕</button>' +
  '</div>';
}

function openInvestorModal(inv) {
  inv = inv || null;
  document.getElementById('imTitle').textContent = inv ? 'Edit Investor' : 'Add Investor';
  document.getElementById('imId').value       = inv ? (inv.id || '') : '';
  document.getElementById('imName').value      = inv ? (inv.name    || '') : '';
  setSelectedLoanTypes(inv ? (inv.loanTypes || []) : []);
  closeLoanTypesDD();
  document.getElementById('imPocName').value   = inv ? (inv.pocName || '') : '';
  document.getElementById('imPocPhone').value  = inv ? (inv.pocPhone|| '') : '';
  document.getElementById('imPocEmail').value  = inv ? (inv.pocEmail|| '') : '';
  document.getElementById('imCriteria').value  = inv ? (inv.criteria|| '') : '';
  document.getElementById('imNotes').value     = inv ? (inv.notes   || '') : '';
  var st = document.getElementById('imStatus'); st.textContent = ''; st.className = 'vm-status';
  document.getElementById('invModalBg').style.display = 'flex';
}
function openInvestorModalById(id) {
  var inv = _investors.find(function (x) { return x.id === id; });
  if (inv) openInvestorModal(inv);
}
function closeInvestorModal() { document.getElementById('invModalBg').style.display = 'none'; }

function saveInvestor() {
  var status = document.getElementById('imStatus');
  var name = document.getElementById('imName').value.trim();
  if (!name) { status.className = 'vm-status err'; status.textContent = 'Enter an investor name.'; return; }
  var body = {
    name: name,
    loanTypes: getSelectedLoanTypes(),
    pocName:  document.getElementById('imPocName').value.trim(),
    pocPhone: document.getElementById('imPocPhone').value.trim(),
    pocEmail: document.getElementById('imPocEmail').value.trim(),
    criteria: document.getElementById('imCriteria').value.trim(),
    notes:    document.getElementById('imNotes').value.trim(),
  };
  var id = document.getElementById('imId').value;
  if (id) body.id = id;
  var btn = document.getElementById('imSaveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  SLA.Investors.save(body).then(function (resp) {
    btn.disabled = false; btn.textContent = 'Save Investor';
    var saved = (resp && resp.investor) || null;
    if (saved && saved.id) {
      var idx = _investors.findIndex(function (x) { return x.id === saved.id; });
      if (idx >= 0) _investors[idx] = saved; else _investors.push(saved);
    }
    closeInvestorModal(); render();
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = 'Save Investor';
    status.className = 'vm-status err'; status.textContent = 'Save failed: ' + (err && err.message || 'unknown');
  });
}

function delInvestor(id) {
  var inv = _investors.find(function (x) { return x.id === id; });
  if (!inv) return;
  if (!confirm('Delete "' + (inv.name || 'this investor') + '"? Loans already tagged to them keep their record; this only removes the directory entry.')) return;
  var idx = _investors.findIndex(function (x) { return x.id === id; });
  var removed = _investors.splice(idx, 1)[0];
  render();
  SLA.Investors.del(id).catch(function (err) {
    _investors.splice(idx, 0, removed); render();
    alert('Failed to delete: ' + (err && err.message || 'unknown'));
  });
}
</script>
</body>
</html>
