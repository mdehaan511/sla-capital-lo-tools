<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Complete Borrower Information — SLA Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Deploy 236.326 — print stylesheet for borrower who saves the
   completed long-app to PDF. Strips nav / buttons / progress bar
   so the printed doc is a clean transcript of the answers. */
@media print {
  body { background: #fff !important; padding: 0 !important; }
  .nav, button, .btn, .progress, .progress-bar, .field-actions,
  #auth-gate, [class*="modal-bg"] { display: none !important; }
  .field, .card, .box { box-shadow: none !important; border-color: #ccc !important; page-break-inside: avoid; }
  a { color: inherit !important; text-decoration: none !important; }
}
:root {
  --gold: #C8813A; --gold-mid: #b5712d; --gold-light: rgba(200,129,58,0.08);
  --gold-border: rgba(200,129,58,0.28);
  --dark: #261a36; --bg: #f0ece5;
  --surface: #ffffff; --text: #1a1520; --muted: #7a7488; --border: #ddd8d0;
  --danger: #7c1f1f; --success: #256940;
  --r: 12px; --r-xs: 8px;
}
html, body { height: auto; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Top header ─────────────────────────────────────────── */
.brand-bar { background: var(--dark); padding: 14px 0; }
.brand-bar-inner { max-width: 920px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; gap: 14px; }
.brand-bar h1 { color: var(--gold); font-family: 'Lora', serif; font-size: 16px; font-weight: 600; }
.brand-bar .sub { color: rgba(255,255,255,0.55); font-size: 11px; margin-left: auto; }

/* ── Main container ──────────────────────────────────── */
.page { max-width: 920px; margin: 0 auto; padding: 1.5rem; }
.intro-card { background: var(--surface); border: 1px solid var(--gold-border); border-radius: var(--r); padding: 1.5rem 1.75rem; margin-bottom: 1.25rem; }
.intro-card h2 { font-family: 'Lora', serif; font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.intro-card p { font-size: 13.5px; color: var(--muted); line-height: 1.6; }
.intro-card p strong { color: var(--text); }
.intro-prop { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--gold-mid); margin-top: 8px; padding: 8px 12px; background: var(--gold-light); border-radius: var(--r-xs); display: inline-block; }

/* ── Progress bar ───────────────────────────────────── */
.progress { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 18px; margin-bottom: 1rem; }
.progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.progress-step { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.progress-step.current { color: var(--gold); }
.progress-bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--gold); transition: width 0.3s; }

/* ── Form card ──────────────────────────────────────── */
.form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.5rem 1.75rem; }
.form-card h3 { font-family: 'Lora', serif; font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.form-card h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--gold); margin: 22px 0 12px; padding-top: 14px; border-top: 1px dashed var(--border); }
.form-card h4:first-of-type { padding-top: 0; border-top: none; margin-top: 0; }

.field { margin-bottom: 1rem; }
.field.hidden { display: none !important; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
.field label .req { color: var(--danger); margin-left: 4px; }
.field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.field .err { font-size: 11px; color: var(--danger); margin-top: 4px; min-height: 14px; }
.field input[type=text], .field input[type=email], .field input[type=tel],
.field input[type=number], .field input[type=date], .field select, .field textarea {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--r-xs);
  font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--surface); color: var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
/* Make sure iOS Safari treats date inputs as tappable — guard against
   any stylesheet that would strip native appearance. */
.field input[type=date] { -webkit-appearance: auto; appearance: auto; min-height: 42px; cursor: pointer; }
.field input[readonly] { background: rgba(120,116,136,0.06); cursor: not-allowed; }
.field select:disabled, .field input:disabled, .field textarea:disabled {
  background: rgba(120,116,136,0.08);
  cursor: not-allowed;
  color: var(--text);
  opacity: 1;
}
.locked-field .hint { color: var(--gold-mid, #b5712d); font-style: italic; }
.field textarea { resize: vertical; min-height: 80px; }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .field-row, .field-row-3 { grid-template-columns: 1fr; } }

.radio-group, .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; }
.radio-group label, .checkbox-group label {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border: 1px solid var(--border); border-radius: 20px;
  font-size: 13px; cursor: pointer; transition: all 0.12s;
  background: var(--surface); color: var(--text); margin-bottom: 0;
}
.radio-group label:hover, .checkbox-group label:hover { border-color: var(--gold); }
.radio-group input[type=radio]:checked + span,
.checkbox-group input[type=checkbox]:checked + span { color: var(--gold); font-weight: 600; }
.radio-group label:has(input:checked),
.checkbox-group label:has(input:checked) { background: var(--gold-light); border-color: var(--gold); }

.divider-h { height: 1px; background: var(--border); margin: 18px 0; }

/* ── Footer / actions ───────────────────────────────── */
.actions {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 1.5rem; gap: 14px; flex-wrap: wrap;
}
.btn {
  padding: 11px 22px; border-radius: 26px; border: 1px solid var(--border);
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.12s; background: var(--surface); color: var(--muted);
}
.btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--gold-mid); border-color: var(--gold-mid); }
.btn.success { background: var(--success); border-color: var(--success); color: #fff; }
.btn.success:hover:not(:disabled) { background: #1f5836; }
.btn:disabled { opacity: 0.5; cursor: wait; }

.save-status { font-size: 12px; color: var(--muted); }
.save-status.ok { color: var(--success); }
.save-status.err { color: var(--danger); }

.gate, .complete-msg {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 3rem 2rem; text-align: center; max-width: 540px; margin: 3rem auto;
}
.gate h2, .complete-msg h2 { font-family: 'Lora', serif; font-size: 22px; margin-bottom: 12px; color: var(--text); }
.gate p, .complete-msg p { font-size: 14px; color: var(--muted); line-height: 1.6; }
.complete-msg .check {
  display: inline-flex; align-items: center; justify-content: center;
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(37,105,64,0.12); color: var(--success);
  margin-bottom: 18px;
}

.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--dark); color: #fff; padding: 12px 22px; border-radius: 24px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 1000; }
.toast.show { opacity: 1; }
</style>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="sla-api.js"></script>
<script src="sla-forms.js"></script>
</head>
<body>

<div class="brand-bar">
  <div class="brand-bar-inner">
    <h1>SLA Capital</h1>
    <span class="sub">Secure borrower information form</span>
  </div>
</div>

<!-- Loading / gate / complete states are swapped in/out by JS -->
<div id="root"></div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────
var TOKEN = new URLSearchParams(window.location.search).get('t') || '';
var REVIEW_CLIENT_ID = new URLSearchParams(window.location.search).get('clientId') || '';
var REVIEW_LOAN_ID   = new URLSearchParams(window.location.search).get('loanId')   || '';
var REVIEW_OWNER     = new URLSearchParams(window.location.search).get('owner')    || '';
var REVIEW_MODE      = !TOKEN && !!REVIEW_CLIENT_ID;
// In review mode the page is loaded by the LO from Loan Details. We use
// authed endpoints, show all data including SSN (with reveal toggle),
// and bypass the "completed → thank you screen" wall.
var STATE = {
  page: 1,
  totalPages: 5,
  status: 'pending',
  data: {},
  prefill: {},
  propAddress: '',
  loName: '',
  companies: [], // Item #8: borrower's saved entities for the entity selector
};
var SAVE_TIMER = null;
var SAVING = false;

// ─────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  if (REVIEW_MODE) {
    // LO review mode: wait for Netlify Identity, then load via authed endpoint
    if (typeof netlifyIdentity === 'undefined') {
      showGate('Identity not available', 'The Netlify Identity widget did not load.');
      return;
    }
    // Identity may have already initialized before this listener attaches.
    // If currentUser() returns a value now, use it directly; otherwise wait.
    var cu = null;
    try { cu = netlifyIdentity.currentUser(); } catch (_) {}
    if (cu) {
      loadFromServerAuthed();
    } else {
      netlifyIdentity.on('init', function(user) {
        if (!user) { netlifyIdentity.open(); return; }
        loadFromServerAuthed();
      });
    }
    netlifyIdentity.on('login', function() {
      window.location.reload();
    });
    netlifyIdentity.on('logout', function() {
      // Deploy 236.325 — was reload(), which re-fired the same init
      // handler above → netlifyIdentity.open() → widget → any
      // refresh_token failure could infinite-loop between logout and
      // open. replace('/') mirrors every other LO page and hands
      // control to index.html's login handling.
      window.location.replace('/');
    });
    return;
  }
  if (!TOKEN) {
    showGate('Invalid Link', 'This page requires a valid borrower information link from your loan officer. If you reached this page in error, please contact them for a new link.');
    return;
  }
  loadFromServer();
});

function loadFromServerAuthed() {
  if (!window.SLA || !SLA.BorrowerInfo || !SLA.BorrowerInfo.loadAuth) {
    showGate('SDK not loaded', 'The Loan Officer review SDK did not initialize.');
    return;
  }
  // Pass loanId so the server loads the correct per-loan record
  // (Deploy 168 — was per-client before that).
  var opts = {};
  if (REVIEW_LOAN_ID) opts.loanId = REVIEW_LOAN_ID;
  if (REVIEW_OWNER)   opts.owner  = REVIEW_OWNER;
  SLA.BorrowerInfo.loadAuth(REVIEW_CLIENT_ID, opts).then(function(resp) {
    try {
      STATE.status = resp.status;
      STATE.data = resp.data || {};
      // Hydrate g0_/g1_ fields from the guarantors array so the form's
      // STATE.data has the per-prefix fields the renderers expect.
      hydrateGuarantorFields(STATE.data);
      // Deploy 236.54 — backfill structured city/state/zip from any
      // legacy single-line addresses so the new explicit fields render
      // with the right values for older saves.
      backfillStructuredAddresses(STATE.data);
      STATE.prefill = resp.prefill || {};
      STATE.propAddress = (resp.prefill && resp.prefill.property && resp.prefill.property.address) || '';
      STATE.loName = (resp.prefill && resp.prefill.lo && resp.prefill.lo.name) || '';
      STATE.reviewClientId = resp.clientId;
      STATE.reviewLoanId   = resp.loanId || REVIEW_LOAN_ID || '';
      STATE.reviewOwner    = resp.ownerKey;
      // Deploy 173: remember the application status so the LO's button
      // bar can show "Save edits" + "Submit on behalf of borrower" when
      // the app isn't yet complete, vs just "Save edits" once submitted.
      STATE.reviewStatus   = resp.status || '';
      STATE.companies = (resp.prefill && resp.prefill.companies) || STATE.data.companies || [];
      applyPrefillToData();
      renderApp();
      // Show the LO review banner
      setTimeout(function() {
        var hdr = document.querySelector('.app-header');
        if (hdr && !document.getElementById('reviewBanner')) {
          var b = document.createElement('div');
          b.id = 'reviewBanner';
          b.style.cssText = 'background:rgba(200,129,58,0.12);border:1px solid var(--gold-border);color:var(--gold-mid);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;margin-top:12px';
          b.innerHTML = '<strong>Loan Officer Review.</strong> You are editing this borrower\'s submitted application. Changes save automatically. <span style="font-family:\'DM Mono\',monospace;font-size:11px;opacity:0.8">Status: ' + (STATE.status || 'unknown') + '</span>';
          hdr.appendChild(b);
        }
      }, 100);
    } catch (innerErr) {
      console.error('review-mode render error:', innerErr);
      showGate('Render error', (innerErr && innerErr.message) || 'Failed to render the form. Check the browser console.');
    }
  }).catch(function(err) {
    showGate('Could not load', (err && err.message) || 'Unable to load this borrower record.');
  });
}

// Convert guarantors[0..1] back into g0_/g1_ flat fields so the form
// renderer can pre-populate inputs with prefix-based ids.
function hydrateGuarantorFields(data) {
  if (!data || !Array.isArray(data.guarantors)) return;
  data.guarantors.forEach(function(g, i) {
    if (!g) return;
    var prefix = 'g' + i + '_';
    Object.keys(g).forEach(function(k) {
      // Don't overwrite a field already in data (the LO might be editing)
      if (data[prefix + k] === undefined || data[prefix + k] === '') {
        data[prefix + k] = g[k];
      }
    });
  });
}

// Deploy 236.54 — backfill structured address fields from any saved
// single-line addresses ("123 Main St, Spokane, WA 99224"). Pre-236.54
// long-app saves stored the full formatted address into g.address /
// llcAddress alone, with no city/state/zip companions. The form now
// renders city/state/zip as explicit required fields; without this
// backfill an LO reviewing an older submission would see those fields
// empty and have to refill them. We parse cautiously: only split when
// the string clearly matches "street, city, ST zip" (with state as a
// 2-letter abbreviation and ZIP as 5 or 9 digits) AND city is empty.
function backfillStructuredAddresses(data) {
  if (!data) return;
  // Matches "123 Main St, Spokane, WA 99224" or "..., WA 99224-1234"
  var ADDR_RE = /^(.+?),\s*([^,]+?),\s*([A-Z]{2})\s+(\d{5}(?:-\d{4})?)$/i;
  function splitInto(streetKey, cityKey, stateKey, zipKey) {
    var raw = String(data[streetKey] || '').trim();
    if (!raw) return;
    if (data[cityKey]) return;          // already split
    var m = raw.match(ADDR_RE);
    if (!m) return;
    data[streetKey] = m[1].trim();
    data[cityKey]   = m[2].trim();
    data[stateKey]  = String(m[3]).toUpperCase();
    data[zipKey]    = m[4];
  }
  ['0', '1'].forEach(function(i) {
    var p = 'g' + i + '_';
    splitInto(p + 'address',        p + 'city',        p + 'state',        p + 'zip');
    splitInto(p + 'prevAddress',    p + 'prevCity',    p + 'prevState',    p + 'prevZip');
    splitInto(p + 'mailingAddress', p + 'mailingCity', p + 'mailingState', p + 'mailingZip');
  });
  splitInto('llcAddress', 'llcCity', 'llcAddrState', 'llcZip');
}

function loadFromServer() {
  fetch('/api/borrower-info-load?t=' + encodeURIComponent(TOKEN))
    .then(function(r) { return r.json().then(function(d){ return { ok: r.ok, status: r.status, data: d }; }); })
    .then(function(resp) {
      if (!resp.ok) {
        showGate('Link expired or invalid',
          (resp.data && resp.data.error) || 'This link is no longer valid. Please contact your loan officer for a new link.');
        return;
      }
      STATE.status = resp.data.status;
      STATE.data = resp.data.data || {};
      STATE.prefill = resp.data.prefill || {};
      STATE.propAddress = resp.data.propertyAddress || '';
      STATE.loName = resp.data.loName || '';
      if (STATE.status === 'complete') {
        showComplete();
        return;
      }
      // Apply prefill into data if data is empty for those keys
      applyPrefillToData();
      // Deploy 236.54 — backfill structured city/state/zip from any
      // legacy single-line addresses saved before structured fields
      // existed. Runs after applyPrefillToData so we backfill anything
      // hydrated from prefill too.
      backfillStructuredAddresses(STATE.data);
      renderApp();
    })
    .catch(function(e) {
      showGate('Failed to load', 'Could not reach the server. Please check your internet connection and try again.');
    });
}

function applyPrefillToData() {
  var d = STATE.data;
  var pf = STATE.prefill;
  // Borrower contact
  if (pf.borrower) {
    if (!d.borrowerFirstName) d.borrowerFirstName = pf.borrower.firstName || '';
    if (!d.borrowerLastName)  d.borrowerLastName  = pf.borrower.lastName || '';
    if (!d.borrowerEmail)     d.borrowerEmail     = pf.borrower.email || '';
    if (!d.borrowerPhone)     d.borrowerPhone     = pf.borrower.phone || '';
  }
  // Loan type from existing loan record
  if (pf.loan && !d.loanType) {
    var lt = pf.loan.toolType || '';
    var loanProductHint = pf.loan.loanProduct || '';
    // Deploy 236.53 — Transactional Funding is its own loan-product
    // value from apply.html and rides through on the loan record's
    // loanProduct field. Map it through so a prospect who picked
    // "Transactional Funding" on the short form lands on the right
    // long-app block without having to re-select.
    if (lt === 'transactional' || loanProductHint === 'transactional') {
      d.loanType = 'transactional';
    } else if (lt === 'rtl') d.loanType = 'fix_flip';
    else if (lt === 'dscr') d.loanType = 'dscr';
  }
  // Loan purpose: derive purchase-vs-refi for DSCR (item #4 + #14)
  if (pf.loan && pf.loan.loanPurpose && !d.dscrPurchaseRefi) {
    var lp = pf.loan.loanPurpose;
    if (lp === 'refi_co')        d.dscrPurchaseRefi = 'refinance';
    else if (lp === 'refi_rt')   d.dscrPurchaseRefi = 'refinance';
    else if (lp === 'refinance') d.dscrPurchaseRefi = 'refinance';
    else if (lp === 'cashout')   d.dscrPurchaseRefi = 'refinance';
    else if (lp === 'purchase')  d.dscrPurchaseRefi = 'purchase';
  }
  // Property
  if (pf.property) {
    if (!d.propertyAddress) d.propertyAddress = pf.property.address || '';
    if (!d.propertyType)    d.propertyType    = mapPropType(pf.property.propType);
    if (!d.bedrooms)        d.bedrooms        = pf.property.bedrooms || '';
    if (!d.bathrooms)       d.bathrooms       = pf.property.bathrooms || '';
    if (!d.sqft)            d.sqft            = pf.property.sqft || '';
  }
  // Loan-specific
  if (pf.loan) {
    if (!d.purchasePrice && pf.loan.purchasePrice) d.purchasePrice = pf.loan.purchasePrice;
    if (!d.arv && pf.loan.arv)                     d.arv = pf.loan.arv;
    if (!d.renoCost && pf.loan.rehabBudget)        d.renoCost = pf.loan.rehabBudget;
    // Item #4: when LO has overridden the loan amount on Loan Details
    // (loanAmtLocked=true), FORCE the requested loan field to that value
    // even if the borrower previously typed something. The override is
    // authoritative once set.
    if (pf.loan.loanAmtLocked && pf.loan.loanAmt) {
      if (d.loanType === 'fix_flip')      d.requestedLoanFF            = pf.loan.loanAmt;
      if (d.loanType === 'dscr')          d.requestedLoanDSCR          = pf.loan.loanAmt;
      // Deploy 236.53 — transactional uses its own requested-loan key.
      if (d.loanType === 'transactional') d.requestedLoanTransactional = pf.loan.loanAmt;
    } else {
      // No override: only fill if empty
      if (!d.requestedLoanFF && d.loanType === 'fix_flip') {
        if (pf.loan.maxLoan)        d.requestedLoanFF = pf.loan.maxLoan;
        else if (pf.loan.loanAmt)   d.requestedLoanFF = pf.loan.loanAmt;
      }
      if (!d.requestedLoanDSCR && pf.loan.loanAmt && d.loanType === 'dscr') {
        d.requestedLoanDSCR = pf.loan.loanAmt;
      }
      // Deploy 236.53 — transactional prefill from short-app loanAmt
      // (or the transactional amount captured by the RTL sizer if the
      // LO pre-priced it). loanAmt is the canonical field on the loan
      // record after a transactional sizer save.
      if (!d.requestedLoanTransactional && d.loanType === 'transactional') {
        if (pf.loan.loanAmt)              d.requestedLoanTransactional = pf.loan.loanAmt;
        else if (pf.loan.transactionalAmt) d.requestedLoanTransactional = pf.loan.transactionalAmt;
      }
    }
    // Item #9: project description from short app → long app
    if (!d.planDescription && pf.loan.projectDescription) d.planDescription = pf.loan.projectDescription;
    if (!d.currentValue && pf.loan.propValue) d.currentValue = pf.loan.propValue;
    if (!d.currentRent && pf.loan.rent)       d.currentRent = pf.loan.rent;
    if (!d.dscrCloseDate && pf.loan.fundingDate) d.dscrCloseDate = pf.loan.fundingDate;
    if (!d.ffCloseDate && pf.loan.fundingDate)   d.ffCloseDate = pf.loan.fundingDate;
    // Deploy 236.53 — transactional close date prefill from short app.
    if (!d.transactionalCloseDate && pf.loan.fundingDate) d.transactionalCloseDate = pf.loan.fundingDate;
    // Item #4: current loan amount for refinances (matches field name `currentLoanAmount`)
    if (!d.currentLoanAmount && pf.loan.currentLoanAmt) d.currentLoanAmount = pf.loan.currentLoanAmt;
    // Item #15: rental type — short app uses 'rentalType' (ltr/str/other),
    // long app uses 'rentalKind' with same values
    if (!d.rentalKind && pf.loan.rentalType) d.rentalKind = pf.loan.rentalType;
    // Item #5: annualized expenses derived from monthly values on the loan
    if (!d.annualTaxes     && pf.loan.annualTaxes)     d.annualTaxes     = pf.loan.annualTaxes;
    if (!d.annualInsurance && pf.loan.annualInsurance) d.annualInsurance = pf.loan.annualInsurance;
    if (!d.annualHOA       && pf.loan.annualHOA)       d.annualHOA       = pf.loan.annualHOA;
  }

  // ── Item #6: Guarantor 1 prefill ────────────────────────
  // Mirror borrower contact into G1 by default. Then layer on any saved
  // borrower-profile fields (DOB, FICO, marital, citizenship, address)
  // from prior loan applications stored on the client record.
  // NOTE: the form uses ZERO-indexed prefixes — Guarantor #1 = g0_, #2 = g1_.
  if (pf.borrower) {
    if (!d.g0_firstName) d.g0_firstName = pf.borrower.firstName || '';
    if (!d.g0_lastName)  d.g0_lastName  = pf.borrower.lastName  || '';
    if (!d.g0_email)     d.g0_email     = pf.borrower.email     || '';
    if (!d.g0_phone)     d.g0_phone     = pf.borrower.phone     || '';
    if (!d.g0_dob && pf.borrower.dob)             d.g0_dob       = pf.borrower.dob;
    if (!d.g0_fico && pf.borrower.fico)           d.g0_fico      = pf.borrower.fico;
    if (!d.g0_marital && pf.borrower.maritalStatus) d.g0_marital = pf.borrower.maritalStatus;
    if (!d.g0_usCitizen && pf.borrower.usCitizen) d.g0_usCitizen = pf.borrower.usCitizen;
    if (pf.borrower.homeAddress) {
      var ha = pf.borrower.homeAddress;
      if (!d.g0_address && ha.street) d.g0_address = ha.street;
      if (!d.g0_city    && ha.city)   d.g0_city    = ha.city;
      if (!d.g0_state   && ha.state)  d.g0_state   = ha.state;
      if (!d.g0_zip     && ha.zip)    d.g0_zip     = ha.zip;
    }
    // Item #5: experience metrics (flips, rentals) on the borrower profile
    if (!d.g0_flips    && pf.borrower.flips)    d.g0_flips    = pf.borrower.flips;
    if (!d.g0_rentals  && pf.borrower.rentals)  d.g0_rentals  = pf.borrower.rentals;
  }

  // ── Item #8: Companies — load borrower's saved entities ──
  // Stash on STATE for the entity selector to pick from. If exactly one
  // entity exists, auto-select it and pre-fill the LLC fields.
  STATE.companies = (pf.companies && pf.companies.length) ? pf.companies.slice() : [];
  if (!d.entityChoice && STATE.companies.length === 1) {
    var only = STATE.companies[0];
    d.entityChoice = only.id;
    d.hasLLC = 'yes';
    if (!d.llcName)  d.llcName  = only.name  || '';
    if (!d.llcState) d.llcState = only.state || '';
    if (!d.llcEIN)   d.llcEIN   = only.ein   || '';
    if (!d.llcAddress) d.llcAddress = only.address || '';
    if (!d.llcCity)    d.llcCity    = only.city || '';
    if (!d.llcAddrState) d.llcAddrState = only.addrState || '';
    if (!d.llcZip)    d.llcZip    = only.zip || '';
  }
  // Item #9: who they're working with — auto-set from LO profile and lock
  if (pf.lo && pf.lo.name && !d.workingWith) {
    var loName = String(pf.lo.name).toLowerCase();
    // Map known LO display names → dropdown values; fall back to a "lo_unknown"
    // sentinel we add to the option list so unrecognized LOs still display.
    if      (loName.indexOf('chance') >= 0) d.workingWith = 'chance';
    else if (loName.indexOf('mike')   >= 0) d.workingWith = 'mike';
    else if (loName.indexOf('dan')    >= 0) d.workingWith = 'dan';
    else if (loName.indexOf('jeremy') >= 0) d.workingWith = 'jeremy';
    else d.workingWith = 'lo_assigned'; // generic value — UI shows the LO name
  }
}

function showComplete(opts) {

// ─────────────────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────────────────
function renderApp() {
  var pct = Math.round((STATE.page / STATE.totalPages) * 100);
  var html =
    '<div class="page">' +
      '<div class="intro-card">' +
        '<h2>Complete your borrower information</h2>' +
        '<p>Your loan officer ' + (STATE.loName ? '<strong>' + escH(humanize(STATE.loName)) + '</strong> ' : '') +
        'has requested the additional information below to finalize your loan application. ' +
        '<strong>Your progress saves automatically</strong> — you can close this page and come back any time within 14 days.</p>' +
        (STATE.propAddress ? '<div class="intro-prop">📍 ' + escH(STATE.propAddress) + '</div>' : '') +
      '</div>' +
      '<div class="progress">' +
        '<div class="progress-row">' +
          pageTitleHtml() +
          '<span class="progress-step current">Step ' + STATE.page + ' of ' + STATE.totalPages + '</span>' +
        '</div>' +
        '<div class="progress-bar"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<div class="form-card" id="formCard">' + renderPage() + '</div>' +
      '<div class="actions">' +
        '<div>' +
          (STATE.page > 1 ? '<button class="btn" onclick="goPrev()">← Back</button>' : '') +
        '</div>' +
        '<div class="save-status" id="saveStatus">' +
          (STATE.data && Object.keys(STATE.data).length ? 'Last saved: just now' : '') +
        '</div>' +
        '<div>' +
          (STATE.page < STATE.totalPages
            ? '<button class="btn primary" onclick="goNext()">Next →</button>'
            // Deploy 173/179: at the LAST page in REVIEW_MODE (LO is
            // filling on behalf of the borrower) we show the LO action
            // buttons. For the BORROWER path on the last page we show
            // NOTHING here — the inline signing UI on page 5 handles
            // its own submit button so the LO/borrower paths can
            // diverge cleanly.
            : (REVIEW_MODE
                ? (STATE.reviewStatus === 'complete'
                    ? '<button class="btn success" onclick="submitFinal()">Save edits</button>'
                    : '<button class="btn" onclick="submitFinal()" style="margin-right:8px">Save edits</button>' +
                      '<button class="btn success" onclick="submitOnBehalf()">Submit on behalf of borrower</button>')
                : '' // borrower: page-5's own Sign Application button handles submit
              )
          ) +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById('root').innerHTML = html;
  bindAutoSave();
  // Deploy 182: re-run sla-forms.js bindings on every render so dynamic
  // inputs created by goNext()/goPrev() get the Google Places
  // Autocomplete attached + money/phone/SSN/EIN masks re-applied. The
  // initial bindRoot() at boot only sees inputs that exist at boot
  // time, which on this form is just page 1\u2019s inputs — every other
  // page\u2019s autocomplete fields would never bind without this. The
  // address validator at sign time rejects partial addresses, so a
  // missing autocomplete on page 2/4 becomes a hard submit blocker.
  if (window.SLAForms && SLAForms.reformatExisting) {
    SLAForms.reformatExisting(document);
  }
  // Deploy 179: fetch and paint the ESIGN consent text when the
  // borrower lands on page 5. No-op in REVIEW_MODE.
  if (STATE.page === STATE.totalPages && !REVIEW_MODE) {
    loadEsignConsent();
  }
}

function pageTitleHtml() {
  var titles = {
    1: 'Loan & Contact',
    2: 'Property',
    3: 'Loan Details',
    4: 'Vesting & Guarantors',
    5: 'Review & Sign',
  };
  return '<span class="progress-step">' + escH(titles[STATE.page] || '') + '</span>';
}

function renderPage() {
  if (STATE.page === 1) return renderPage1();

  if (STATE.page === 3) return renderPage3();

  if (STATE.page === 5) return renderPage5();
  return '';
}

        field('requestedLoanFF', 'Requested Loan Amount',         'number', { required: true, money: true }) +
      '</div>' +
      field('planDescription', 'Description of plan for the project', 'textarea', { required: true }) +
      field('exitStrategy', 'Planned Exit Strategy', 'radio', {
        required: true,
        options: [
          { v: 'sell',      l: 'Sell' },
          { v: 'refi',      l: 'Refinance' },
          { v: 'cash',      l: 'Pay off in Cash' },
        ],
      }) +
      field('ffCloseDate',  'Desired Close Date', 'date', { required: true });
  }

  if (lt === 'dscr') {
    html += '<h4>DSCR loan</h4>' +
      field('dscrPurchaseRefi', 'Is this a Purchase or Refinance?', 'radio', {
        required: true,
        onchange: 'render()',
        options: [
          { v: 'purchase',   l: 'Purchase' },
          { v: 'refinance',  l: 'Refinance' },
        ],
      });

    if (isPurchase) {
      html += '<div class="field-row">' +
        field('purchasePrice', 'Purchase Price', 'number', { required: true, money: true }) +
        field('requestedLoanDSCR', 'Requested Loan Amount', 'number', { required: true, money: true }) +
        '</div>' +
        field('dscrCloseDate', 'Desired Close Date', 'date', { required: true });

  if (lt === 'construction') {
    html += '<h4>New construction</h4>' +
      field('ownsLand', 'Do you already own the land?', 'radio', {
        required: true,
        onchange: 'render()',
        options: [{ v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }],
      }) +

        ? field('landDebt', 'Existing debt on the land', 'number', { required: true, money: true })
        : field('landPurchasePrice', 'Land Purchase Price', 'number', { required: true, money: true })
      ) +
      '<div class="field-row">' +
        field('buildBudget',     'Budgeted Build Cost',       'number', { required: true, money: true }) +
        field('estCompleteValue','Estimated Completion Value','number', { required: true, money: true }) +
      '</div>' +
      '<div class="field-row">' +
        field('requestedLoanNC', 'Requested Loan Amount', 'number', { required: true, money: true }) +
        field('ncCloseDate',     'Desired Close Date',     'date',   { required: true }) +
      '</div>' +
      '<div class="field-row">' +
        field('numNewBuilds36',  '# of New Builds completed in last 36 months', 'number', { required: true }) +
        field('cashLiquidity',   'Current Cash Liquidity', 'number', { required: true, money: true }) +
        '</div>' +
      field('hasPermits', 'Do you have approved entitlements, plans, and permits?', 'radio', {
        required: true,
        options: [
          { v: 'yes',  l: 'Yes' },
          { v: 'no',   l: 'No' },
          { v: 'some', l: 'Have some but not all' },
        ],
      });
  }

  // Deploy 236.53 — Transactional Funding block. Same-day-close /
  // same-day-repay short-term loan, so the long-form questionnaire
  // skips fix-flip / DSCR rental / construction sections (none fire
  // because the showFlips / showRentals guards key off other lt
  // values). We collect just the loan amount, planned close date,
  // and a brief purpose so the LO has enough context to underwrite.
  if (lt === 'transactional') {
    html += '<h4>Transactional funding details</h4>' +
      '<div class="field-row">' +

        field('transactionalCloseDate',     'Desired Close Date',    'date',   { required: true }) +
      '</div>' +

        hint: 'For example: "Same-day double-close on a wholesale assignment" or "Bridge funds for a 1-day rehab purchase before refinance."',
