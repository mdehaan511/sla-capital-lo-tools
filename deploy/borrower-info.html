        opts.push({ v: c.id, l: c.name + (c.state ? ' (' + c.state + ')' : '') });
      });
      opts.push({ v: '__new', l: '+ Add new entity' });
      html += field('entityChoice', 'Vesting entity', 'select', {
        options: opts,
        onchange: 'onEntityChoice()',
        hint: 'Select an existing entity or add a new one.',
      });
    }

    html += '<div class="field-row">' +
      field('llcName',  'Name of LLC',          'text', { required: true }) +
      field('llcState', 'State LLC is registered in', 'select', { required: true, options: stateOptions() }) +
      '</div>' +
      field('llcEIN', 'Vesting Entity EIN', 'text', { placeholder: 'XX-XXXXXXX', mask: 'ein' }) +
      // Deploy 236.54 — entity address now collects street + city +
      // state + zip as explicit separate fields. Companion-mode
      // autocomplete on the street input fills the others when the
      // borrower picks from the Google dropdown; when they type
      // manually each field is independently required so we can't
      // accept a partial address. Note: the entity-address state field
      // is `llcAddrState` to distinguish from `llcState` above (which
      // is the state of LLC REGISTRATION, not the registered address).
      addressBlock({
        streetName:  'llcAddress',
        streetLabel: 'Entity registered street address',
        streetPlaceholder: '500 Main St',
        cityName:    'llcCity',
        stateName:   'llcAddrState',
        zipName:     'llcZip',
        autocomplete: 'llc',
        required: true,
      });
  }

  html +=
    '<h4>Guarantors</h4>' +
    field('numGuarantors', 'How many guarantors are there?', 'radio', {
      required: true,
      onchange: 'render()',
      // Deploy 236.83 — 3 and 4 added. Each secondary guarantor
      // gets their own signing link (mirrors the 2-borrower flow).
      options: [{ v: '1', l: '1' }, { v: '2', l: '2' }, { v: '3', l: '3' }, { v: '4', l: '4' }],
      hint: 'Note: all individuals with more than 20% ownership of an LLC must be a guarantor.',
    });

  // Guarantor 1 — always rendered.
  html += renderGuarantor(0, 'Guarantor #1');

  // Guarantors 2-4 — conditional on the radio. renderGuarantor(idx)
  // is generic, so we just include more sections as the count grows.
  var n = parseInt(numGuarantors, 10) || 1;
  if (n >= 2) html += renderGuarantor(1, 'Guarantor #2');
  if (n >= 3) html += renderGuarantor(2, 'Guarantor #3');
  if (n >= 4) html += renderGuarantor(3, 'Guarantor #4');

  return html;
}

function renderGuarantor(idx, label) {
  var d = STATE.data;
  var prefix = 'g' + idx + '_';
  var g = (d.guarantors && d.guarantors[idx]) || {};
  // Mirror nested g[idx] values to flat data keys for the form to read
  Object.keys(g).forEach(function(k) {
    if (d[prefix + k] === undefined) d[prefix + k] = g[k];
  });

  var lt = d.loanType || '';
  var showFlips   = lt === 'fix_flip' || lt === 'construction';
  var showRentals = lt === 'dscr' || lt === 'dscr_2nd';

  // Deploy 236.127 — additional guarantors (idx >= 1) only need
  // name / email / phone / ownership at application time. The rest
  // (DOB / credit / SSN / address / 2yr / mailing / marital /
  // citizenship / experience / declarations) is collected later via
  // an emailed sub-form link (per-guarantor invite system shipping
  // in 236.128/129). Primary guarantor (idx === 0) keeps all fields
  // required as before.
  var isAdditional = idx >= 1;
  var subFormHintHtml = isAdditional
    ? '<div class="hint" style="margin:-4px 0 14px;padding:10px 14px;background:rgba(200,129,58,0.08);border:1px solid rgba(200,129,58,0.28);border-radius:6px;color:#7a5218;font-size:12px">' +
        '<strong>Additional guarantors only need name, email, phone, and % ownership at this step.</strong> ' +
        'A secure link will be emailed to each additional guarantor to collect their DOB, credit, SSN, addresses, citizenship, experience, and declarations. Fields below the divider are optional now and can be left blank.' +
      '</div>'
    : '';
  // The rule of thumb below: required for primary, optional for
  // additional. Phone keeps its prior behavior (already idx === 0).
  var reqIfPrimary = !isAdditional;

  var html = '<h4>' + escH(label) + '</h4>' +
    subFormHintHtml +
    '<div class="field-row">' +
      field(prefix + 'firstName', 'First Name', 'text', { required: true }) +
      field(prefix + 'lastName',  'Last Name',  'text', { required: true }) +
    '</div>' +
    '<div class="field-row">' +
      field(prefix + 'email', 'Email', 'email', { required: true }) +
      field(prefix + 'phone', 'Phone', 'tel',   { required: true, mask: 'phone', placeholder: '(XXX) XXX-XXXX' }) +
    '</div>' +
    (isAdditional ? '<div style="border-top:1px dashed var(--border, #ddd8d0);margin:14px 0 14px;padding-top:6px;font-size:11px;color:var(--muted);font-style:italic">↓ Optional now — collected from this guarantor via emailed sub-form link</div>' : '') +
    '<div class="field-row">' +
      field(prefix + 'dob',  'Date of Birth', 'date', { required: reqIfPrimary }) +
      field(prefix + 'fico', 'Estimated Credit Score', 'text', { required: reqIfPrimary, placeholder: 'e.g. 740' }) +
    '</div>' +
    (REVIEW_MODE
      ? renderSSNReviewField(prefix, idx)
      : field(prefix + 'ssn', 'Social Security Number', 'text', {
          required: reqIfPrimary,
          placeholder: 'XXX-XX-XXXX',
          mask: 'ssn',
          hint: 'Securely encrypted at rest. Used only for the loan application document.',
        })
    ) +
    // Deploy 236.54 — home address is now street + city + state + zip
    // as explicit fields. See addressBlock + Deploy 236.54 comment in
    // the LLC block for the full rationale.
    addressBlock({
      streetName:  prefix + 'address',
      streetLabel: 'Home street address',
      streetPlaceholder: '123 Main St',
      cityName:    prefix + 'city',
      stateName:   prefix + 'state',
      zipName:     prefix + 'zip',
      autocomplete: 'guarantor:' + idx,
      required: reqIfPrimary,
    }) +
    // Deploy 182: 2-year address residency question. If "no", capture
    // the previous address using the same companion-field block.
    field(prefix + 'twoYearAddress', 'Have you lived at this address for 2 or more years?', 'radio', {
      required: reqIfPrimary,
      onchange: 'render()',
      options: [{ v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }],
    }) +
    (d[prefix + 'twoYearAddress'] === 'no'
      ? addressBlock({
          streetName:  prefix + 'prevAddress',
          streetLabel: 'Previous home street address',
          streetPlaceholder: '456 Old St',
          cityName:    prefix + 'prevCity',
          stateName:   prefix + 'prevState',
          zipName:     prefix + 'prevZip',
          autocomplete: 'guarantor:' + idx + ':prev',
          required: reqIfPrimary,
          streetHint: 'Where you lived before your current address. Pick from the dropdown so City / State / ZIP auto-fill.',
        })
      : '') +
    // Mailing address (if different from home).
    field(prefix + 'mailingSameAsHome', 'Mailing address same as home address?', 'radio', {
      required: reqIfPrimary,
      onchange: 'render()',
      options: [{ v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }],
    }) +
    (d[prefix + 'mailingSameAsHome'] === 'no'
      ? addressBlock({
          streetName:  prefix + 'mailingAddress',
          streetLabel: 'Mailing street address',
          streetPlaceholder: '789 PO Box',
          cityName:    prefix + 'mailingCity',
          stateName:   prefix + 'mailingState',
          zipName:     prefix + 'mailingZip',
          autocomplete: 'guarantor:' + idx + ':mail',
          required: reqIfPrimary,
        })
      : '') +
    '<div class="field-row">' +
      field(prefix + 'marital', 'Marital Status', 'radio', {
        required: reqIfPrimary,
        options: [{ v: 'married', l: 'Married' }, { v: 'single', l: 'Not Married' }],
      }) +
      field(prefix + 'usCitizen', 'Is this guarantor a US Citizen?', 'radio', {
        required: reqIfPrimary,
        options: [{ v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }],
      }) +
      '</div>';

  if (showFlips) {
    html += field(prefix + 'flips', '# of flips completed in last 36 months', 'number', { required: reqIfPrimary });
  }
  if (showRentals) {
    html += field(prefix + 'rentals', '# of rental properties currently owned', 'number', { required: reqIfPrimary });
  }

  // Declarations — these answers populate the Declarations table on the
  // generated Loan Application docx. All required Yes/No. usCitizen is
  // collected above next to marital status; the seven below are new.
  // The merge keys in loan-application.mjs are:
  //   g{i}.bankruptcy7yr        → [Decl Bankrupt7yr G{i+1} ...]
  //   g{i}.foreclosure7yr       → [Decl Foreclosure7yr ...]
  //   g{i}.partyToLawsuit       → [Decl Lawsuit ...]
  //   g{i}.delinquentFederalDebt→ [Decl FederalDebtDelinquent ...]
  //   g{i}.obligatedToForeclosed→ [Decl ObligatedForeclosed ...]
  //   g{i}.outstandingJudgments → [Decl OutstandingJudgments ...]
  //   g{i}.intendToOccupy       → [Decl IntendToOccupy ...]
  var yesNo = [{ v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }];
  html += '<h5 style="margin-top:18px;margin-bottom:8px;font-size:14px;color:var(--dark)">Declarations</h5>' +
    '<p class="hint" style="margin-top:-4px;margin-bottom:10px">' +
      (reqIfPrimary
        ? 'All declarations are required. Answer truthfully — these statements form part of your loan application.'
        : 'These declarations will be collected from this guarantor via the emailed sub-form link; optional to fill in now.') +
    '</p>' +
    field(prefix + 'bankruptcy7yr',         'Have you been declared bankrupt in the past 7 years?',                                                                                          'radio', { required: reqIfPrimary, options: yesNo }) +
    field(prefix + 'foreclosure7yr',        'Have you had a property foreclosed upon or given title or deed lieu thereof in the last 7 years?',                                              'radio', { required: reqIfPrimary, options: yesNo }) +
    field(prefix + 'partyToLawsuit',        'Are you a party to a lawsuit?',                                                                                                                 'radio', { required: reqIfPrimary, options: yesNo }) +
    field(prefix + 'delinquentFederalDebt', 'Are you presently delinquent or in default on any Federal debt or any other loan, mortgage, financial obligation, bond, or loan guarantee?',  'radio', { required: reqIfPrimary, options: yesNo }) +
    field(prefix + 'obligatedToForeclosed', 'Have you directly or indirectly been obligated on any loan which resulted in foreclosure?',                                                    'radio', { required: reqIfPrimary, options: yesNo }) +
    field(prefix + 'outstandingJudgments',  'Are there any outstanding judgments against you?',                                                                                              'radio', { required: reqIfPrimary, options: yesNo }) +
    field(prefix + 'intendToOccupy',        'Do you intend to occupy the subject property?',                                                                                                 'radio', { required: reqIfPrimary, options: yesNo });

  // Deploy 182: % ownership of the vesting LLC. Shown only if hasLLC.
  // Stored as a plain number (no % suffix); displayed in the PDF
  // with a % appended. We don\u2019t validate that G1 + G2 sum to 100
  // because LLCs often have additional non-guarantor members.
  if (d.hasLLC === 'yes') {
    html += field(prefix + 'ownership', 'Percent ownership of the vesting LLC', 'number', {
      required: true,
      placeholder: 'e.g. 50',
      hint: 'Enter a number 0-100. All members with more than 20% ownership must be a guarantor.',
    });
  }

  return html;
}

// ─────────────────────────────────────────────────────────
// PAGE 5 — Review & E-Sign (Deploy 179)
// Shows a read-only summary of everything the borrower entered, the
// ESIGN/UETA consent fetched from /api/esign-consent, an explicit
// consent checkbox, and a typed signature field. Submitting on this
// page calls /api/borrower-info-sign which generates the signed PDF,
// stamps the audit trail, emails the borrower a copy, and fires the
// auto-advance to APPROVED. The LO review path (REVIEW_MODE) sees the
// same read-only summary but without the signing UI — the LO uses the
// footer buttons (Save edits / Submit on behalf) instead.
// ─────────────────────────────────────────────────────────
function renderPage5() {
  var d = STATE.data || {};
  var g = (d.guarantors && d.guarantors[0]) || {};
  var g2 = (d.guarantors && d.guarantors[1]) || null;
  var co = (d.companies && d.companies[0]) || null;

  var html = '<h2 style="margin-bottom:8px">Review &amp; Sign</h2>' +
    '<p class="hint" style="margin-bottom:24px">Please review the information you provided. ' +
    'When everything looks correct, read the consent below and sign at the bottom of the page.</p>';

  // Summary card — read-only display of what they entered
  function row(label, value) {
    if (!value && value !== 0) return '';
    return '<div class="rv-row">' +
             '<div class="rv-label">' + escH(label) + '</div>' +
             '<div class="rv-value">' + escH(value) + '</div>' +
           '</div>';
  }

  function summarySection(title, rows) {
    var inner = rows.filter(function(r){return r;}).join('');
    if (!inner) return '';
    return '<div class="rv-section">' +
             '<div class="rv-section-title">' + escH(title) + '</div>' +
             inner +
           '</div>';
  }

  var addrParts = [g.address, g.city, [g.state, g.zip].filter(Boolean).join(' ')].filter(Boolean);
  var homeAddr = addrParts.join(', ');

  html += '<style>' +
    '.rv-section { background:#fff; border:1px solid var(--border, #E4DFD4); border-radius:8px; padding:18px 20px; margin-bottom:14px; }' +
    '.rv-section-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--gold, #C8813A); margin-bottom:10px; border-bottom:1px solid var(--gold-light, #F5E9D8); padding-bottom:6px; }' +
    '.rv-row { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:5px 0; font-size:13px; }' +
    '.rv-row:not(:last-child) { border-bottom:1px dotted #EFEAE0; }' +
    '.rv-label { color:var(--muted, #7A7488); flex:0 0 40%; }' +
    '.rv-value { color:var(--text, #1A1520); font-weight:500; text-align:right; flex:1; word-break:break-word; }' +
    '.esign-consent-box { background:#fff; border:1px solid var(--border, #E4DFD4); border-radius:8px; padding:18px 22px; margin:18px 0; max-height:280px; overflow-y:auto; font-size:12px; line-height:1.55; white-space:pre-wrap; color:#1A1520; font-family:Georgia, serif; }' +
    '.esign-checkbox-row { display:flex; gap:10px; align-items:flex-start; padding:14px 16px; background:var(--gold-light, #F5E9D8); border:1px solid var(--gold-border, #D4A572); border-radius:6px; margin-bottom:18px; }' +
    '.esign-checkbox-row input[type="checkbox"] { margin-top:3px; flex-shrink:0; width:18px; height:18px; cursor:pointer; }' +
    '.esign-checkbox-row label { font-size:13px; line-height:1.5; color:#1A1520; cursor:pointer; }' +
    '.signature-block { background:#fff; border:2px solid var(--gold, #C8813A); border-radius:8px; padding:20px 22px; margin-bottom:18px; }' +
    '.signature-block label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--gold, #C8813A); display:block; margin-bottom:8px; }' +
    '.signature-block input { font-family:"Brush Script MT", "Lucida Handwriting", cursive; font-size:28px; padding:8px 12px; border:0; border-bottom:1.5px solid #888; width:100%; background:transparent; }' +
    '.signature-block input:focus { outline:none; border-bottom-color:var(--gold, #C8813A); }' +
    '.signature-block .signature-note { font-size:11px; color:var(--muted, #7A7488); margin-top:8px; line-height:1.4; }' +
    '.sign-submit-btn { background:var(--gold, #C8813A); color:#fff; border:0; padding:14px 28px; font-size:15px; font-weight:600; border-radius:8px; cursor:pointer; width:100%; transition:all 0.15s; }' +
    '.sign-submit-btn:hover:not(:disabled) { background:#a86b2f; }' +
    '.sign-submit-btn:disabled { opacity:0.5; cursor:not-allowed; }' +
    '</style>';

  html += summarySection('Contact', [
    row('Name',  ((g.firstName || d.borrowerFirstName || '') + ' ' + (g.lastName || d.borrowerLastName || '')).trim()),
    row('Email', g.email || d.borrowerEmail || ''),
    row('Phone', g.phone || d.borrowerPhone || ''),
    row('Date of Birth', g.dob),
    row('Marital Status', g.marital),
    row('Estimated FICO', g.fico),
    row('Home Address', homeAddr),
    row('2+ years at address?', g.twoYearAddress),
    g.twoYearAddress === 'no' ? row('Previous Address', g.prevAddress) : '',
    g.mailingSameAsHome === 'no' ? row('Mailing Address', g.mailingAddress) : '',
  ]);

  html += summarySection('Property', [
    row('Address',       d.propertyAddress),
    row('Property Type', d.propertyType),
    row('Units',         d.numUnits),
    row('Bedrooms',      d.bedrooms),
    row('Bathrooms',     d.bathrooms),
    row('Square Footage', d.sqft),
    row('Flood Zone',    d.floodZone),
  ]);

  html += summarySection('Loan', [
    row('Loan Type',              d.loanType),
    row('Purpose',                d.dscrPurchaseRefi || d.purchaseOrRefi || d.loanPurpose || d.transactionalPurpose),
    row('Requested Loan Amount',  d.requestedLoanFF || d.requestedLoanDSCR || d.requestedLoanNC || d.requestedLoanTransactional || d.requestedLoanAmt || d.loanAmt),
    row('Required Close Date',    d.dscrCloseDate || d.ffCloseDate || d.ncCloseDate || d.transactionalCloseDate),
    row('Purchase Price',         d.purchasePrice),
    row('After-Repair Value',     d.arv),
    row('Rehab Budget',           d.renoCost),
    row('Current Loan Balance',   d.currentLoanAmount || d.currentLoanAmt),
    row('Current Market Value',   d.currentValue),
    row('Current Monthly Rent',   d.currentRent),
    row('Lease Length',           d.leaseLength),
    row('Annual Property Taxes',  d.annualTaxes),
    row('Annual Insurance',       d.annualInsurance),
    row('Annual HOA',             d.annualHOA),
    row('Project Description',    d.planDescription),
    row('Exit Strategy',          d.exitStrategy),
  ]);

  if (g2) {
    var g2Addr = [g2.address, g2.city, [g2.state, g2.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
    html += summarySection('Co-Guarantor', [
      row('Name',  ((g2.firstName || '') + ' ' + (g2.lastName || '')).trim()),
      row('Email', g2.email),
      row('Phone', g2.phone),
      row('Date of Birth', g2.dob),
      row('Home Address', g2Addr),
      row('2+ years at address?', g2.twoYearAddress),
      g2.twoYearAddress === 'no' ? row('Previous Address', g2.prevAddress) : '',
      g2.mailingSameAsHome === 'no' ? row('Mailing Address', g2.mailingAddress) : '',
    ]);
  }

  if (co && (co.name || co.ein) || d.llcName) {
    var coAddr = d.llcAddress || (co && (co.address || ''));
    html += summarySection('Vesting Entity', [
      row('Entity Name',   d.llcName || (co && co.name)),
      row('State',         d.llcState || (co && co.state)),
      row('EIN',           d.llcEIN || (co && co.ein)),
      row('Address',       coAddr),
      row('Guarantor 1 % Ownership', g.ownership ? g.ownership + '%' : ''),
      g2 ? row('Guarantor 2 % Ownership', g2.ownership ? g2.ownership + '%' : '') : '',
    ]);
  }

  // REVIEW_MODE (LO is filling on behalf): show summary only, hide
  // consent + signature UI. LO uses footer buttons instead.
  if (REVIEW_MODE) {
    html += '<div style="background:var(--gold-light, #F5E9D8);border:1px solid var(--gold-border, #D4A572);border-radius:8px;padding:14px 18px;margin-top:10px;font-size:13px;line-height:1.5;color:#1A1520">' +
      '<strong>Review mode.</strong> You\'re viewing this as the loan officer. ' +
      'The borrower\'s e-signature is required to complete this application — use ' +
      '<em>Submit on behalf of borrower</em> below only if you\'ve confirmed the information with them and they\'ve authorized you to submit.' +
    '</div>';
    return html;
  }

  // Borrower path: signing UI

  // Pre-fill signer name from what they entered as borrower name
  var defaultSignerName = ((g.firstName || d.borrowerFirstName || '') + ' ' + (g.lastName || d.borrowerLastName || '')).trim();

  // Deploy 180: four consent forms must be accepted in this single
  // signing event for borrower 1:
  //   1. ESIGN/UETA Consent to Use Electronic Signatures
  //   2. Loan Application Acknowledgement & Agreement (the long
  //      "(1) through (11)" text from the SLA loan app)
  //   3. Authorization to Conduct Prequal Credit & Background Checks
  //   4. Authorization to Release Information
  // Each form has its own consent text box + its own consent
  // checkbox. Borrower 2 (if any) signs their own copy of form (3) via
  // a separate emailed link after borrower 1 finishes here.
  function consentSection(formKey, labelId, boxId, sectionTitle) {
    return '<div class="rv-section" style="margin-top:20px">' +
      '<div class="rv-section-title">' + escH(sectionTitle) + '</div>' +
      '<div id="' + boxId + '" class="esign-consent-box">Loading\u2026</div>' +
    '</div>' +
    '<div class="esign-checkbox-row">' +
      '<input type="checkbox" id="' + formKey + 'Check" onchange="updateSignSubmitState()" />' +
      '<label for="' + formKey + 'Check" id="' + labelId + '">Loading\u2026</label>' +
    '</div>';
  }

  html += consentSection('loanAck', 'loanAckLabel', 'loanAckBox', 'Loan Application Acknowledgement & Agreement');
  html += consentSection('prequal', 'prequalLabel', 'prequalBox', 'Authorization to Conduct Prequal Credit & Background Checks');
  html += consentSection('infoRel', 'infoRelLabel', 'infoRelBox', 'Authorization to Release Information');
  html += consentSection('esign',   'esignLabel',   'esignBox',   'Electronic Signature Consent (ESIGN / UETA)');

  // Co-borrower notice \u2014 Deploy 236.83 generalized to 2/3/4 signers.
  // Lists every secondary guarantor that has at least an email so
  // the borrower knows who's getting a signing link after they sign.
  var nG = parseInt(d.numGuarantors || '1', 10) || 1;
  var secondarySigners = [];
  for (var si = 1; si < nG; si++) {
    var gi = (d.guarantors || [])[si];
    if (gi && (gi.email || '').trim()) {
      var giName = ((gi.firstName || '') + ' ' + (gi.lastName || '')).trim() || ('Co-Guarantor #' + (si + 1));
      secondarySigners.push({ idx: si, name: giName, email: (gi.email || '').trim() });
    }
  }
  if (secondarySigners.length) {
    var lineHtml = secondarySigners.map(function(s) {
      return '<strong>' + escH(s.name) + '</strong> at <strong>' + escH(s.email) + '</strong>';
    }).join(secondarySigners.length === 2 ? ' and ' : ', ');
    // Oxford comma when 3+
    if (secondarySigners.length >= 3) {
      lineHtml = secondarySigners.slice(0, -1).map(function(s) {
        return '<strong>' + escH(s.name) + '</strong> at <strong>' + escH(s.email) + '</strong>';
      }).join(', ') + ', and ' + '<strong>' + escH(secondarySigners[secondarySigners.length - 1].name) + '</strong> at <strong>' + escH(secondarySigners[secondarySigners.length - 1].email) + '</strong>';
    }
    var label = secondarySigners.length === 1 ? 'Co-borrower signature required.' : 'Co-borrower signatures required.';
    html += '<div style="background:var(--gold-light,#F5E9D8);border:1px solid var(--gold-border,#D4A572);border-radius:8px;padding:14px 18px;margin:18px 0;font-size:13px;line-height:1.55;color:#1A1520">' +
      '<strong>' + escH(label) + '</strong><br>' +
      'After you sign, we\u2019ll email ' + lineHtml + ' a link to sign their own credit &amp; background check authorization. ' +
      'The loan application won\u2019t finalize until ' + (secondarySigners.length === 1 ? 'they sign' : 'they all sign') + '. ' +
      'Everyone will then receive the fully-signed PDF.' +
    '</div>';
  }
  var hasCoBorrower = secondarySigners.length > 0;

  html += '<div class="signature-block">' +
    '<label for="signerNameInput">Type your full legal name to sign</label>' +
    '<input type="text" id="signerNameInput" value="' + escAttr(defaultSignerName) + '" ' +
      'oninput="updateSignSubmitState()" autocomplete="off" spellcheck="false" />' +
    '<div class="signature-note">' +
      'By typing your full legal name above and clicking <strong>Sign Application</strong>, ' +
      'you are electronically signing all four forms above. This signature has the same legal effect as a handwritten signature.' +
    '</div>' +
  '</div>';

  html += '<button type="button" class="sign-submit-btn" id="signSubmitBtn" onclick="signApplication()" disabled>' +
    (hasCoBorrower
      ? (secondarySigners.length === 1 ? 'Sign Application & Notify Co-Borrower' : 'Sign Application & Notify Co-Borrowers')
      : 'Sign Application') +
  '</button>';

  html += '<div id="signError" style="color:#9b1d20;font-size:13px;margin-top:14px;text-align:center;display:none"></div>';

  return html;
}

function escAttr(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Page 5 wiring (Deploy 179) ───────────────────────────
var ESIGN_CONSENT_LOADED = null; // {version, text, checkboxLabel}

function loadEsignConsent() {
  if (ESIGN_CONSENT_LOADED) {
    paintEsignConsent();
    return;
  }
  SLA.ESignConsent.fetch().then(function (r) {
    ESIGN_CONSENT_LOADED = r;
    paintEsignConsent();
  }).catch(function (e) {
    // Best-effort fallback if the fetch fails — show a message in any
    // of the consent boxes so the borrower knows what's wrong.
    ['esignBox', 'loanAckBox', 'prequalBox', 'infoRelBox'].forEach(function (id) {
      var b = document.getElementById(id);
      if (b) b.textContent = 'Failed to load consent text. Please refresh the page.';
    });
  });
}

function paintEsignConsent() {
  if (!ESIGN_CONSENT_LOADED) return;
  // Deploy 180: paint all four consent texts + labels into their
  // respective boxes. Fallback to the v1 fields (text/checkboxLabel)
  // if the server hasn't been updated yet.
  var c = ESIGN_CONSENT_LOADED;
  function paint(boxId, labelId, text, label) {
    var b = document.getElementById(boxId);
    var l = document.getElementById(labelId);
    if (b) b.textContent = text || '';
    if (l && label) l.textContent = label;
  }
  paint('esignBox',   'esignLabel',   c.esignText   || c.text          || '', c.esignLabel   || c.checkboxLabel || '');
  paint('loanAckBox', 'loanAckLabel', c.loanAckText || '', c.loanAckLabel || '');
  paint('prequalBox', 'prequalLabel', c.prequalText || '', c.prequalLabel || '');
  paint('infoRelBox', 'infoRelLabel', c.infoReleaseText || '', c.infoReleaseLabel || '');
}

function updateSignSubmitState() {
  var btn = document.getElementById('signSubmitBtn');
  if (!btn) return;
  var nameEl  = document.getElementById('signerNameInput');
  var nameOK = nameEl && nameEl.value.trim().length >= 3;
  // All four checkboxes must be checked
  var allChecked = ['esignCheck', 'loanAckCheck', 'prequalCheck', 'infoRelCheck']
    .every(function (id) {
      var el = document.getElementById(id);
      return el && el.checked;
    });
  btn.disabled = !(nameOK && allChecked);
}

function signApplication() {
  var btn = document.getElementById('signSubmitBtn');
  var errEl = document.getElementById('signError');
  var nameEl = document.getElementById('signerNameInput');
  errEl.style.display = 'none';
  errEl.textContent = '';

  // Re-verify all four consents at click time
  var allChecked = ['esignCheck', 'loanAckCheck', 'prequalCheck', 'infoRelCheck']
    .every(function (id) {
      var el = document.getElementById(id);
      return el && el.checked;
    });
  if (!allChecked) {
    errEl.textContent = 'You must check all four consent boxes above to sign.';
    errEl.style.display = 'block';
    return;
  }
  var signerName = nameEl.value.trim();
  if (signerName.length < 3) {
    errEl.textContent = 'Please type your full legal name to sign.';
    errEl.style.display = 'block';
    return;
  }
  if (!ESIGN_CONSENT_LOADED || !ESIGN_CONSENT_LOADED.version) {
    errEl.textContent = 'Consent text failed to load. Please refresh the page.';
    errEl.style.display = 'block';
    return;
  }

  // Deploy 236.127 — pre-submit guarantor-ownership total check.
  // If the LLC's combined recorded guarantor ownership is < 51%,
  // Diya requires more guarantors before the loan can fund. Give
  // the borrower a clean choice: add the additional guarantors now
  // (lightweight name/email/phone/% only; rest collected later via
  // emailed sub-form link), or submit now and address the gap with
  // their LO before close (Loan Details flags this with a
  // "Check Guarantor Ownership %" banner).
  if (STATE.data.hasLLC === 'yes' && !STATE.data._ownershipDeferAcknowledged) {
    var oTotal = _computeGuarantorOwnershipTotal();
    if (oTotal.any && oTotal.total < 51) {
      _openOwnershipDecisionModal(oTotal, signApplication);
      return; // user picks Now or Later; either resumes the flow
    }
  }

  // Deploy 181: address completeness check. Both the property address
  // and each guarantor home address must be full US addresses with a
  // city, state, and ZIP — these are needed for the loan application
  // PDF, the credit pull, and the title work. We use a permissive
  // pattern (at least two commas + a 2-letter state + 5-digit ZIP),
  // since that\u2019s what Google\u2019s formatted_address returns when the
  // borrower picks an autocomplete suggestion. If the borrower typed
  // a partial address without using the picker, we surface it here
  // rather than after the signing event.
  // Deploy 183: more permissive address validation. Replaced the
  // strict "street, city, ST zip" regex from Deploy 181 with a
  // component-based check that accepts real-world variations:
  //   - Apt prefixes, extra commas (e.g. "Spokane, WA, 99224")
  //   - Missing comma between city and state ("Palm Harbor FL 34684")
  //   - PO Boxes, rural routes
  //   - Trailing ", USA" or ", USA." (Google sometimes returns it)
  // Requires:
  //   - At least one comma (structural minimum)
  //   - A 5-digit ZIP (optionally +4) at the end
  //   - A valid 2-letter US state code adjacent to the ZIP
  function looksLikeFullAddress(s) {
    if (!s) return false;
    var v = String(s).trim().replace(/,?\s*USA\.?$/i, '').trim();
    if (v.indexOf(',') < 0) return false;
    if (!/\b\d{5}(-\d{4})?\s*$/.test(v)) return false;
    var US_STATES = 'AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC';
    var stRe = new RegExp('(?:\\b|^)(' + US_STATES + ')(?:,\\s*|\\s+)\\d{5}(-\\d{4})?\\s*$', 'i');
    return stRe.test(v);
  }

  // Helper: HTML-escape a value so we can safely echo it back to the
  // user in the error message (showing them what we got vs. what we expect).
  function _escAddrShow(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function _fixBtn(pageNum, fieldId) {
    // A button that jumps to the right page and focuses the offending
    // field. Skips validation (we know the borrower is partway through
    // the form — they don\u2019t need a "fill in required fields" toast
    // blocking them from going back).
    return ' <button type="button" onclick="goToPageAndFocus(' + pageNum + ',&quot;' + fieldId + '&quot;)" ' +
      'style="background:var(--gold,#C8813A);color:#fff;border:0;padding:6px 12px;border-radius:4px;font-weight:600;font-size:12px;cursor:pointer;margin-left:6px">' +
      'Fix it &rarr;' +
    '</button>';
  }

  var d = STATE.data;
  if (!looksLikeFullAddress(d.propertyAddress)) {
    errEl.innerHTML = 'The subject <strong>property address</strong> is missing the city, state, or ZIP. ' +
      (d.propertyAddress ? 'We have: <em>' + _escAddrShow(d.propertyAddress) + '</em>. ' : '') +
      'Tap the field on Page 2 and pick a complete address from the autocomplete dropdown.' +
      _fixBtn(2, 'f_propertyAddress');
    errEl.style.display = 'block';
    return;
  }
  // Deploy 236.54 \u2014 validation against explicit street + city + state +
  // zip companion fields. Previously this called looksLikeFullAddress()
  // on a single concatenated address string, which broke when the
  // borrower typed manually and skipped the autocomplete dropdown.
  // Now each component is required separately.
  function _gv(g, i, key) {
    return (g && g[key]) || d['g' + i + '_' + key] || '';
  }
  function _addrIncomplete(g, i, prefix) {
    // prefix is '' for home, 'prev' for previous, 'mailing' for mailing.
    // The street key is 'address' / 'prevAddress' / 'mailingAddress';
    // city/state/zip follow the same convention.
    var streetKey = prefix ? (prefix + 'Address') : 'address';
    var cityKey   = prefix ? (prefix + 'City')    : 'city';
    var stateKey  = prefix ? (prefix + 'State')   : 'state';
    var zipKey    = prefix ? (prefix + 'Zip')     : 'zip';
    var s = String(_gv(g, i, streetKey) || '').trim();
    var c = String(_gv(g, i, cityKey)   || '').trim();
    var st = String(_gv(g, i, stateKey) || '').trim();
    var z = String(_gv(g, i, zipKey)    || '').trim();
    if (!s && !c && !st && !z) return null;   // entirely empty \u2014 let the per-field required check handle it
    var missing = [];
    if (!s) missing.push('street');
    if (!c) missing.push('city');
    if (!st) missing.push('state');
    if (!z) missing.push('ZIP');
    return missing.length ? missing : null;
  }
  var guarantors = (d.guarantors || []);
  for (var i = 0; i < guarantors.length; i++) {
    var g = guarantors[i] || {};
    if (!g.address && !d['g' + i + '_address']
        && !g.city && !d['g' + i + '_city']) continue; // empty guarantor
    var miss = _addrIncomplete(g, i, '');
    if (miss) {
      errEl.innerHTML = '<strong>Guarantor ' + (i + 1) + '\u2019s home address</strong> is missing: ' +
        '<em>' + miss.join(', ') + '</em>. ' +
        'Open Page 4 and fill in each field.' +
        _fixBtn(4, 'f_g' + i + '_address');
      errEl.style.display = 'block';
      return;
    }
    // Deploy 182: previous address required when < 2 years at current.
    var twoYr = g.twoYearAddress || d['g' + i + '_twoYearAddress'];
    if (twoYr === 'no') {
      var missPrev = _addrIncomplete(g, i, 'prev');
      if (missPrev) {
        errEl.innerHTML = '<strong>Guarantor ' + (i + 1) + '\u2019s previous address</strong> is missing: ' +
          '<em>' + missPrev.join(', ') + '</em>. ' +
          'Open Page 4 and fill in each field.' +
          _fixBtn(4, 'f_g' + i + '_prevAddress');
        errEl.style.display = 'block';
        return;
      }
    }
    // Mailing address required when different from home.
    var mailSame = g.mailingSameAsHome || d['g' + i + '_mailingSameAsHome'];
    if (mailSame === 'no') {
      var missMail = _addrIncomplete(g, i, 'mailing');
      if (missMail) {
        errEl.innerHTML = '<strong>Guarantor ' + (i + 1) + '\u2019s mailing address</strong> is missing: ' +
          '<em>' + missMail.join(', ') + '</em>. ' +
          'Open Page 4 and fill in each field.' +
          _fixBtn(4, 'f_g' + i + '_mailingAddress');
        errEl.style.display = 'block';
        return;
      }
    }
  }
  // Deploy 236.54 \u2014 also validate the LLC address when the borrower
  // indicated an entity. Same component check as guarantor addresses.
  if (d.hasLLC === 'yes') {
    var llcStreet = String(d.llcAddress  || '').trim();
    var llcCity   = String(d.llcCity     || '').trim();
    var llcAddrSt = String(d.llcAddrState|| '').trim();
    var llcZip    = String(d.llcZip      || '').trim();
    if (llcStreet || llcCity || llcAddrSt || llcZip) {
      var llcMiss = [];
      if (!llcStreet) llcMiss.push('street');
      if (!llcCity)   llcMiss.push('city');
      if (!llcAddrSt) llcMiss.push('state');
      if (!llcZip)    llcMiss.push('ZIP');
      if (llcMiss.length) {
        errEl.innerHTML = '<strong>Entity registered address</strong> is missing: ' +
          '<em>' + llcMiss.join(', ') + '</em>. ' +
          'Open Page 4 and fill in each field.' +
          _fixBtn(4, 'f_llcAddress');
        errEl.style.display = 'block';
        return;
      }
    }
  }

  btn.disabled = true;
  btn.textContent = 'Signing\u2026';

  // First, save the latest form data so the server has whatever's on
  // screen before it generates the signed PDF. The auto-save in the
  // form may not have caught the last edit.
  var dataToSave = packDataForSave();
  fetch('/api/borrower-info-save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ t: TOKEN, data: dataToSave }),
  }).then(function () {
    // Optional geolocation
    return new Promise(function (resolve) {
      if (!navigator.geolocation) return resolve('');
      var timed = false;
      var to = setTimeout(function () { timed = true; resolve(''); }, 3000);
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          if (timed) return;
          clearTimeout(to);
          var g = pos.coords;
          resolve(g.latitude.toFixed(4) + ',' + g.longitude.toFixed(4) +
                  ' (\u00B1' + Math.round(g.accuracy || 0) + 'm)');
        },
        function () { clearTimeout(to); resolve(''); },
        { enableHighAccuracy: false, timeout: 2500, maximumAge: 60000 }
      );
    });
  }).then(function (geoloc) {
    var opts = { consentVersion: ESIGN_CONSENT_LOADED.version };
    if (geoloc) opts.geolocation = geoloc;
    return SLA.BorrowerInfo.sign(TOKEN, signerName, opts);
  }).then(function (resp) {
    // Differentiate the thank-you message based on whether a co-borrower
    // still needs to sign. The server returns awaitingBorrower2: true if
    // borrower 2 has been sent their own link.
    showComplete({
      signed: true,
      signedAt: resp.signedAt,
      emailedBorrower: resp.emailedBorrower,
      awaitingBorrower2: resp.awaitingBorrower2,
      emailedCoBorrower: resp.emailedCoBorrower,
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }).catch(function (err) {
    btn.disabled = false;
    btn.textContent = 'Sign Application';
    var msg = (err && err.message) || 'Signing failed. Please try again.';
    errEl.textContent = msg;
    errEl.style.display = 'block';
  });
}


// ─────────────────────────────────────────────────────────
// Field render helper
// ─────────────────────────────────────────────────────────
function field(name, label, type, opts) {
  opts = opts || {};
  var val = STATE.data[name];
  if (val === undefined || val === null) val = '';
  var req = opts.required ? ' <span class="req">*</span>' : '';
  var hint = opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '';
  var onch = opts.onchange ? ' onchange="onFieldChange(this); ' + opts.onchange + '"' : ' onchange="onFieldChange(this)"';
  var oninp = ' oninput="onFieldChange(this)"';
  var ph = opts.placeholder ? ' placeholder="' + escAttr(opts.placeholder) + '"' : '';
  var step = opts.step ? ' step="' + opts.step + '"' : '';
  // Locked = read-only display, value still posted on save (uses hidden input)
  var locked = opts.locked === true;
  var lockedAttr = locked ? ' disabled aria-disabled="true" title="Set by your loan officer"' : '';
  var html = '<div class="field' + (locked ? ' locked-field' : '') + '" data-name="' + escAttr(name) + '">' +
    '<label for="f_' + escAttr(name) + '">' + escH(label) + req + '</label>';

  if (type === 'radio') {
    html += '<div class="radio-group">';
    (opts.options || []).forEach(function(o) {
      var checked = (String(val) === String(o.v)) ? ' checked' : '';
      html += '<label><input type="radio" name="' + escAttr(name) + '" value="' + escAttr(o.v) + '"' + checked + onch + (locked ? ' disabled' : '') + '><span>' + escH(o.l) + '</span></label>';
    });
    html += '</div>';
  } else if (type === 'select') {
    html += '<select id="f_' + escAttr(name) + '" name="' + escAttr(name) + '"' + onch + lockedAttr + '>';
    (opts.options || []).forEach(function(o) {
      var sel = (String(val) === String(o.v)) ? ' selected' : '';
      html += '<option value="' + escAttr(o.v) + '"' + sel + '>' + escH(o.l) + '</option>';
    });
    html += '</select>';
    if (locked) {
      // Hidden input ensures the value posts on save (disabled selects don't submit)
      html += '<input type="hidden" name="' + escAttr(name) + '_locked" value="' + escAttr(val) + '" data-locked-shadow="' + escAttr(name) + '" />';
    }
  } else if (type === 'textarea') {
    html += '<textarea id="f_' + escAttr(name) + '" name="' + escAttr(name) + '"' + ph + onch + oninp + lockedAttr + '>' + escH(val) + '</textarea>';
  } else {
    var maskAttr = opts.mask ? ' data-sla-mask="' + escAttr(opts.mask) + '"' : '';
    // Build sla-forms.js autocomplete attrs when this field is an address
    // street input. opts.autocomplete is one of: 'property', 'guarantor:0',
    // 'guarantor:1', 'llc'. Each maps to a set of companion field IDs.
    var autoAttr = '';
    if (opts.autocomplete) {
      autoAttr = ' data-sla-autocomplete';
      // Deploy 236.54 — companion-field mode. When opts.companions = {
      // city, state, zip } is set, emit data-sla-ac-* attributes so
      // sla-forms.js writes street into THIS input and city/state/zip
      // into the named companion fields. Without this, the form falls
      // back to single-line formatted_address mode and borrowers who
      // type manually (instead of picking from the dropdown) save a
      // partial address that the PDF + Baseline sync can't break apart.
      // Each companion key must match the underlying field's name
      // (without the 'f_' prefix that the field() helper adds when
      // building the input id).
      if (opts.companions) {
        var co = opts.companions;
        if (co.city)  autoAttr += ' data-sla-ac-city="f_'  + escAttr(co.city)  + '"';
        if (co.state) autoAttr += ' data-sla-ac-state="f_' + escAttr(co.state) + '"';
        if (co.zip)   autoAttr += ' data-sla-ac-zip="f_'   + escAttr(co.zip)   + '"';
      }
    }
    // Money fields render as text+inputmode=decimal so we can format with $ and commas
    if (opts.money) {
      var formatted = (val !== '' && val != null) ? formatMoneyDisplay(val) : '';
      html += '<input type="text" inputmode="decimal" id="f_' + escAttr(name) + '" name="' + escAttr(name) + '"' +
              ' value="' + escAttr(formatted) + '" data-money="1" placeholder="' + (opts.placeholder ? escAttr(opts.placeholder) : '$0') + '"' +
              ' onfocus="moneyFocus(this)" onblur="moneyBlur(this)" oninput="onFieldChange(this)"' +
              lockedAttr + ' />';
    } else {
      html += '<input type="' + type + '" id="f_' + escAttr(name) + '" name="' + escAttr(name) + '" value="' + escAttr(val) + '"' + ph + step + onch + oninp + lockedAttr + maskAttr + autoAttr + ' />';
    }
  }

  html += '<div class="err" id="err_' + escAttr(name) + '"></div>';
  html += hint + '</div>';
  return html;
}

// Deploy 236.54 — addressBlock helper renders a full street/city/state
// /zip row with companion-mode Google Places autocomplete. Replaces the
// single-line address inputs that depended on the borrower picking from
// the dropdown to capture city/state/zip via formatted_address. With
// explicit companion fields:
//   - Picking from the Google dropdown auto-fills street/city/state/zip
//   - Typing manually requires each field to be filled (each is
//     required:true), so we can't accept a partial address
//   - PDF + Baseline sync get clean structured fields directly
//
// opts:
//   streetName        - field key for the street input (e.g. 'g0_address')
//   streetLabel       - label shown above the street input
//   streetPlaceholder - placeholder for the street input
//   streetHint        - optional hint line under the street input
//   cityName, stateName, zipName - field keys for the companion fields
//   autocomplete      - autocomplete bucket name (e.g. 'guarantor:0', 'llc')
//   required          - when true, all four fields are required:true
function addressBlock(opts) {
  opts = opts || {};
  var req = !!opts.required;
  var streetHint = opts.streetHint
    || 'Start typing and pick a suggestion from the dropdown so City / State / ZIP auto-fill. If you type the address manually, fill in each field below.';
  return field(opts.streetName, opts.streetLabel || 'Street address', 'text', {
    required: req,
    placeholder: opts.streetPlaceholder || '123 Main St',
    autocomplete: opts.autocomplete,
    companions: { city: opts.cityName, state: opts.stateName, zip: opts.zipName },
    hint: streetHint,
  }) +
  '<div class="field-row">' +
    field(opts.cityName,  'City',  'text',   { required: req, placeholder: 'City' }) +
    field(opts.stateName, 'State', 'select', { required: req, options: stateOptions() }) +
    field(opts.zipName,   'ZIP',   'text',   { required: req, placeholder: '99201' }) +
  '</div>';
}

function rowFields() {
  var args = Array.prototype.slice.call(arguments);
  return '<div class="field-row">' + args.join('') + '</div>';
}

// ─────────────────────────────────────────────────────────
// Field change → state + auto-save (debounced)
// ─────────────────────────────────────────────────────────
function onFieldChange(el) {
  var name = el.name;
  if (!name) return;
  var val = '';
  if (el.type === 'radio') val = el.value;
  else if (el.type === 'checkbox') val = el.checked;
  else val = el.value;
  // Money fields: store the unformatted numeric value (strip $ and commas).
  // The visible formatted version is restored on blur via moneyBlur.
  if (el.getAttribute && el.getAttribute('data-money') === '1') {
    val = String(val || '').replace(/[^0-9.]/g, '');
  }
  // Apply input mask if requested (#7) — formats SSN, EIN, phone with dashes
  // as user types. We update both the visible input and the saved value.
  var mask = el.getAttribute && el.getAttribute('data-mask');
  if (mask && el.type !== 'radio' && el.type !== 'checkbox') {
    var caret = el.selectionStart;
    var prevLen = val.length;
    var newVal = applyMask(val, mask);
    if (newVal !== val) {
      el.value = newVal;
      try {
        var delta = newVal.length - prevLen;
        if (caret != null) el.setSelectionRange(caret + delta, caret + delta);
      } catch (_) {}
      val = newVal;
    }
  }
  STATE.data[name] = val;
  scheduleAutoSave();
}

// ── Money display helpers (#2) ────────────────────────────
function formatMoneyDisplay(v) {
  if (v === '' || v == null) return '';
  var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
  if (!isFinite(n)) return '';
  var hasDecimal = String(v).indexOf('.') >= 0 && String(v).split('.')[1] !== '';
  return '$' + n.toLocaleString('en-US', {
    minimumFractionDigits: hasDecimal ? 2 : 0,
    maximumFractionDigits: 2,
  });
}
function moneyFocus(el) {
  // Show plain number for editing
  el.value = String(el.value || '').replace(/[^0-9.]/g, '');
}
function moneyBlur(el) {
  var raw = String(el.value || '').replace(/[^0-9.]/g, '');
  if (!raw) { el.value = ''; return; }
  el.value = formatMoneyDisplay(raw);
  // Sync back to STATE in case the user typed and immediately blurred
  if (el.name) STATE.data[el.name] = raw;
}

// Format strings for the three masks we support. Strips non-digits, then
// inserts separators at the right positions. Truncates to mask max length.
function applyMask(s, mask) {
  var digits = String(s || '').replace(/\D/g, '');
  if (mask === 'ssn') {
    digits = digits.slice(0, 9);
    if (digits.length <= 3) return digits;
    if (digits.length <= 5) return digits.slice(0, 3) + '-' + digits.slice(3);
    return digits.slice(0, 3) + '-' + digits.slice(3, 5) + '-' + digits.slice(5);
  }
  if (mask === 'ein') {
    digits = digits.slice(0, 9);
    if (digits.length <= 2) return digits;
    return digits.slice(0, 2) + '-' + digits.slice(2);
  }
  if (mask === 'phone') {
    digits = digits.slice(0, 10);
    if (digits.length <= 3) return digits;
    if (digits.length <= 6) return '(' + digits.slice(0, 3) + ') ' + digits.slice(3);
    return '(' + digits.slice(0, 3) + ') ' + digits.slice(3, 6) + '-' + digits.slice(6);
  }
  return s;
}

function render() {
  // Re-render the form card without losing focus position
  document.getElementById('formCard').innerHTML = renderPage();
  setSaveStatus('Edits not yet saved', '');
  scheduleAutoSave();
  // Re-bind sla-forms helpers (autocomplete, masks, money) on the new DOM.
  // sla-forms.js handles all three via data-sla-* attributes.
  setTimeout(function() {
    if (window.SLAForms && SLAForms.reformatExisting) {
      try { SLAForms.reformatExisting(document.getElementById('formCard')); } catch (e) {}
    }
  }, 50);
}

// LO review-mode SSN cell: shows masked by default with a "Reveal" button.
// Click → switches the input to the plaintext SSN (kept visible until refresh).
function renderSSNReviewField(prefix, idx) {
  var name = prefix + 'ssn';

             'value="' + escAttr(displayValue) + '" data-mask="ssn" data-ssn-real="' + escAttr(ssn) + '" ' +
             'placeholder="XXX-XX-XXXX" autocomplete="off" ' +
             'oninput="onFieldChange(this)" onchange="onFieldChange(this)" />' +
      '<button type="button" onclick="revealSSN(\'' + escAttr(name) + '\', this)" ' +
              'style="padding:8px 14px;font-size:12px;font-weight:600;border:1px solid var(--gold-border);background:var(--gold-light);color:var(--gold-mid);border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap">Reveal</button>' +

function revealSSN(name, btn) {
  var input = document.getElementById('f_' + name);
  if (!input) return;
  var real = input.getAttribute('data-ssn-real') || '';
  if (real) {
    input.value = real;
    btn.textContent = 'Visible';
    btn.disabled = true;
    btn.style.opacity = '0.5';
    btn.style.cursor = 'default';
  }
}

function maskSSN(s) {
  if (!s) return '';
  var d = String(s).replace(/\D/g, '');
  if (d.length < 4) return '';
  return '***-**-' + d.slice(-4);
}

// Item #8: Entity selector — when user picks a saved entity, fill the LLC
// fields. Picking "+ Add new entity" clears the fields so they can type fresh.
function onEntityChoice() {
  var sel = document.getElementById('f_entityChoice');
  if (!sel) return;
  var v = sel.value;
  STATE.data.entityChoice = v;
  if (v === '__new') {
    // Clear LLC fields for the new entity, give it a fresh id
    STATE.data.llcId = 'co_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    STATE.data.llcName = '';
    STATE.data.llcState = '';
    STATE.data.llcEIN = '';
    STATE.data.llcAddress = '';
    STATE.data.llcCity = '';
    STATE.data.llcAddrState = '';
    STATE.data.llcZip = '';
  } else if (v) {
    var c = (STATE.companies || []).find(function(x) { return x.id === v; });
    if (c) {
      STATE.data.llcId = c.id;
      STATE.data.llcName = c.name || '';
      STATE.data.llcState = c.state || '';
      STATE.data.llcEIN = c.ein || '';
      STATE.data.llcAddress = c.address || '';
      STATE.data.llcCity = c.city || '';
      STATE.data.llcAddrState = c.addrState || '';
      STATE.data.llcZip = c.zip || '';
    }
  }
  render();
}

function scheduleAutoSave() {
  if (SAVE_TIMER) clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(autoSave, 1500);
}

function autoSave() {
  if (SAVING) return;
  SAVING = true;
  var dataToSave = packDataForSave();

  if (REVIEW_MODE) {
    var opts = {}; if (STATE.reviewOwner) opts.owner = STATE.reviewOwner; if (STATE.reviewLoanId) opts.loanId = STATE.reviewLoanId;
    SLA.BorrowerInfo.saveAuth(STATE.reviewClientId, dataToSave, opts).then(function(resp) {
      SAVING = false;
      // Deploy 236.55 — surface signed-PDF regeneration in the status
      // line so the LO sees a clear confirmation that their correction
      // also flowed through to the printed application.
      var suffix = (resp && resp.signedAppRegenerated)
        ? ' (LO edit · signed application updated)'
        : ' (LO edit)';
      setSaveStatus('Saved ' + nowTime() + suffix, 'ok');
    }).catch(function(err) {
      SAVING = false;
      setSaveStatus((err && err.message) || 'Save failed', 'err');
    });
    return;
  }

  fetch('/api/borrower-info-save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ t: TOKEN, data: dataToSave }),
  })
    .then(function(r) { return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(resp) {
      SAVING = false;
      if (resp.ok) setSaveStatus('Saved ' + nowTime(), 'ok');
      else setSaveStatus(resp.data.error || 'Save failed', 'err');
    })
    .catch(function() {
      SAVING = false;
      setSaveStatus('Save failed — check connection', 'err');
    });
}

// Convert the flat-keyed STATE.data into the nested structure the server stores
function packDataForSave() {
  var d = STATE.data;
  var out = {};
  // Copy all top-level fields
  Object.keys(d).forEach(function(k) {
    if (!k.startsWith('g0_') && !k.startsWith('g1_')) out[k] = d[k];
  });
  // Build guarantors array from g0_/g1_ prefixed fields
  var gs = [];
  ['0', '1'].forEach(function(i) {
    var p = 'g' + i + '_';
    var g = {};
    var hasAny = false;
    Object.keys(d).forEach(function(k) {
      if (k.indexOf(p) === 0) {
        var key = k.slice(p.length);
        g[key] = d[k];
        if (d[k]) hasAny = true;
      }
    });
    if (hasAny) gs.push(g);
  });
  if (gs.length) out.guarantors = gs;

  // Item #8: Build the companies array. If borrower has filled in LLC fields,
  // emit one company entry. Merge with the prior companies list so we don't
  // wipe out previously-saved entities.
  if (d.hasLLC === 'yes' && (d.llcName || d.llcEIN)) {
    // Try to find an existing entity that matches by name+EIN (case-insensitive
    // on name) before creating a new id. This prevents duplicates from autosave
    // firing repeatedly while the borrower is still typing.
    var nm = String(d.llcName || '').trim().toLowerCase();
    var ein = String(d.llcEIN || '').replace(/\D/g,'');
    var existingMatch = (STATE.companies || []).find(function(c) {
      var cn = String(c.name || '').trim().toLowerCase();
      var ce = String(c.ein || '').replace(/\D/g,'');
      // Match if EIN matches OR name matches AND we have one of them
      return (ein && ce && ein === ce) || (nm && cn && nm === cn);
    });
    var companyId = d.llcId || d.entityChoice;
    if (companyId === '__new') companyId = null;
    if (!companyId && existingMatch) companyId = existingMatch.id;
    if (!companyId) {
      companyId = 'co_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    }
    // Save the resolved id back so subsequent autosaves reuse it
    d.llcId = companyId;
    var current = {
      id: companyId,
      name: d.llcName || '',
      state: d.llcState || '',
      ein: d.llcEIN || '',
      address: d.llcAddress || '',
      city: d.llcCity || '',
      addrState: d.llcAddrState || '',
      zip: d.llcZip || '',
    };
    var merged = (STATE.companies || []).filter(function(c) { return c.id !== current.id; });
    merged.unshift(current);
    out.companies = merged;
    // Update STATE.companies too so the next autosave sees the latest list
    STATE.companies = merged;
  }

  return out;
}

function setSaveStatus(text, cls) {
  var el = document.getElementById('saveStatus');
  if (!el) return;
  el.className = 'save-status ' + (cls || '');
  el.textContent = text;
}

function bindAutoSave() {
  // Initial save status reflects whatever state we loaded with
  setSaveStatus(STATE.status === 'in_progress' ? 'Resumed where you left off' : '', '');
}

// ─────────────────────────────────────────────────────────
// Navigation

function goNext() {
  if (!validateCurrentPage()) return;
  // Force a flush save before navigating
  if (SAVE_TIMER) { clearTimeout(SAVE_TIMER); SAVE_TIMER = null; }
  autoSave();
  STATE.page++;
  renderApp();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goPrev() {
  STATE.page--;
  renderApp();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Deploy 183: jump to a specific page and focus a specific field.
// Used by the "Fix it" buttons in the page-5 address validation
// errors so the borrower lands on the offending field instead of
// hunting for it.
function goToPageAndFocus(pageNum, fieldId) {
  STATE.page = pageNum;
  renderApp();
  // Wait a tick for the DOM to mount, then scroll the field into
  // view and select its text so the borrower can immediately re-type
  // or re-pick.
  setTimeout(function() {
    var el = document.getElementById(fieldId);
    if (!el) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(function() {
      try { el.focus(); el.select && el.select(); } catch (_) {}
    }, 350);
  }, 60);
}

// ════════════════════════════════════════════════════════════════════
// Deploy 236.127 — Guarantor ownership-total pre-submit gate
// ════════════════════════════════════════════════════════════════════
// Mike's spec: if the recorded combined ownership of all guarantors
// is under Diya's 51% requirement, give the borrower a choice on
// submit:
//   • "Add now"   — drop them on Page 4 with the # of guarantors
//                    radio highlighted green so they can bump the
//                    count and fill in the new guarantor's required
//                    fields (only first/last/email/phone/ownership
//                    are required at app time per renderGuarantor).
//   • "Submit anyway" — set _ownershipDeferAcknowledged on data so
//                    we don't re-prompt, mark the data with
//                    _checkOwnershipFlag, and continue the existing
//                    signApplication flow.

function _computeGuarantorOwnershipTotal() {
  var d = STATE.data;
  var n = parseInt(d.numGuarantors || '1', 10) || 1;
  var total = 0;
  var any = false;
  for (var i = 0; i < n; i++) {
    var raw = d['g' + i + '_ownership'];
    if (raw === undefined || raw === null || raw === '') continue;
    var pct = parseFloat(raw);
    if (!isFinite(pct)) continue;
    any = true;
    total += pct;
  }
  return { total: total, count: n, any: any };
}

function _openOwnershipDecisionModal(info, resumeFn) {
  // Build overlay + modal once per invocation (no leftover state).
  var existing = document.getElementById('ownershipDecisionBg');
  if (existing) existing.remove();
  var bg = document.createElement('div');
  bg.id = 'ownershipDecisionBg';
  bg.style.cssText = 'position:fixed;inset:0;background:rgba(38,26,54,0.55);display:flex;align-items:center;justify-content:center;z-index:9000;padding:1rem';
  var modal = document.createElement('div');
  modal.style.cssText = 'background:#fff;border-radius:10px;padding:24px 28px;max-width:520px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,0.18);font-family:"DM Sans",sans-serif';
  modal.innerHTML =
    '<h3 style="font-family:\'Lora\',serif;font-size:18px;color:#7a5218;margin:0 0 8px">⚠ Guarantor ownership is below 51%</h3>' +
    '<p style="font-size:13px;color:#1a1520;line-height:1.55;margin:0 0 10px">' +
      'Recorded total is <strong>' + info.total.toFixed(2) + '%</strong> across <strong>' + info.count +
      ' guarantor' + (info.count === 1 ? '' : 's') + '</strong>. ' +
      'Diya requires guarantors to combined own at least <strong>51%</strong> of the vesting LLC.' +
    '</p>' +
    '<p style="font-size:13px;color:#1a1520;line-height:1.55;margin:0 0 18px">' +
      'You can add the additional guarantors now, or submit this application now and have your loan officer add them before close.' +
    '</p>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">' +
      '<button type="button" id="ownDecisionLater" style="padding:9px 18px;background:#fff;border:1px solid #ddd8d0;border-radius:5px;font-size:13px;font-weight:600;color:#7a7488;cursor:pointer;font-family:inherit">Submit now, add later</button>' +
      '<button type="button" id="ownDecisionNow"   style="padding:9px 18px;background:#C8813A;border:1px solid #C8813A;border-radius:5px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit">Add additional guarantors now</button>' +
    '</div>';
  bg.appendChild(modal);
  document.body.appendChild(bg);

  document.getElementById('ownDecisionLater').onclick = function() {
    // Acknowledge and flag — Loan Details surfaces it as a banner
    // (the 236.126 ownership banner already fires when the synced
    // loan.guarantorOwnership map totals < 51%).
    STATE.data._ownershipDeferAcknowledged = true;
    STATE.data._checkOwnershipFlag = {
      acknowledgedAt: new Date().toISOString(),
      total: info.total,
      count: info.count,
    };
    bg.remove();
    // Persist the flag, then resume the original signApplication
    // call. The check above on _ownershipDeferAcknowledged keeps
    // it from re-prompting.
    if (window.SLA && SLA.BorrowerInfo && SLA.BorrowerInfo.save) {
      SLA.BorrowerInfo.save(TOKEN, packDataForSave()).then(function() {
        if (typeof resumeFn === 'function') resumeFn();
      }).catch(function() {
        if (typeof resumeFn === 'function') resumeFn();
      });
    } else if (typeof resumeFn === 'function') {
      resumeFn();
    }
  };
  document.getElementById('ownDecisionNow').onclick = function() {
    bg.remove();
    _highlightNumGuarantors();
  };
}

function _highlightNumGuarantors() {
  // Jump to Page 4 (Vesting & Guarantors) and flash a green ring
  // around the # of guarantors radio group so it's unmistakable.
  STATE.page = 4;
  renderApp();
  setTimeout(function() {
    var fieldWrap = document.querySelector('[data-name="numGuarantors"]');
    if (!fieldWrap) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    fieldWrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
    fieldWrap.style.transition = 'box-shadow 0.25s, background 0.25s, border-radius 0.25s';
    fieldWrap.style.background = 'rgba(34,139,34,0.10)';
    fieldWrap.style.boxShadow = '0 0 0 3px rgba(34,139,34,0.55)';
    fieldWrap.style.borderRadius = '8px';
    fieldWrap.style.padding = '10px';
    // Pulse a second highlight after 1.2s so the borrower's eye
    // catches it even if they just glanced away mid-scroll.
    setTimeout(function() {
      fieldWrap.style.boxShadow = '0 0 0 6px rgba(34,139,34,0.30)';
      setTimeout(function() {
        fieldWrap.style.boxShadow = '0 0 0 3px rgba(34,139,34,0.55)';
      }, 350);
    }, 1200);
  }, 80);
}

function submitFinal() {
  if (!validateCurrentPage()) return;
  var btn = event.target;
  btn.disabled = true; btn.textContent = 'Submitting…';
  var dataToSave = packDataForSave();

  if (REVIEW_MODE) {
    // LO review: this is the final "Save & Close" — no completion event
    var opts = {}; if (STATE.reviewOwner) opts.owner = STATE.reviewOwner; if (STATE.reviewLoanId) opts.loanId = STATE.reviewLoanId;
    SLA.BorrowerInfo.saveAuth(STATE.reviewClientId, dataToSave, opts).then(function(resp) {
      // Deploy 236.55 — if the borrower has already signed, the server
      // regenerated the printed PDF with the LO's corrections. Confirm
      // explicitly so the LO knows the signed application is fresh.
      showToast(resp && resp.signedAppRegenerated
        ? 'Edits saved · signed application updated'
        : 'Edits saved');
      btn.disabled = false; btn.textContent = 'Save edits';
    }).catch(function(err) {
      btn.disabled = false; btn.textContent = 'Save edits';
      showToast('Save failed: ' + ((err && err.message) || 'unknown'));
    });
    return;
  }

  fetch('/api/borrower-info-save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ t: TOKEN, data: dataToSave, complete: true }),
  })
    .then(function(r) { return r.json().then(function(d){ return { ok: r.ok, data: d }; }); })
    .then(function(resp) {
      if (resp.ok) {
        showComplete();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        btn.disabled = false; btn.textContent = 'Submit information';
        showToast('Submit failed: ' + (resp.data.error || 'unknown'));
      }
    })
    .catch(function() {
      btn.disabled = false; btn.textContent = 'Submit information';
      showToast('Submit failed — check connection');
    });
}

// LO-only path. Final submission on behalf of the borrower — flips the
// application status to 'complete' and triggers the auto-advance to
// APPROVED on the loan. Same end-state as the borrower clicking Submit
// themselves, just initiated by the LO. We don't run validateCurrentPage
// here: in review mode the LO is responsible for whatever's filled
// in, and locking them out of submission for missing fields would be
// counter-productive (the whole point is they're correcting/completing
// what the borrower didn't finish). They get a confirmation prompt
// instead so they don't fire it accidentally.
function submitOnBehalf() {
  if (!REVIEW_MODE) return;
  if (!confirm(
    'Submit this application on behalf of the borrower?\n\n' +
    'This will:\n' +
    '  • Mark the application as complete\n' +
    '  • Move the loan from "Awaiting Application" to "In Processing"\n' +
    '  • Sync property fields back to the loan record\n\n' +
    'You should only do this when you\'ve confirmed the information with the borrower.'
  )) return;

  var btn = event.target;
  btn.disabled = true; btn.textContent = 'Submitting…';
  var dataToSave = packDataForSave();
  var opts = { complete: true };
  if (STATE.reviewOwner)  opts.owner  = STATE.reviewOwner;
  if (STATE.reviewLoanId) opts.loanId = STATE.reviewLoanId;

  SLA.BorrowerInfo.saveAuth(STATE.reviewClientId, dataToSave, opts).then(function(resp) {
    // Update local status so the next render shows the post-submission
    // button layout (just "Save edits"). Surface advance-result issues
    // so the LO sees them — if the auto-advance bailed for some reason
    // they need to know the loan didn't actually move.
    STATE.reviewStatus = 'complete';
    if (resp && resp.advanceResult && !resp.advanceResult.ok) {
      showToast('Submitted — but loan auto-advance failed: ' + (resp.advanceResult.reason || 'unknown'));
    } else {
      showToast('Submitted on behalf of borrower. Loan moved to In Processing.');
    }
    btn.disabled = false;
    renderApp();   // re-render so button bar updates
  }).catch(function(err) {
    btn.disabled = false; btn.textContent = 'Submit on behalf of borrower';
    showToast('Submit failed: ' + ((err && err.message) || 'unknown'));
  });
}

function validateCurrentPage() {
  var ok = true;
  // Walk every visible field, check required
  document.querySelectorAll('.field').forEach(function(f) {
    var name = f.dataset.name;
    if (!name) return;
    var label = f.querySelector('label');
    if (!label || !label.querySelector('.req')) return; // not required
    var val = STATE.data[name];
    var errEl = f.querySelector('.err');
    if (!val || String(val).trim() === '') {
      if (errEl) errEl.textContent = 'Required';
      ok = false;
    } else {
      if (errEl) errEl.textContent = '';
    }
  });
  if (!ok) {
    showToast('Please fill in all required fields');
    // Scroll to first error
    var firstErr = document.querySelector('.err:not(:empty)');
    if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  return ok;
}

// ─────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────
function nowTime() {
  var d = new Date();
  var h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  var ampm = h >= 12 ? 'pm' : 'am';
  return ((h % 12) || 12) + ':' + m + ampm;
}

function humanize(s) {
  // If it looks like an email, take the localpart and humanize
  s = String(s || '');
  if (s.indexOf('@') > 0) s = s.split('@')[0];
  return s.split(/[._\-]+/).filter(Boolean).map(function(w){
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(' ');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3500);
}

function escH(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function stateOptions() {
  var states = ['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];
  var opts = [{ v: '', l: '— Select —' }];
  states.forEach(function(s){ opts.push({ v: s, l: s }); });
  return opts;
}
